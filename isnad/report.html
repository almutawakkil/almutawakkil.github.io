    :root{font-family:"Amiri",serif;color:#172c25;background:#edf2ef}*{box-sizing:border-box}body{margin:0}.print-toolbar{position:sticky;top:0;z-index:2;display:flex;justify-content:center;align-items:center;gap:12px;padding:10px;background:#173f34;color:#fff}.print-toolbar button{font:700 17px "Amiri",serif;border:0;border-radius:8px;background:#fff;color:#173f34;padding:7px 18px;cursor:pointer}.print-toolbar span{font-size:14px}.report{width:210mm;margin:18px auto;background:#fff;padding:16mm 17mm;box-shadow:0 8px 35px #18392f22}.report-header{text-align:center;border-bottom:2px solid #d8c693;padding-bottom:5mm;margin-bottom:5mm}.kicker{font-size:14px;color:#687b73}.report-header h1{font-size:27px;line-height:1.35;margin:1mm 0 3mm;color:#173f34}.matn{font-size:18px;line-height:1.9;text-align:justify;margin:3mm auto;padding:3mm 4mm;border-block:1px solid #e4ddd0;white-space:pre-wrap}.attribution{font-size:15px;color:#5b6e66;margin-top:2mm}.direction-note{font-size:13px;color:#66776f;margin:0 0 5mm}.chains{margin:0;padding:0 10mm 0 0;list-style-type:arabic-indic}.chain-entry{break-inside:avoid;page-break-inside:avoid;margin:0 0 7mm;padding:0 0 5mm;border-bottom:1px solid #dfe7e2}.chain-entry h2{display:flex;align-items:baseline;justify-content:space-between;gap:5mm;margin:0 0 2mm;font-size:18px;color:#173f34}.chain-entry h2 small{font-weight:400;font-size:12px;color:#6d7d76}.chain-path{font-size:17px;line-height:2;text-align:right;overflow-wrap:anywhere}.wording-line,.source,.chain-note{font-size:13px;line-height:1.8;margin-top:1mm}.wording-line{color:#6d552b}.source{color:#53675f}.chain-note{color:#5e466b}.notes-section{break-before:page}.notes-section>h2{font-size:22px;color:#173f34;border-bottom:2px solid #d8c693;padding-bottom:2mm}.notes-list{padding-right:9mm;list-style-type:arabic-indic}.notes-list li{break-inside:avoid;page-break-inside:avoid;margin-bottom:3mm;line-height:1.8}.research-notes{break-inside:avoid;page-break-inside:avoid;margin-top:5mm;padding:4mm 5mm;background:#f5f8f6;border-right:3px solid #417c66;white-space:pre-wrap;line-height:1.8}.empty{color:#697a73;text-align:center}.report-footer{margin-top:8mm;padding-top:3mm;border-top:1px solid #dfe6e2;color:#76857f;text-align:center;font-size:10px}.error{color:#8b2e35;text-align:center;padding:40px;font-size:20px}@page{size:A4 portrait;margin:14mm}
    @media print{html,body{background:#fff!important}.print-toolbar{display:none}.report{width:auto;margin:0;padding:0;box-shadow:none}.chain-entry,.notes-list li,.research-notes{break-inside:avoid;page-break-inside:avoid}.report-header{break-after:avoid}.chain-path{text-align:justify}}
    @media(max-width:760px){.report{width:calc(100% - 20px);padding:24px 18px}.print-toolbar{flex-wrap:wrap}.chain-entry h2{display:block}.chain-entry h2 small{display:block;margin-top:4px}}
    .chains{padding:0;list-style:none}.chain-entry{display:block;break-inside:avoid-page;page-break-inside:avoid}.chain-entry h2,.chain-entry h2 span{display:block;break-inside:avoid;page-break-inside:avoid;break-after:avoid-page;page-break-after:avoid;white-space:nowrap;orphans:2;widows:2}.structure-report{break-inside:avoid-page;margin:0 0 6mm;padding:4mm 5mm;background:#f5f8f6;border-right:3px solid #417c66}.structure-report h2{margin:0 0 2mm;font-size:20px;color:#173f34}.structure-report p{margin:1mm 0;line-height:1.75;font-size:14px}.notes-list li{white-space:pre-wrap;overflow-wrap:anywhere;text-align:right}
  </style>
