<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>الرقية · المتوكل</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap"
    rel="stylesheet"
  />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Amiri", Georgia, serif;
      background: #f6f5f0;
      color: #1a1a18;
      line-height: 1.7;
    }

    .wrap {
      width: 100%;
      max-width: 900px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 42px 20px 32px;

      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    header {
      width: 100%;
      max-width: 780px;
      margin: 0 auto 28px;
      direction: ltr;
    }

    .top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }

    .arabic {
      font-family: "Amiri", Georgia, serif;
      font-size: 36px;
      line-height: 1.1;
      margin: 0;
      font-weight: 400;
    }

    .subtitle {
      margin: 5px 0 0;
      color: #6e6d67;
      font-size: 16px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 18px;
      padding-bottom: 4px;
    }

    nav a {
      font-family: "Amiri", Georgia, serif;
      color: #6e6d67;
      text-decoration: none;
      font-size: 16px;
    }

    nav a:hover,
    nav a.active {
      color: #27500a;
    }

    /* READER */

    .reader {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
    }

    .dhikr-card {
      width: 100%;
      min-height: 430px;

      background: #fff;
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 18px;

      padding: 46px 42px 34px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .dhikr-text {
      width: 100%;
      max-width: 760px;
      margin: auto 0;

      font-size: clamp(31px, 5vw, 44px);
      line-height: 2.1;
      font-weight: 400;

      direction: rtl;
      text-align: center;
      white-space: pre-line;
    }

    .dhikr-text.medium {
      font-size: clamp(27px, 4.4vw, 38px);
      line-height: 2.5;
    }

    .dhikr-text.long {
      font-size: clamp(23px, 3.8vw, 32px);
      line-height: 2.5;
    }

    .dhikr-text.very-long {
      font-size: clamp(19px, 3vw, 27px);
      line-height: 2.5;
    }

    .dhikr-link {
      color: inherit;
      text-decoration: none;
    }

    .dhikr-link:hover {
      color: inherit;
    }

    /* COUNTER */

    .counter {
      display: none;
      margin-top: 18px;

      font-family: "Amiri", Georgia, serif;
      font-size: 21px;
      line-height: 1.2;
      font-weight: 400;

      color: #8b8982;
      direction: ltr;
      text-align: center;

      user-select: none;
      -webkit-user-select: none;
    }

    .counter.complete {
      color: #27500a;
    }

    .dhikr-card.countable {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* ARROWS + SOURCE */

    .controls {
      width: 100%;
      max-width: 260px;
      margin-top: 34px;

      display: flex;
      direction: ltr;
      align-items: center;
      justify-content: space-between;
    }

    .arrow {
      font-family: "Amiri", Georgia, serif;
      appearance: none;
      border: none;
      background: transparent;
      color: #77756e;

      font-size: 34px;
      line-height: 1;

      padding: 10px 16px;
      cursor: pointer;
      border-radius: 10px;
    }

    .arrow:hover {
      color: #27500a;
      background: rgba(0,0,0,.035);
    }

    .arrow:disabled {
      opacity: .22;
      cursor: default;
      background: transparent;
    }

    .source-marker {
      font-family: "Amiri", Georgia, serif;
      font-size: 16px;
      font-weight: 400;
      color: #9a9891;
      direction: rtl;
      unicode-bidi: isolate;
      text-align: center;
      min-width: 40px;
    }

    /* MOBILE */

    @media (max-width: 600px) {
      .wrap {
        padding: 28px 14px 18px;
      }

      header {
        max-width: none;
        margin-bottom: 18px;
      }

      .top {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .arabic {
        font-size: 32px;
      }

      nav {
        gap: 14px;
      }

      nav a {
        font-size: 15px;
      }

      .dhikr-card {
        min-height: calc(100vh - 190px);
        border-radius: 14px;
        padding: 28px 20px 22px;
      }

      .dhikr-text {
        font-size: clamp(29px, 8.5vw, 38px);
        line-height: 1.95;
      }

      .dhikr-text.medium {
        font-size: clamp(25px, 7.3vw, 33px);
      }

      .dhikr-text.long {
        font-size: clamp(21px, 6vw, 28px);
      }

      .dhikr-text.very-long {
        font-size: clamp(17px, 4.7vw, 23px);
      }

      .counter {
        font-size: 19px;
        margin-top: 14px;
      }

      .source-marker {
        font-size: 15px;
      }
    }

    /* DARK MODE */

    @media (prefers-color-scheme: dark) {
      body {
        background: #1b1a18;
        color: #f2efe8;
      }

      .dhikr-card {
        background: #22211f;
        border-color: rgba(255,255,255,.08);
      }

      .subtitle,
      nav a,
      .arrow,
      .source-marker,
      .counter {
        color: #9b9890;
      }

      nav a:hover,
      nav a.active,
      .arrow:hover,
      .counter.complete {
        color: #b8d98d;
      }

      .arrow:hover {
        background: rgba(255,255,255,.04);
      }
    }
  </style>
</head>

<body>

  <main class="wrap">

    <header>
      <div class="top">

        <div>
          <h1 class="arabic">المتوكل</h1>
          <p class="subtitle">Islamic Library</p>
        </div>

        <nav>
          <a href="index.html">Translated Works</a>
          <a href="excerpts.html">Classical Excerpts</a>
          <a href="40.html" lang="ar" dir="rtl">الأربعون للمتوكل</a>
          <a href="adhkar.html" class="active" lang="ar" dir="rtl">الأذكار</a>
          <a href="night.html">Night Calculator</a>
        </nav>

      </div>
    </header>


    <section class="reader">

      <div
        id="dhikrCard"
        class="dhikr-card">

        <div
          id="dhikrText"
          class="dhikr-text">
        </div>

        <div
          id="counter"
          class="counter">
        </div>

        <div class="controls">

          <button
            id="previousButton"
            class="arrow"
            type="button"

            ←
          </button>

          <span
            id="sourceMarker"
            class="source-marker">
          </span>

          <button
            id="nextButton"
            class="arrow"
            type="button"
            aria-label="Next">
            →
          </button>

        </div>

      </div>

    </section>

  </main>


  <script>

    const adhkar = [

      `﴿بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ ۝ ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَـٰلَمِينَ ۝ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ ۝ مَـٰلِكِ يَوْمِ ٱلدِّينِ ۝ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ ۝ ٱهْدِنَا ٱلصِّرَٰطَ ٱلْمُسْتَقِيمَ ۝ صِرَٰطَ ٱلَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ وَلَا ٱلضَّآلِّينَ﴾`,

      `﴿ٱللَّهُ لَآ إِلَـٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُ ۚ لَا تَأْخُذُهُۥ سِنَةٌۭ وَلَا نَوْمٌۭ ۚ لَّهُۥ مَا فِى ٱلسَّمَـٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَىْءٍۢ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَ ۚ وَسِعَ كُرْسِيُّهُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضَ ۖ وَلَا يَـُٔودُهُۥ حِفْظُهُمَا ۚ وَهُوَ ٱلْعَلِىُّ ٱلْعَظِيمُ﴾`,

      `﴿ءَامَنَ ٱلرَّسُولُ بِمَآ أُنزِلَ إِلَيْهِ مِن رَّبِّهِۦ وَٱلْمُؤْمِنُونَ ۚ كُلٌّ ءَامَنَ بِٱللَّهِ وَمَلَـٰٓئِكَتِهِۦ وَكُتُبِهِۦ وَرُسُلِهِۦ لَا نُفَرِّقُ بَيْنَ أَحَدٍۢ مِّن رُّسُلِهِۦ ۚ وَقَالُوا۟ سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ ٱلْمَصِيرُ ۝ لَا يُكَلِّفُ ٱللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا ٱكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَآ إِن نَّسِينَآ أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَآ إِصْرًۭا كَمَا حَمَلْتَهُۥ عَلَى ٱلَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِۦ ۖ وَٱعْفُ عَنَّا وَٱغْفِرْ لَنَا وَٱرْحَمْنَآ ۚ أَنتَ مَوْلَىٰنَا فَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَـٰفِرِينَ﴾`,

      `﴿وَأَوْحَيْنَآ إِلَىٰ مُوسَىٰٓ أَنْ أَلْقِ عَصَاكَ ۖ فَإِذَا هِىَ تَلْقَفُ مَا يَأْفِكُونَ ۝ فَوَقَعَ ٱلْحَقُّ وَبَطَلَ مَا كَانُوا۟ يَعْمَلُونَ ۝ فَغُلِبُوا۟ هُنَالِكَ وَٱنقَلَبُوا۟ صَـٰغِرِينَ﴾`,

      `﴿وَقَالَ فِرْعَوْنُ ٱئْتُونِى بِكُلِّ سَـٰحِرٍ عَلِيمٍۢ ۝ فَلَمَّا جَآءَ ٱلسَّحَرَةُ قَالَ لَهُم مُّوسَىٰٓ أَلْقُوا۟ مَآ أَنتُم مُّلْقُونَ ۝ فَلَمَّآ أَلْقَوْا۟ قَالَ مُوسَىٰ مَا جِئْتُم بِهِ ٱلسِّحْرُ ۖ إِنَّ ٱللَّهَ سَيُبْطِلُهُۥٓ ۖ إِنَّ ٱللَّهَ لَا يُصْلِحُ عَمَلَ ٱلْمُفْسِدِينَ ۝ وَيُحِقُّ ٱللَّهُ ٱلْحَقَّ بِكَلِمَـٰتِهِۦ وَلَوْ كَرِهَ ٱلْمُجْرِمُونَ﴾`,

      `﴿قَالُوا۟ يَـٰمُوسَىٰٓ إِمَّآ أَن تُلْقِىَ وَإِمَّآ أَن نَّكُونَ أَوَّلَ مَنْ أَلْقَىٰ ۝ قَالَ بَلْ أَلْقُوا۟ ۖ فَإِذَا حِبَالُهُمْ وَعِصِيُّهُمْ يُخَيَّلُ إِلَيْهِ مِن سِحْرِهِمْ أَنَّهَا تَسْعَىٰ ۝ فَأَوْجَسَ فِى نَفْسِهِۦ خِيفَةًۭ مُّوسَىٰ ۝ قُلْنَا لَا تَخَفْ إِنَّكَ أَنتَ ٱلْأَعْلَىٰ ۝ وَأَلْقِ مَا فِى يَمِينِكَ تَلْقَفْ مَا صَنَعُوٓا۟ ۖ إِنَّمَا صَنَعُوا۟ كَيْدُ سَـٰحِرٍۢ ۖ وَلَا يُفْلِحُ ٱلسَّاحِرُ حَيْثُ أَتَىٰ﴾`,

      `﴿قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ ٱلنَّفَّـٰثَـٰتِ فِى ٱلْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ﴾`,

      `﴿قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ ۝ مَلِكِ ٱلنَّاسِ ۝ إِلَـٰهِ ٱلنَّاسِ ۝ مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ ۝ ٱلَّذِى يُوَسْوِسُ فِى صُدُورِ ٱلنَّاسِ ۝ مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ﴾`,

      `بِاسْمِ اللهِ، تُرْبَةُ أَرْضِنَا، بِرِيقَةِ بَعْضِنَا، يُشْفَى سَقِيمُنَا، بِإِذْنِ رَبِّنَا`,

      `اللَّهُمَّ رَبَّ النَّاسِ، مُذْهِبَ الْبَاسِ، اشْفِ أَنْتَ الشَّافِي، لَا شَافِيَ إِلَّا أَنْتَ، شِفَاءً لَا يُغَادِرُ سَقَمًا`,

      `أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّةِ، مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ، وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ`,

      `بِاسْمِ اللهِ أَرْقِيكَ، مِنْ كُلِّ شَيْءٍ يُؤْذِيكَ، مِنْ شَرِّ كُلِّ نَفْسٍ أَوْ عَيْنِ حَاسِدٍ، اللهُ يَشْفِيكَ، بِاسْمِ اللهِ أَرْقِيكَ`,

      `بِاسْمِ اللهِ`,

      `أَعُوذُ بِاللهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ`

    ];


    /*
      Only the three middle Qur'anic passages are linked.

      The first three Qur'anic cards and the Mu'awwidhatayn
      intentionally have no hyperlinks.
    */

    const links = [

      null,
      null,
      null,

      `https://quran.com/7/117-119`,
      `https://quran.com/10/79-82`,
      `https://quran.com/20/65-69`,

      null,
      null,

      null,
      null,
      null,
      null,
      null,
      null

    ];


    const sources = [

      ``,
      ``,
      ``,
      ``,
      ``,
      ``,
      ``,
      ``,

      `خ`,
      `خ`,
      `خ`,
      `م`,
      `م`,
      `م`

    ];


    /*
      Every item with a prescribed repetition count
      has a counter.

      Array indexes begin at 0:

      12 = بسم الله — 3
      13 = أعوذ بالله وقدرته... — 7
    */

    const countTargets = {
      12: 3,
      13: 7
    };


    /*
      Each counter is remembered separately
      while this page remains open.

      Nothing is saved to localStorage.
    */

    const counts = {
      12: 0,
      13: 0
    };


    let currentIndex = 0;
    let touchStartX = 0;
    let touchEndX = 0;
    let swipeJustOccurred = false;


    const dhikrCard =
      document.getElementById("dhikrCard");

    const dhikrText =
      document.getElementById("dhikrText");

    const counter =
      document.getElementById("counter");

    const sourceMarker =
      document.getElementById("sourceMarker");

    const previousButton =
      document.getElementById("previousButton");

    const nextButton =
      document.getElementById("nextButton");


    function isCountable() {

      return Object.prototype.hasOwnProperty.call(
        countTargets,
        currentIndex
      );

    }


    function renderCounter() {

      if (!isCountable()) {

        counter.style.display = "none";
        counter.textContent = "";
        counter.classList.remove("complete");
        dhikrCard.classList.remove("countable");

        return;

      }


      const currentCount =
        counts[currentIndex];

      const target =
        countTargets[currentIndex];


      counter.style.display = "block";
      dhikrCard.classList.add("countable");


      if (currentCount >= target) {

        counter.textContent =
          currentCount + " / " + target + " ✓";

        counter.classList.add("complete");

      }

      else {

        counter.textContent =
          currentCount + " / " + target;

        counter.classList.remove("complete");

      }

    }


    function renderDhikr() {

      const text =
        adhkar[currentIndex];

      const link =
        links[currentIndex];


      /*
        Clear the previous card before rendering
        the new text or link.
      */

      dhikrText.innerHTML = "";


      if (link) {

        const anchor =
          document.createElement("a");

        anchor.href = link;
        anchor.target = "_blank";
        anchor.rel = "noopener";
        anchor.className = "dhikr-link";
        anchor.textContent = text;

        dhikrText.appendChild(anchor);

      }

      else {

        dhikrText.textContent = text;

      }


      sourceMarker.textContent =
        sources[currentIndex];


      dhikrText.className =
        "dhikr-text";


      if (text.length > 500) {

        dhikrText.classList.add(
          "very-long"
        );

      }

      else if (text.length > 200) {

        dhikrText.classList.add(
          "long"
        );

      }

      else if (text.length > 130) {

        dhikrText.classList.add(
          "medium"
        );

      }


      renderCounter();


      previousButton.disabled =
        currentIndex === 0;

      nextButton.disabled =
        currentIndex === adhkar.length - 1;


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /*
      Tap or click the card to increase the counter.

      Clicking a Qur'an link does not affect a counter.

      Navigation controls never add a count.

      Swiping also does not accidentally add a count.
    */

    dhikrCard.addEventListener(
      "click",
      function (event) {

        if (
          swipeJustOccurred ||
          event.target.closest(".controls") ||
          event.target.closest(".dhikr-link") ||
          !isCountable()
        ) {
          return;
        }


        const target =
          countTargets[currentIndex];


        if (
          counts[currentIndex] < target
        ) {

          counts[currentIndex]++;

          renderCounter();

        }

      }
    );


    previousButton.addEventListener(
      "click",
      function () {

        if (currentIndex > 0) {

          currentIndex--;

          renderDhikr();

        }

      }
    );


    nextButton.addEventListener(
      "click",
      function () {

        if (
          currentIndex <
          adhkar.length - 1
        ) {

          currentIndex++;

          renderDhikr();

        }

      }
    );


    document.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key === "ArrowLeft" &&
          currentIndex > 0
        ) {

          currentIndex--;

          renderDhikr();

        }


        if (
          event.key === "ArrowRight" &&
          currentIndex <
          adhkar.length - 1
        ) {

          currentIndex++;

          renderDhikr();

        }

      }
    );


    document.addEventListener(
      "touchstart",
      function (event) {

        touchStartX =
          event.changedTouches[0].screenX;

        swipeJustOccurred = false;

      },
      { passive: true }
    );


    document.addEventListener(
      "touchend",
      function (event) {

        touchEndX =
          event.changedTouches[0].screenX;


        const difference =
          touchEndX - touchStartX;


        if (
          Math.abs(difference) < 60
        ) {

          return;

        }


        swipeJustOccurred = true;


        if (
          difference < 0 &&
          currentIndex <
          adhkar.length - 1
        ) {

          currentIndex++;

          renderDhikr();

        }


        if (
          difference > 0 &&
          currentIndex > 0
        ) {

          currentIndex--;

          renderDhikr();

        }


        setTimeout(
          function () {

            swipeJustOccurred = false;

          },
          300
        );

      },
      { passive: true }
    );


    renderDhikr();

  </script>

</body>
</html>
