<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تقرير الأسانيد للطباعة</title>
  <style>
    @font-face{font-family:Amiri;font-weight:400;font-display:swap;src:url("assets/amiri-arabic-400.woff2") format("woff2")}@font-face{font-family:Amiri;font-weight:700;font-display:swap;src:url("assets/amiri-arabic-700.woff2") format("woff2")}*{box-sizing:border-box}body{margin:0;background:#edf2ef;color:#172c25;font-family:Amiri,serif}.print-toolbar{position:sticky;top:0;z-index:2;display:flex;justify-content:center;align-items:center;gap:12px;padding:10px;background:#173f34;color:#fff}.print-toolbar button{font:700 17px Amiri,serif;border:0;border-radius:8px;background:#fff;color:#173f34;padding:7px 18px;cursor:pointer}.print-toolbar span{font-size:14px}.report{width:210mm;margin:18px auto;background:#fff;padding:16mm 17mm;box-shadow:0 8px 35px #18392f22}.report-header{text-align:center;border-bottom:2px solid #d8c693;padding-bottom:5mm;margin-bottom:5mm}.kicker{font-size:14px;color:#687b73}.report-header h1{font-size:27px;line-height:1.35;margin:1mm 0 3mm;color:#173f34}.matn{font-size:18px;line-height:1.9;text-align:justify;margin:3mm auto;padding:3mm 4mm;border-block:1px solid #e4ddd0;white-space:pre-wrap}.attribution{font-size:15px;color:#5b6e66}.structure{break-inside:avoid;margin:0 0 6mm;padding:4mm 5mm;background:#f5f8f6;border-right:3px solid #417c66}.structure h2,.notes h2{margin:0 0 2mm;font-size:20px;color:#173f34}.structure p{margin:1mm 0}.chains{margin:0;padding:0;list-style:none}.chain{break-inside:avoid;page-break-inside:avoid;margin:0 0 7mm;padding:0 0 5mm;border-bottom:1px solid #dfe7e2}.chain h2{font-size:18px;margin:0 0 2mm;color:#173f34}.chain-path{font-size:17px;line-height:2;overflow-wrap:anywhere}.detail{font-size:13px;line-height:1.8;margin-top:1mm;color:#53675f;white-space:pre-wrap}.notes{break-before:page}.notes-list{padding-right:9mm;list-style-type:arabic-indic}.notes-list li{break-inside:avoid;margin-bottom:3mm;line-height:1.8;white-space:pre-wrap}.research-notes{break-inside:avoid;margin-top:5mm;padding:4mm 5mm;background:#f5f8f6;border-right:3px solid #417c66;white-space:pre-wrap}.footer{margin-top:8mm;padding-top:3mm;border-top:1px solid #dfe6e2;color:#76857f;text-align:center;font-size:10px}.error{color:#8b2e35;text-align:center;padding:40px;font-size:20px}@page{size:A4 portrait;margin:14mm}@media print{html,body{background:#fff}.print-toolbar{display:none}.report{width:auto;margin:0;padding:0;box-shadow:none}.chain,.notes-list li,.research-notes{break-inside:avoid;page-break-inside:avoid}}@media(max-width:760px){.report{width:calc(100% - 20px);padding:24px 18px}.print-toolbar{flex-wrap:wrap}}
  </style>
</head>
<body>
  <div class="print-toolbar"><button id="printReport" type="button">طباعة / حفظ PDF</button><span>اختر «حفظ كملف PDF» من نافذة الطباعة.</span></div>
  <main id="report" class="report" aria-live="polite"></main>
  <script src="report.js"></script>
</body>
</html>
