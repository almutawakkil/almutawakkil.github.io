<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Book Clipper</title>

  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f3ee;
      color: #222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .container {
      width: min(760px, calc(100% - 32px));
      margin: 50px auto;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 34px;
    }

    .subtitle {
      color: #666;
      margin-top: 0;
      margin-bottom: 32px;
      line-height: 1.55;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 14px;
      border: 1px solid #dedbd3;
    }

    .section {
      margin-bottom: 26px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input,
    select {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #444;
    }

    .url-row {
      display: flex;
      gap: 8px;
    }

    .url-row input {
      flex: 1;
    }

    #loadBookButton {
      white-space: nowrap;
      padding: 0 18px;
      border: 0;
      border-radius: 8px;
      background: #444;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }

    #loadBookButton:hover {
      background: #222;
    }

    #loadBookButton:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #volumeSection {
      display: none;
    }

    .pages-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .page-row {
      display: flex;
      gap: 8px;
      margin-bottom: 9px;
    }

    .page-row input {
      flex: 1;
    }

    .remove-page {
      width: 45px;
      border: 1px solid #ccc;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
    }

    .remove-page:hover {
      background: #f3f3f3;
    }

    #addPage {
      border: none;
      background: transparent;
      cursor: pointer;
      color: #555;
      font-size: 14px;
    }

    #addPage:hover {
      text-decoration: underline;
    }

    .main-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .main-button:hover {
      background: #000;
    }

    .main-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .small-note {
      margin-top: 10px;
      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }

    #bookInfo {
      display: none;
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #f7f7f5;
      color: #555;
      font-size: 14px;
      line-height: 1.5;
    }

    #status {
      margin-top: 16px;
      min-height: 20px;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      color: #a42121;
    }

    .success {
      color: #266333;
    }

    .loading {
      color: #555;
    }

    #clipSection {
      display: none;
      margin-top: 35px;
    }

    .clip-controls {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
    }

    .secondary-button {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #222;
      cursor: pointer;
      background: white;
      font-size: 15px;
      font-weight: 600;
    }

    .secondary-button.dark {
      background: #222;
      color: white;
    }

    .secondary-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #clipLabel {
      margin-bottom: 12px;
      font-size: 14px;
      color: #666;
    }

    /*
     * Horizontal preview.
     */

    #bookClip {
      margin: auto;
      background: white;
      display: flex;
      align-items: stretch;
      overflow-x: auto;
      width: 100%;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
    }

    #bookClip img {
      display: block;
      width: auto;
      height: 650px;
      max-width: none;
      margin: 0;
      padding: 0;
      flex-shrink: 0;
    }

    .page-divider {
      width: 8px;
      min-width: 8px;
      height: auto;
      background: white;
      flex-shrink: 0;
    }

    @media (max-width: 600px) {
      .container {
        margin: 25px auto;
      }

      .card {
        padding: 20px;
      }

      h1 {
        font-size: 28px;
      }

      .url-row {
        flex-direction: column;
      }

      #loadBookButton {
        padding: 12px;
      }

      .clip-controls {
        flex-direction: column;
      }

      #bookClip img {
        height: 480px;
      }
    }
  </style>
</head>


<body>

<main class="container">

  <h1>Book Clipper</h1>

  <p class="subtitle">
    Turn selected pages from an Internet Archive book into one
    horizontal PDF for quoting, highlighting, and sharing.
  </p>


  <div class="card">

    <!-- ARCHIVE LINK -->

    <div class="section">

      <label for="archiveUrl">
        Internet Archive link
      </label>

      <div class="url-row">

        <input
          id="archiveUrl"
          type="url"
          placeholder="https://archive.org/details/..."
        >

        <button
          id="loadBookButton"
          type="button"
        >
          Load Volumes
        </button>

      </div>

      <div id="bookInfo"></div>

    </div>


    <!-- VOLUME SELECTION -->

    <div
      id="volumeSection"
      class="section"
    >

      <label for="volumeSelect">
        Volume / PDF
      </label>

      <select id="volumeSelect"></select>

      <div class="small-note">
        Choose the volume containing the pages you were reading.
      </div>

    </div>


    <!-- PAGE SELECTION -->

    <div class="section">

      <div class="pages-title">

        <label style="margin:0;">
          PDF pages
        </label>

        <button
          id="addPage"
          type="button"
        >
          + Add page
        </button>

      </div>


      <div id="pageInputs">

        <div class="page-row">

          <input
            class="page-number"
            type="number"
            min="1"
            placeholder="PDF page number"
          >

          <button
            class="remove-page"
            type="button"
            aria-label="Remove page"
          >
            ×
          </button>

        </div>

      </div>


      <div class="small-note">
        Maximum 4 pages. They appear left to right in exactly
        the order entered. Example: 500, 501, 1.
      </div>

    </div>


    <button
      id="createButton"
      class="main-button"
      type="button"
      disabled
    >
      Create Clip
    </button>


    <div id="status"></div>

  </div>


  <!-- RESULT -->

  <section id="clipSection">

    <div id="clipLabel"></div>

    <div class="clip-controls">

      <button
        id="savePdfButton"
        class="secondary-button dark"
        type="button"
      >
        Download PDF
      </button>

      <button
        id="newClipButton"
        class="secondary-button"
        type="button"
      >
        New Clip
      </button>

    </div>


    <div id="bookClip"></div>

  </section>

</main>



<script>

  const archiveUrl =
    document.getElementById("archiveUrl");

  const loadBookButton =
    document.getElementById("loadBookButton");

  const volumeSection =
    document.getElementById("volumeSection");

  const volumeSelect =
    document.getElementById("volumeSelect");

  const bookInfo =
    document.getElementById("bookInfo");

  const pageInputs =
    document.getElementById("pageInputs");

  const addPage =
    document.getElementById("addPage");

  const createButton =
    document.getElementById("createButton");

  const status =
    document.getElementById("status");

  const clipSection =
    document.getElementById("clipSection");

  const clipLabel =
    document.getElementById("clipLabel");

  const bookClip =
    document.getElementById("bookClip");

  const savePdfButton =
    document.getElementById("savePdfButton");

  const newClipButton =
    document.getElementById("newClipButton");


  let currentIdentifier =
    null;

  let currentVolumes =
    [];


  function setStatus(
    message,
    type = ""
  ) {

    status.textContent =
      message;

    status.className =
      type;

  }


  function getIdentifier(
    value
  ) {

    value =
      value.trim();


    if (!value) {

      throw new Error(
        "Paste an Internet Archive link first."
      );

    }


    let url;


    try {

      url =
        new URL(value);

    } catch {

      throw new Error(
        "That doesn't look like a valid URL."
      );

    }


    if (
      url.hostname !== "archive.org" &&
      url.hostname !== "www.archive.org"
    ) {

      throw new Error(
        "Please use an archive.org link."
      );

    }


    const parts =
      url.pathname
        .split("/")
        .filter(Boolean);


    const detailsIndex =
      parts.indexOf("details");


    if (
      detailsIndex !== -1 &&
      parts[detailsIndex + 1]
    ) {

      return parts[
        detailsIndex + 1
      ];

    }


    const downloadIndex =
      parts.indexOf("download");


    if (
      downloadIndex !== -1 &&
      parts[downloadIndex + 1]
    ) {

      return parts[
        downloadIndex + 1
      ];

    }


    throw new Error(
      "Couldn't determine the Internet Archive item."
    );

  }


  function encodeArchivePath(
    path
  ) {

    return path
      .split("/")
      .map(part =>
        encodeURIComponent(part)
      )
      .join("/");

  }


  function getBaseName(
    path
  ) {

    return path
      .split("/")
      .pop();

  }


  function prettifyVolumeName(
    name
  ) {

    return name
      .replace(
        /_scandata\.xml$/i,
        ""
      )
      .replace(
        /_text\.pdf$/i,
        ""
      )
      .replace(
        /_bw\.pdf$/i,
        ""
      )
      .replace(
        /\.pdf$/i,
        ""
      )
      .replace(
        /_/g,
        " "
      )
      .replace(
        /\s+/g,
        " "
      )
      .trim();

  }


  function findVolumes(
    metadata
  ) {

    const files =
      Array.isArray(
        metadata.files
      )
        ? metadata.files
        : [];


    const scandataFiles =
      files.filter(
        file => {

          return (
            file.name &&
            file.name
              .toLowerCase()
              .endsWith(
                "_scandata.xml"
              )
          );

        }
      );


    const volumes =
      [];


    for (
      const scandata
      of scandataFiles
    ) {

      const prefix =
        scandata.name.replace(
          /_scandata\.xml$/i,
          ""
        );


      const matchingPdfs =
        files.filter(
          file => {

            if (!file.name) {
              return false;
            }


            const lower =
              file.name
                .toLowerCase();


            if (
              !lower.endsWith(
                ".pdf"
              )
            ) {

              return false;

            }


            return (
              file.name ===
                `${prefix}.pdf`
              ||
              file.name ===
                `${prefix}_text.pdf`
              ||
              file.name ===
                `${prefix}_bw.pdf`
              ||
              file.name.startsWith(
                `${prefix}_`
              )
            );

          }
        );


      const exactPdf =
        matchingPdfs.find(
          file =>
            file.name ===
            `${prefix}.pdf`
        );


      const textPdf =
        matchingPdfs.find(
          file =>
            file.name ===
            `${prefix}_text.pdf`
        );


      const displayPdf =
        exactPdf ||
        textPdf ||
        matchingPdfs[0] ||
        null;


      volumes.push({

        prefix,

        pdfName:
          displayPdf
            ? displayPdf.name
            : null,

        label:
          displayPdf
            ? getBaseName(
                displayPdf.name
              )
            : prettifyVolumeName(
                prefix
              )

      });

    }


    const unique =
      [];


    const seen =
      new Set();


    for (
      const volume
      of volumes
    ) {

      if (
        seen.has(
          volume.prefix
        )
      ) {

        continue;

      }


      seen.add(
        volume.prefix
      );


      unique.push(
        volume
      );

    }


    /*
     * Fallback if scandata files aren't available.
     */

    if (!unique.length) {

      const pdfFiles =
        files.filter(
          file => {

            return (
              file.name &&
              file.name
                .toLowerCase()
                .endsWith(
                  ".pdf"
                )
            );

          }
        );


      for (
        const pdf
        of pdfFiles
      ) {

        let prefix =
          pdf.name;


        prefix =
          prefix.replace(
            /_text\.pdf$/i,
            ""
          );


        prefix =
          prefix.replace(
            /_bw\.pdf$/i,
            ""
          );


        prefix =
          prefix.replace(
            /\.pdf$/i,
            ""
          );


        if (
          seen.has(
            prefix
          )
        ) {

          continue;

        }


        seen.add(
          prefix
        );


        unique.push({

          prefix,

          pdfName:
            pdf.name,

          label:
            getBaseName(
              pdf.name
            )

        });

      }

    }


    unique.sort(
      (a, b) =>
        a.label.localeCompare(
          b.label,
          undefined,
          {
            numeric: true,
            sensitivity: "base"
          }
        )
    );


    return unique;

  }


  function escapeHtml(
    text
  ) {

    const div =
      document.createElement(
        "div"
      );


    div.textContent =
      String(text);


    return div.innerHTML;

  }


  async function loadArchiveItem() {

    try {

      setStatus(
        "Reading Internet Archive files...",
        "loading"
      );


      loadBookButton.disabled =
        true;


      createButton.disabled =
        true;


      volumeSection.style.display =
        "none";


      bookInfo.style.display =
        "none";


      currentIdentifier =
        getIdentifier(
          archiveUrl.value
        );


      const metadataUrl =
        `https://archive.org/metadata/${encodeURIComponent(currentIdentifier)}`;


      const response =
        await fetch(
          metadataUrl
        );


      if (!response.ok) {

        throw new Error(
          "Internet Archive metadata could not be loaded."
        );

      }


      const metadata =
        await response.json();


      if (metadata.error) {

        throw new Error(
          metadata.error
        );

      }


      currentVolumes =
        findVolumes(
          metadata
        );


      if (
        !currentVolumes.length
      ) {

        throw new Error(
          "I couldn't find any readable book volumes in this Archive item."
        );

      }


      volumeSelect.innerHTML =
        "";


      currentVolumes.forEach(
        (
          volume,
          index
        ) => {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            index;


          option.textContent =
            volume.label;


          volumeSelect.appendChild(
            option
          );

        }
      );


      const title =
        metadata.metadata?.title ||
        currentIdentifier;


      bookInfo.innerHTML =
        `<strong>${escapeHtml(title)}</strong><br>` +
        `${currentVolumes.length} book ${
          currentVolumes.length === 1
            ? "volume"
            : "volumes"
        } found.`;


      bookInfo.style.display =
        "block";


      volumeSection.style.display =
        "block";


      createButton.disabled =
        false;


      setStatus(
        currentVolumes.length === 1
          ? "Book loaded. Enter the PDF page number."
          : `Found ${currentVolumes.length} volumes. Choose the one you were reading.`,
        "success"
      );


    } catch (error) {

      console.error(
        error
      );


      setStatus(
        error.message ||
        "Something went wrong.",
        "error"
      );


    } finally {

      loadBookButton.disabled =
        false;

    }

  }


  loadBookButton.addEventListener(
    "click",
    loadArchiveItem
  );


  archiveUrl.addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
        "Enter"
      ) {

        loadArchiveItem();

      }

    }
  );


  function updateRows() {

    const rows =
      document.querySelectorAll(
        ".page-row"
      );


    addPage.style.display =
      rows.length >= 4
        ? "none"
        : "inline-block";


    rows.forEach(
      row => {

        const button =
          row.querySelector(
            ".remove-page"
          );


        button.style.visibility =
          rows.length === 1
            ? "hidden"
            : "visible";

      }
    );

  }


  addPage.addEventListener(
    "click",
    () => {

      const count =
        document.querySelectorAll(
          ".page-row"
        ).length;


      if (
        count >= 4
      ) {

        return;

      }


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "page-row";


      row.innerHTML = `

        <input
          class="page-number"
          type="number"
          min="1"
          placeholder="PDF page number"
        >

        <button
          class="remove-page"
          type="button"
          aria-label="Remove page"
        >
          ×
        </button>

      `;


      pageInputs.appendChild(
        row
      );


      updateRows();


      row
        .querySelector(
          "input"
        )
        .focus();

    }
  );


  pageInputs.addEventListener(
    "click",
    event => {

      if (
        !event.target
          .classList
          .contains(
            "remove-page"
          )
      ) {

        return;

      }


      const rows =
        document.querySelectorAll(
          ".page-row"
        );


      if (
        rows.length <= 1
      ) {

        return;

      }


      event.target
        .closest(
          ".page-row"
        )
        .remove();


      updateRows();

    }
  );


  updateRows();


  function getPages() {

    const inputs =
      [
        ...document.querySelectorAll(
          ".page-number"
        )
      ];


    const pages =
      inputs
        .map(
          input =>
            input.value.trim()
        )
        .filter(
          value =>
            value !== ""
        )
        .map(
          value =>
            Number(value)
        );


    if (
      !pages.length
    ) {

      throw new Error(
        "Enter at least one PDF page."
      );

    }


    if (
      pages.length > 4
    ) {

      throw new Error(
        "Maximum 4 pages."
      );

    }


    for (
      const page
      of pages
    ) {

      if (
        !Number.isInteger(
          page
        )
        ||
        page < 1
      ) {

        throw new Error(
          "Page numbers must be whole numbers starting at 1."
        );

      }

    }


    return pages;

  }


  function loadPageImage(
    identifier,
    prefix,
    pdfPage
  ) {

    return new Promise(
      (
        resolve,
        reject
      ) => {

        const index =
          pdfPage - 1;


        const encodedPrefix =
          encodeArchivePath(
            prefix
          );


        const src =
          `https://archive.org/download/${encodeURIComponent(identifier)}/${encodedPrefix}/page/n${index}_large.jpg`;


        const img =
          new Image();


        img.onload =
          () => {

            if (
              img.naturalWidth < 200 ||
              img.naturalHeight < 200
            ) {

              reject(
                new Error(
                  `Page ${pdfPage} could not be loaded from this volume.`
                )
              );


              return;

            }


            resolve({

              img,

              pdfPage,

              src

            });

          };


        img.onerror =
          () => {

            reject(
              new Error(
                `Could not load page ${pdfPage} from the selected volume.`
              )
            );

          };


        img.src =
          src;

      }
    );

  }


  createButton.addEventListener(
    "click",
    async () => {

      try {

        if (
          !currentIdentifier
        ) {

          throw new Error(
            "Load an Internet Archive book first."
          );

        }


        if (
          !currentVolumes.length
        ) {

          throw new Error(
            "Choose a book volume first."
          );

        }


        const selectedIndex =
          Number(
            volumeSelect.value
          );


        const volume =
          currentVolumes[
            selectedIndex
          ];


        if (
          !volume
        ) {

          throw new Error(
            "Choose a valid volume."
          );

        }


        const pages =
          getPages();


        createButton.disabled =
          true;


        bookClip.innerHTML =
          "";


        clipSection.style.display =
          "none";


        const loadedPages =
          [];


        for (
          let i = 0;
          i < pages.length;
          i++
        ) {

          const page =
            pages[i];


          setStatus(
            `Loading page ${page} (${i + 1} of ${pages.length})...`,
            "loading"
          );


          const loaded =
            await loadPageImage(
              currentIdentifier,
              volume.prefix,
              page
            );


          loadedPages.push(
            loaded
          );

        }


        /*
         * Add images LEFT TO RIGHT.
         */

        loadedPages.forEach(
          (
            item,
            index
          ) => {

            item.img.alt =
              `PDF page ${item.pdfPage}`;


            item.img.title =
              `PDF page ${item.pdfPage}`;


            /*
             * Save useful values directly
             * on the image element.
             */

            item.img.dataset.pdfPage =
              item.pdfPage;


            item.img.dataset.sourceUrl =
              item.src;


            bookClip.appendChild(
              item.img
            );


            if (
              index <
              loadedPages.length - 1
            ) {

              const divider =
                document.createElement(
                  "div"
                );


              divider.className =
                "page-divider";


              bookClip.appendChild(
                divider
              );

            }

          }
        );


        clipLabel.textContent =
          `${volume.label} — PDF pages ${pages.join(", ")}`;


        clipSection.style.display =
          "block";


        setStatus(
          `Done — pages ${pages.join(", ")} are ready.`,
          "success"
        );


        clipSection.scrollIntoView({

          behavior:
            "smooth",

          block:
            "start"

        });


      } catch (error) {

        console.error(
          error
        );


        setStatus(
          error.message ||
          "Something went wrong.",
          "error"
        );


      } finally {

        createButton.disabled =
          false;

      }

    }
  );


  /*
   * DOWNLOAD ONE HORIZONTAL PDF PAGE
   *
   * 1 selected page:
   *
   * [ PAGE 500 ]
   *
   * 2 selected pages:
   *
   * [ PAGE 500 ][ PAGE 1 ]
   *
   * 4 selected pages:
   *
   * [ 500 ][ 501 ][ 502 ][ 1 ]
   */

  savePdfButton.addEventListener(
    "click",
    async () => {

      try {

        const images =
          [
            ...bookClip.querySelectorAll(
              "img"
            )
          ];


        if (
          !images.length
        ) {

          throw new Error(
            "There are no pages to save."
          );

        }


        savePdfButton.disabled =
          true;


        savePdfButton.textContent =
          "Creating PDF...";


        setStatus(
          "Creating horizontal PDF...",
          "loading"
        );


        const {
          PDFDocument
        } =
          PDFLib;


        const pdf =
          await PDFDocument.create();


        /*
         * Every book page has the same
         * height in the finished PDF.
         *
         * Width remains proportional
         * to the original scanned page.
         */

        const targetHeight =
          1600;


        const gap =
          8;


        const embeddedPages =
          [];


        for (
          let i = 0;
          i < images.length;
          i++
        ) {

          const img =
            images[i];


          setStatus(
            `Preparing page ${i + 1} of ${images.length}...`,
            "loading"
          );


          const sourceUrl =
            img.dataset.sourceUrl ||
            img.src;


          const response =
            await fetch(
              sourceUrl
            );


          if (
            !response.ok
          ) {

            throw new Error(
              `Could not download page ${i + 1} for the PDF.`
            );

          }


          const imageBytes =
            await response.arrayBuffer();


          const embeddedImage =
            await pdf.embedJpg(
              imageBytes
            );


          const aspectRatio =
            embeddedImage.width /
            embeddedImage.height;


          const width =
            targetHeight *
            aspectRatio;


          embeddedPages.push({

            image:
              embeddedImage,

            width,

            height:
              targetHeight

          });

        }


        /*
         * Total width expands according
         * to how many pages were selected.
         */

        const totalWidth =
          embeddedPages.reduce(
            (
              sum,
              item
            ) =>
              sum +
              item.width,
            0
          )
          +
          gap *
          Math.max(
            0,
            embeddedPages.length - 1
          );


        /*
         * Exactly ONE PDF page.
         */

        const pdfPage =
          pdf.addPage([
            totalWidth,
            targetHeight
          ]);


        /*
         * Draw everything left to right.
         */

        let x =
          0;


        for (
          const item
          of embeddedPages
        ) {

          pdfPage.drawImage(
            item.image,
            {

              x,

              y: 0,

              width:
                item.width,

              height:
                item.height

            }
          );


          x +=
            item.width +
            gap;

        }


        const pdfBytes =
          await pdf.save();


        const blob =
          new Blob(
            [
              pdfBytes
            ],
            {
              type:
                "application/pdf"
            }
          );


        const downloadUrl =
          URL.createObjectURL(
            blob
          );


        /*
         * Build nicer filename.
         */

        const requestedPages =
          images
            .map(
              img =>
                img.dataset.pdfPage
            )
            .filter(Boolean)
            .join("-");


        const fileName =
          requestedPages
            ? `book-clip-pages-${requestedPages}.pdf`
            : "book-clip.pdf";


        const link =
          document.createElement(
            "a"
          );


        link.href =
          downloadUrl;


        link.download =
          fileName;


        document.body.appendChild(
          link
        );


        link.click();


        link.remove();


        setTimeout(
          () => {

            URL.revokeObjectURL(
              downloadUrl
            );

          },
          5000
        );


        setStatus(
          "Done — horizontal PDF downloaded.",
          "success"
        );


      } catch (error) {

        console.error(
          error
        );


        setStatus(
          error.message ||
          "Could not create the PDF.",
          "error"
        );


      } finally {

        savePdfButton.disabled =
          false;


        savePdfButton.textContent =
          "Download PDF";

      }

    }
  );


  /*
   * NEW CLIP
   *
   * Keeps the Archive book and volume loaded.
   */

  newClipButton.addEventListener(
    "click",
    () => {

      bookClip.innerHTML =
        "";


      clipSection.style.display =
        "none";


      setStatus(
        "Ready for another clip.",
        "success"
      );


      window.scrollTo({

        top: 0,

        behavior:
          "smooth"

      });

    }
  );

</script>

</body>
</html>
