<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تقرير الأسانيد للطباعة</title>
  <style>
    @font-face{font-family:"Amiri";font-style:normal;font-weight:400;font-display:swap;src:url("assets/amiri-arabic-400.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-089F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFC,U+1EE00-1EEFF}@font-face{font-family:"Amiri";font-style:normal;font-weight:400;font-display:swap;src:url("assets/amiri-latin-400.woff2") format("woff2")}@font-face{font-family:"Amiri";font-style:normal;font-weight:700;font-display:swap;src:url("assets/amiri-arabic-700.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-089F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFC,U+1EE00-1EEFF}@font-face{font-family:"Amiri";font-style:normal;font-weight:700;font-display:swap;src:url("assets/amiri-latin-700.woff2") format("woff2")}*{box-sizing:border-box}body{margin:0;background:#edf2ef;color:#172c25;font-family:"Amiri",serif}.print-toolbar{position:sticky;top:0;z-index:2;display:flex;justify-content:center;align-items:center;gap:12px;padding:10px;background:#173f34;color:#fff}.print-toolbar button{font:700 17px "Amiri",serif;border:0;border-radius:8px;background:#fff;color:#173f34;padding:7px 18px;cursor:pointer}.print-toolbar span{font-size:14px}.report{width:210mm;margin:18px auto;background:#fff;padding:16mm 17mm;box-shadow:0 8px 35px #18392f22;direction:rtl}.report-header{text-align:center;border-bottom:2px solid #d8c693;padding-bottom:5mm;margin-bottom:5mm}.kicker{font-size:14px;color:#687b73}.report-header h1{font-size:27px;line-height:1.35;margin:1mm 0 3mm;color:#173f34}.matn{font-size:18px;line-height:1.9;text-align:justify;margin:3mm auto;padding:3mm 4mm;border-block:1px solid #e4ddd0;white-space:pre-wrap}.attribution{font-size:15px;color:#5b6e66}.project-meta{font-size:13px;color:#687b73;margin-top:2mm}.bidi-isolate{font-family:"Amiri",serif;unicode-bidi:isolate}.bidi-isolate[dir="ltr"]{direction:ltr}.bidi-isolate[dir="rtl"]{direction:rtl}.bidi-reference{white-space:nowrap}.structure{break-inside:avoid;margin:0 0 6mm;padding:4mm 5mm;background:#f5f8f6;border-right:3px solid #417c66}.structure h2,.notes h2{margin:0 0 2mm;font-size:20px;color:#173f34}.structure p{margin:1mm 0}.chains{margin:0;padding:0;list-style:none}.chain{break-inside:avoid;page-break-inside:avoid;margin:0 0 7mm;padding:0 0 5mm;border-bottom:1px solid #dfe7e2}.chain h2{font-size:18px;margin:0 0 2mm;color:#173f34}.chain-path{font-size:17px;line-height:2;overflow-wrap:anywhere}.detail{font-size:13px;line-height:1.8;margin-top:1mm;color:#53675f;white-space:pre-wrap}.notes{break-before:page}.notes-list{padding-right:9mm;list-style-type:arabic-indic}.notes-list li{break-inside:avoid;margin-bottom:3mm;line-height:1.8;white-space:pre-wrap}.notes-list li::marker{font-family:"Amiri",serif}.research-notes{break-inside:avoid;margin-top:5mm;padding:4mm 5mm;background:#f5f8f6;border-right:3px solid #417c66;white-space:pre-wrap}.footer{margin-top:8mm;padding-top:3mm;border-top:1px solid #dfe6e2;color:#76857f;text-align:center;font-size:10px}.error{color:#8b2e35;text-align:center;padding:40px;font-size:20px}@page{size:A4 portrait;margin:14mm}@media print{html,body{background:#fff}.print-toolbar{display:none}.report{width:auto;margin:0;padding:0;box-shadow:none}.chain,.notes-list li,.research-notes{break-inside:avoid;page-break-inside:avoid}}@media(max-width:760px){.report{width:calc(100% - 20px);padding:24px 18px}.print-toolbar{flex-wrap:wrap}}
    .observation-report{margin:0 0 6mm;padding:4mm 5mm;border:1px solid #d6e3dc;border-right:4px solid #417c66;background:#fbfdfc}.observation-report h2{margin:1mm 0 2mm;color:#173f34}.observation-approved-text,.observation-comment{line-height:1.8}.observation-approved-text{border-right:3px solid #78a994;padding-right:3mm}.observation-meta,.observation-evidence,.observation-sources,.observation-appearance{font-size:13px;line-height:1.7;margin:1mm 0;color:#5d6f67}.observation-warning{color:#8b3434}.scholarly-prose p{margin:0 0 2mm;white-space:pre-wrap;text-align:justify;text-align-last:right;line-height:1.8}.scholarly-prose p:last-child{margin-bottom:0}.matn p{font-size:18px;line-height:1.9}
    .chain{display:table;width:100%;padding-top:0}
    .notes{break-before:auto;margin-top:7mm}
    .transmission-groups-report{margin:0 0 6mm;padding:3mm 4mm;border:1px solid #dce7e1;border-radius:3mm;break-inside:avoid}.transmission-groups-report h2{margin:0 0 2mm;font-size:18px;color:#173f34}.transmission-groups-key{display:flex;flex-wrap:wrap;gap:2mm 5mm}.transmission-groups-key span,.transmission-group-badge{display:inline-flex;align-items:center;gap:2mm}.transmission-groups-key span::before,.transmission-group-badge::before{content:"";width:3mm;height:3mm;border-radius:50%;background:var(--group-color);display:inline-block;flex:none}.transmission-group-badge{font-size:12px!important;color:#52665e!important;margin-inline-start:3mm}
  </style>
</head>
<body>
  <div class="print-toolbar"><button id="printReport" type="button">طباعة / حفظ PDF</button><span>اختر «حفظ كملف PDF» من نافذة الطباعة.</span></div>
  <main id="report" class="report" aria-live="polite"></main>

</html>
