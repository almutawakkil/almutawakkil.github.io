<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quote Maker</title>

  <!--
    IMAGE SETUP
    Put these files in:
      assets/quote-maker/night.jpg
      assets/quote-maker/sunset.jpg
      assets/quote-maker/green-stars.jpg

    This page can then live at:
      /quote-maker.html
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --page:#f5f4f1;
      --panel:#ffffff;
      --ink:#191919;
      --muted:#73716d;
      --line:#e6e3dd;
      --accent:#242424;
      --paper:#F3EBDD;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      color:var(--ink);
      background:
        radial-gradient(circle at 15% 0%, #fff 0 18%, transparent 40%),
        var(--page);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    .shell{
      width:min(1220px,calc(100% - 32px));
      margin:34px auto 60px;
    }

    .topbar{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:18px;
      margin-bottom:24px;
    }

    .title h1{
      font-size:clamp(25px,3vw,38px);
      margin:0 0 6px;
      font-weight:600;
      letter-spacing:-.035em;
    }

    .title p{
      margin:0;
      color:var(--muted);
      font-size:14px;
    }

    .layout{
      display:grid;
      grid-template-columns:minmax(330px,440px) minmax(0,1fr);
      gap:26px;
      align-items:start;
    }

    .panel{
      background:rgba(255,255,255,.9);
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:0 18px 48px rgba(40,35,28,.06);
    }

    .controls{
      padding:22px;
      position:sticky;
      top:18px;
    }

    .section + .section{
      margin-top:22px;
      padding-top:22px;
      border-top:1px solid var(--line);
    }

    .section-title{
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.11em;
      color:#8b8882;
      margin:0 0 12px;
      font-weight:600;
    }

    label{
      display:block;
      font-size:13px;
      font-weight:600;
      margin:0 0 7px;
    }

    .field + .field{ margin-top:14px; }

    textarea,input{
      width:100%;
      border:1px solid #dcd9d2;
      border-radius:13px;
      background:#fff;
      color:#1d1d1b;
      padding:12px 13px;
      font:inherit;
      outline:none;
      transition:border-color .15s,box-shadow .15s;
    }

    textarea{
      min-height:150px;
      resize:vertical;
      line-height:1.65;
      font-family:"Noto Naskh Arabic",Inter,sans-serif;
      font-size:17px;
    }

    input:focus,textarea:focus{
      border-color:#aaa59b;
      box-shadow:0 0 0 3px rgba(70,65,58,.07);
    }

    .segmented{
      display:grid;
      gap:8px;
    }

    .segmented.two{grid-template-columns:repeat(2,1fr)}
    .segmented.four{grid-template-columns:repeat(2,1fr)}

    button{
      font:inherit;
    }

    .choice{
      border:1px solid #dedbd4;
      background:#fff;
      color:#403e39;
      border-radius:12px;
      padding:10px 11px;
      cursor:pointer;
      transition:.15s ease;
      font-size:13px;
    }

    .choice:hover{border-color:#bdb8ae}
    .choice.active{
      background:#232321;
      color:white;
      border-color:#232321;
    }

    .toggle-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }

    .toggle-copy strong{
      display:block;
      font-size:13px;
      margin-bottom:3px;
    }

    .toggle-copy span{
      display:block;
      color:var(--muted);
      font-size:12px;
      line-height:1.4;
    }

    .switch{
      position:relative;
      width:46px;
      height:27px;
      flex:0 0 auto;
    }

    .switch input{
      opacity:0;
      width:0;
      height:0;
    }

    .slider{
      position:absolute;
      inset:0;
      background:#d7d4ce;
      border-radius:99px;
      cursor:pointer;
      transition:.18s;
    }

    .slider:before{
      content:"";
      position:absolute;
      width:21px;
      height:21px;
      left:3px;
      top:3px;
      background:white;
      border-radius:50%;
      box-shadow:0 2px 7px rgba(0,0,0,.14);
      transition:.18s;
    }

    .switch input:checked + .slider{background:#232321}
    .switch input:checked + .slider:before{transform:translateX(19px)}

    .actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;
    }

    .primary,.secondary{
      border-radius:13px;
      padding:12px 14px;
      cursor:pointer;
      font-weight:600;
      border:1px solid #252522;
    }

    .primary{
      background:#252522;
      color:#fff;
    }

    .secondary{
      background:#fff;
      color:#252522;
    }

    .note{
      margin:12px 0 0;
      color:#77746e;
      font-size:11px;
      line-height:1.55;
    }

    .preview-panel{
      padding:22px;
      min-height:500px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      background:
        linear-gradient(45deg,#f1efe9 25%,transparent 25%),
        linear-gradient(-45deg,#f1efe9 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#f1efe9 75%),
        linear-gradient(-45deg,transparent 75%,#f1efe9 75%);
      background-size:24px 24px;
      background-position:0 0,0 12px,12px -12px,-12px 0;
    }

    .canvas-wrap{
      width:min(100%,560px);
      filter:drop-shadow(0 24px 34px rgba(36,31,25,.16));
    }

    canvas{
      display:block;
      width:100%;
      height:auto;
      border-radius:4px;
      background:#ddd;
    }

    .status{
      margin-top:10px;
      text-align:center;
      font-size:12px;
      color:#77736d;
      min-height:18px;
    }

    @media(max-width:900px){
      .layout{grid-template-columns:1fr}
      .controls{position:static}
      .preview-panel{padding:16px}
    }

    @media(max-width:520px){
      .shell{width:min(100% - 18px,1220px);margin-top:18px}
      .topbar{align-items:flex-start;flex-direction:column}
      .panel{border-radius:17px}
      .controls{padding:16px}
      .actions{grid-template-columns:1fr}
    }
  </style>
</head>

<body>
  <main class="shell">
    <div class="topbar">
      <div class="title">
        <h1>Quote Maker</h1>
        <p>A simple, quiet tool for making shareable quotation cards.</p>
      </div>
    </div>

    <div class="layout">
      <aside class="panel controls">

        <section class="section" style="padding-top:0;margin-top:0;border-top:0">
          <p class="section-title">Content</p>

          <div class="field">
            <label for="quote">Quote</label>
            <textarea id="quote" dir="auto">مَنْ كَانَ بِاللَّهِ أَعْرَفَ، كَانَ مِنْهُ أَخْوَفَ.</textarea>
          </div>

          <div class="field">
            <label for="author">Name</label>
            <input id="author" dir="auto" value="سفيان الثوري" />
          </div>

          <div class="field">
            <label for="source">Source</label>
            <input id="source" dir="auto" value="حلية الأولياء" />
          </div>
        </section>

        <section class="section">
          <p class="section-title">Style</p>

          <label>Background</label>
          <div class="segmented four" id="themeChoices">
            <button class="choice active" data-theme="night">Night</button>
            <button class="choice" data-theme="sunset">Sunset</button>
            <button class="choice" data-theme="green">Stars</button>
            <button class="choice" data-theme="paper">Paper</button>
          </div>

          <div style="height:14px"></div>

          <label>Format</label>
          <div class="segmented two" id="ratioChoices">
            <button class="choice active" data-ratio="4:5">4:5 Portrait</button>
            <button class="choice" data-ratio="1:1">1:1 Square</button>
          </div>

          <div style="height:14px"></div>

          <label>Text alignment</label>
          <div class="segmented two" id="alignChoices">
            <button class="choice active" data-align="center">Centered</button>
            <button class="choice" data-align="right">Right aligned</button>
          </div>
        </section>

        <section class="section">
          <div class="toggle-row">
            <div class="toggle-copy">
              <strong>Watermark</strong>
              <span>Adds المتوكل quietly at the bottom.</span>
            </div>
            <label class="switch" aria-label="Toggle watermark">
              <input id="watermark" type="checkbox">
              <span class="slider"></span>
            </label>
          </div>
        </section>

        <section class="section">
          <div class="actions">
            <button class="primary" id="downloadBtn">Download PNG</button>
            <button class="secondary" id="copyBtn">Copy Image</button>
          </div>
          <p class="note">
            Please verify quotations and sources before sharing. This tool formats the text provided; it does not verify its authenticity.
          </p>
        </section>
      </aside>

      <section>
        <div class="panel preview-panel">
          <div class="canvas-wrap">
            <canvas id="card" width="2160" height="2700"></canvas>
          </div>
        </div>
        <div class="status" id="status"></div>
      </section>
    </div>
  </main>

<script>
(() => {
  const canvas = document.getElementById("card");
  const ctx = canvas.getContext("2d");

  const quoteInput = document.getElementById("quote");
  const authorInput = document.getElementById("author");
  const sourceInput = document.getElementById("source");
  const watermarkInput = document.getElementById("watermark");
  const statusEl = document.getElementById("status");

  const state = {
    theme: "night",
    ratio: "4:5",
    align: "center"
  };

  // Rename your three uploaded images to these filenames.
  const themeConfig = {
    night: {
      type: "image",
      src: "assets/quote-maker/night.jpg",
      text: "#F7F4ED",
      secondary: "rgba(247,244,237,.82)",
      shadow: "rgba(0,0,0,.52)",
      overlayTop: .13,
      overlayBottom: .60
    },
    sunset: {
      type: "image",
      src: "assets/quote-maker/sunset.jpg",
      text: "#FFF9ED",
      secondary: "rgba(255,249,237,.88)",
      shadow: "rgba(54,32,12,.48)",
      overlayTop: .12,
      overlayBottom: .55
    },
    green: {
      type: "image",
      src: "assets/quote-maker/green-stars.jpg",
      text: "#F8F7F1",
      secondary: "rgba(248,247,241,.84)",
      shadow: "rgba(8,25,20,.48)",
      overlayTop: .10,
      overlayBottom: .48
    },
    paper: {
      type: "paper",
      bg: "#F3EBDD",
      text: "#2C2925",
      secondary: "#6F665B",
      accent: "#B9A58B"
    }
  };

  const imageCache = new Map();

  function setStatus(text, timeout = 1700){
    statusEl.textContent = text;
    if(timeout){
      clearTimeout(setStatus.timer);
      setStatus.timer = setTimeout(() => statusEl.textContent = "", timeout);
    }
  }

  function containsArabic(text){
    return /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/.test(text || "");
  }

  function configureCanvas(){
    // Final files are rendered at 2× standard Instagram dimensions.
    if(state.ratio === "4:5"){
      canvas.width = 2160;
      canvas.height = 2700;
    } else {
      canvas.width = 2160;
      canvas.height = 2160;
    }
  }

  async function loadImage(src){
    if(imageCache.has(src)) return imageCache.get(src);

    const promise = new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });

    imageCache.set(src, promise);
    return promise;
  }

  function drawCoverImage(img, x, y, w, h){
    const imageRatio = img.width / img.height;
    const boxRatio = w / h;

    let sw, sh, sx, sy;

    if(imageRatio > boxRatio){
      sh = img.height;
      sw = sh * boxRatio;
      sx = (img.width - sw) / 2;
      sy = 0;
    } else {
      sw = img.width;
      sh = sw / boxRatio;
      sx = 0;
      sy = (img.height - sh) / 2;
    }

    ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  }

  function drawImageTreatment(config, W, H){
    // Overall soft veil.
    ctx.fillStyle = "rgba(0,0,0,.07)";
    ctx.fillRect(0,0,W,H);

    // Stronger darkness toward the text area / lower half.
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, `rgba(0,0,0,${config.overlayTop})`);
    grad.addColorStop(.38, "rgba(0,0,0,.14)");
    grad.addColorStop(1, `rgba(0,0,0,${config.overlayBottom})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // Gentle vignette to keep the eye inside the card.
    const radial = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.20,W/2,H/2,Math.max(W,H)*.72);
    radial.addColorStop(0,"rgba(0,0,0,0)");
    radial.addColorStop(1,"rgba(0,0,0,.20)");
    ctx.fillStyle = radial;
    ctx.fillRect(0,0,W,H);
  }

  function drawPaper(config, W, H){
    ctx.fillStyle = config.bg;
    ctx.fillRect(0,0,W,H);

    // Very subtle handmade-paper variation.
    const glow = ctx.createRadialGradient(W*.28,H*.16,0,W*.28,H*.16,W*.9);
    glow.addColorStop(0,"rgba(255,255,255,.38)");
    glow.addColorStop(1,"rgba(122,96,68,.045)");
    ctx.fillStyle = glow;
    ctx.fillRect(0,0,W,H);

    // Fine warm horizontal fibers.
    ctx.save();
    ctx.globalAlpha = .055;
    ctx.strokeStyle = "#806C54";
    ctx.lineWidth = 1.3;
    for(let y=40;y<H;y+=31){
      ctx.beginPath();
      ctx.moveTo(0,y);
      ctx.bezierCurveTo(W*.25,y+4,W*.65,y-4,W,y+2);
      ctx.stroke();
    }
    ctx.restore();

    // Tiny ornamental rule.
    ctx.save();
    ctx.strokeStyle = config.accent;
    ctx.lineWidth = 3;
    ctx.globalAlpha = .78;
    ctx.beginPath();
    ctx.moveTo(W*.43,H*.17);
    ctx.lineTo(W*.57,H*.17);
    ctx.stroke();
    ctx.restore();
  }

  function splitExplicitLines(text){
    return (text || "")
      .replace(/\r/g,"")
      .split("\n");
  }

  function wrapParagraph(text, maxWidth){
    if(!text.trim()) return [""];

    const words = text.trim().split(/\s+/);
    const lines = [];
    let line = "";

    for(const word of words){
      const test = line ? line + " " + word : word;
      if(ctx.measureText(test).width <= maxWidth || !line){
        line = test;
      } else {
        lines.push(line);
        line = word;
      }
    }

    if(line) lines.push(line);
    return lines;
  }

  function wrapText(text, maxWidth){
    const paragraphs = splitExplicitLines(text);
    const result = [];

    paragraphs.forEach((p, i) => {
      const wrapped = wrapParagraph(p, maxWidth);
      result.push(...wrapped);
      if(i < paragraphs.length - 1) result.push("");
    });

    return result;
  }

  function fontString(size, weight, arabic){
    const family = arabic ? '"Noto Naskh Arabic"' : 'Georgia';
    return `${weight} ${size}px ${family}`;
  }

  function fitQuote(text, maxWidth, maxHeight, arabic){
    let size = arabic ? 150 : 126;
    const minSize = 64;

    while(size >= minSize){
      ctx.font = fontString(size, 500, arabic);
      const lines = wrapText(text, maxWidth);
      const lineHeight = size * (arabic ? 1.56 : 1.34);
      const totalHeight = lines.length * lineHeight;

      if(totalHeight <= maxHeight){
        return {size, lines, lineHeight};
      }
      size -= 4;
    }

    ctx.font = fontString(minSize, 500, arabic);
    return {
      size:minSize,
      lines:wrapText(text,maxWidth),
      lineHeight:minSize*(arabic ? 1.56 : 1.34)
    };
  }

  function drawTextBlock(config, W, H){
    const quote = quoteInput.value.trim() || "اكتب النص هنا";
    const author = authorInput.value.trim();
    const source = sourceInput.value.trim();
    const quoteArabic = containsArabic(quote);
    const metaArabic = containsArabic(author + source);

    const marginX = W * .10;
    const maxWidth = W - marginX * 2;

    // Keep the quote in a graceful central zone.
    const quoteTop = state.ratio === "4:5" ? H*.26 : H*.22;
    const quoteBottom = state.ratio === "4:5" ? H*.72 : H*.70;
    const availableH = quoteBottom - quoteTop;

    const fitted = fitQuote(quote, maxWidth, availableH, quoteArabic);
    const quoteHeight = fitted.lines.length * fitted.lineHeight;

    let startY = quoteTop + Math.max(0,(availableH - quoteHeight)/2);

    ctx.save();
    ctx.fillStyle = config.text;
    ctx.shadowColor = config.type === "image" ? config.shadow : "rgba(0,0,0,0)";
    ctx.shadowBlur = config.type === "image" ? 24 : 0;
    ctx.shadowOffsetY = config.type === "image" ? 5 : 0;
    ctx.font = fontString(fitted.size,500,quoteArabic);
    ctx.textBaseline = "top";

    if(state.align === "center"){
      ctx.textAlign = "center";
      ctx.direction = quoteArabic ? "rtl" : "ltr";
    }else{
      ctx.textAlign = "right";
      ctx.direction = quoteArabic ? "rtl" : "ltr";
    }

    const tx = state.align === "center" ? W/2 : W-marginX;

    fitted.lines.forEach((line,i) => {
      ctx.fillText(line, tx, startY + i*fitted.lineHeight);
    });
    ctx.restore();

    // Attribution sits consistently near the bottom.
    const metaY = state.ratio === "4:5" ? H*.805 : H*.80;

    ctx.save();
    ctx.fillStyle = config.secondary;
    ctx.shadowColor = config.type === "image" ? config.shadow : "rgba(0,0,0,0)";
    ctx.shadowBlur = config.type === "image" ? 14 : 0;
    ctx.textBaseline = "top";
    ctx.direction = metaArabic ? "rtl" : "ltr";
    ctx.textAlign = state.align === "center" ? "center" : "right";

    const metaX = state.align === "center" ? W/2 : W-marginX;

    if(author){
      ctx.font = fontString(metaArabic ? 69 : 58,600,metaArabic);
      ctx.fillText(author,metaX,metaY);
    }

    if(source){
      ctx.globalAlpha = .88;
      ctx.font = fontString(metaArabic ? 48 : 42,400,metaArabic);
      ctx.fillText(source,metaX,metaY + (author ? 104 : 0));
    }
    ctx.restore();

    // Optional private/publication watermark.
    if(watermarkInput.checked){
      ctx.save();
      ctx.fillStyle = config.type === "paper"
        ? "rgba(44,41,37,.42)"
        : "rgba(255,255,255,.48)";
      ctx.font = fontString(40,500,true);
      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";
      ctx.direction = "rtl";
      ctx.fillText("المتوكل",W/2,H-54);
      ctx.restore();
    }
  }

  async function render(){
    configureCanvas();

    const W = canvas.width;
    const H = canvas.height;
    const config = themeConfig[state.theme];

    ctx.clearRect(0,0,W,H);

    if(config.type === "paper"){
      drawPaper(config,W,H);
    }else{
      try{
        const img = await loadImage(config.src);
        drawCoverImage(img,0,0,W,H);
      }catch(err){
        // Graceful fallback while the image filenames are being set up.
        const fallback = ctx.createLinearGradient(0,0,0,H);
        fallback.addColorStop(0,"#252735");
        fallback.addColorStop(1,"#111217");
        ctx.fillStyle = fallback;
        ctx.fillRect(0,0,W,H);

        setStatus(`Add ${config.src} to use this background.`, 2600);
      }

      drawImageTreatment(config,W,H);
    }

    drawTextBlock(config,W,H);
  }

  function bindChoiceGroup(groupId,key){
    document.getElementById(groupId).addEventListener("click",e => {
      const btn = e.target.closest(".choice");
      if(!btn) return;

      const value = btn.dataset[key];
      if(!value) return;

      state[key] = value;

      btn.parentElement.querySelectorAll(".choice").forEach(x => x.classList.remove("active"));
      btn.classList.add("active");

      render();
    });
  }

  bindChoiceGroup("themeChoices","theme");
  bindChoiceGroup("ratioChoices","ratio");
  bindChoiceGroup("alignChoices","align");

  [quoteInput,authorInput,sourceInput].forEach(el => {
    el.addEventListener("input",render);
  });

  watermarkInput.addEventListener("change",render);

  document.getElementById("downloadBtn").addEventListener("click", async () => {
    await render();

    const link = document.createElement("a");
    const safeAuthor = (authorInput.value.trim() || "quote")
      .replace(/[^\p{L}\p{N}_-]+/gu,"-")
      .replace(/^-+|-+$/g,"");

    link.download = `${safeAuthor || "quote"}-${state.ratio.replace(":","x")}.png`;
    link.href = canvas.toDataURL("image/png",1);
    link.click();
    setStatus("PNG downloaded.");
  });

  document.getElementById("copyBtn").addEventListener("click", async () => {
    try{
      await render();
      const blob = await new Promise(resolve => canvas.toBlob(resolve,"image/png",1));

      if(!navigator.clipboard || !window.ClipboardItem){
        throw new Error("Clipboard images are not supported in this browser.");
      }

      await navigator.clipboard.write([
        new ClipboardItem({"image/png":blob})
      ]);

      setStatus("Image copied.");
    }catch(err){
      setStatus("Copy Image is not supported here — use Download PNG instead.",3000);
    }
  });

  // Redraw after web fonts are ready.
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(render);
  }

  render();
})();
</script>
</body>
</html>
