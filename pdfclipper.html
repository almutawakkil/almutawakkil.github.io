<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Book Clipper</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f3ee;
      color: #222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .container {
      width: min(760px, calc(100% - 32px));
      margin: 50px auto;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 34px;
    }

    .subtitle {
      color: #666;
      margin-top: 0;
      margin-bottom: 32px;
      line-height: 1.55;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 14px;
      border: 1px solid #dedbd3;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
    }

    input:focus {
      outline: none;
      border-color: #444;
    }

    .section {
      margin-bottom: 26px;
    }

    .pages-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .page-row {
      display: flex;
      gap: 8px;
      margin-bottom: 9px;
    }

    .page-row input {
      flex: 1;
    }

    .remove-page {
      width: 45px;
      border: 1px solid #ccc;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
    }

    #addPage {
      border: none;
      background: transparent;
      cursor: pointer;
      color: #555;
      font-size: 14px;
    }

    .main-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .main-button:hover {
      background: #000;
    }

    .small-note {
      margin-top: 10px;
      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }

    #status {
      margin-top: 16px;
      min-height: 20px;
      font-size: 14px;
    }

    .error {
      color: #a42121;
    }

    .success {
      color: #266333;
    }

    #clipSection {
      display: none;
      margin-top: 35px;
    }

    .clip-controls {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
    }

    .secondary-button {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #222;
      cursor: pointer;
      background: white;
      font-size: 15px;
      font-weight: 600;
    }

    .secondary-button.dark {
      background: #222;
      color: white;
    }

    /*
     * This is the actual clip.
     */
    #bookClip {
      margin: auto;
      background: white;
      width: min(100%, 1200px);
    }

    #bookClip img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0;
      padding: 0;
    }

    .page-divider {
      height: 10px;
      background: white;
    }

    @media (max-width: 550px) {
      .container {
        margin: 25px auto;
      }

      .card {
        padding: 20px;
      }

      h1 {
        font-size: 28px;
      }

      .clip-controls {
        flex-direction: column;
      }
    }


    /*
     * PRINT MODE
     *
     * Everything except the selected pages disappears.
     */

    @media print {

      html,
      body {
        margin: 0 !important;
        padding: 0 !important;
        background: white !important;
      }

      body * {
        visibility: hidden;
      }

      #bookClip,
      #bookClip * {
        visibility: visible;
      }

      #bookClip {
        position: absolute;
        left: 0;
        top: 0;

        width: 100% !important;

        margin: 0 !important;
        padding: 0 !important;
      }

      #bookClip img {
        width: 100% !important;
        height: auto !important;
        display: block !important;
      }

      .page-divider {
        height: 0 !important;
      }
    }

  </style>
</head>


<body>

  <main class="container">

    <h1>Book Clipper</h1>

    <p class="subtitle">
      Turn selected pages from an Internet Archive book
      into one clean page for quoting, highlighting, and sharing.
    </p>


    <div class="card">

      <div class="section">

        <label for="archiveUrl">
          Internet Archive link
        </label>

        <input
          id="archiveUrl"
          type="url"
          placeholder="https://archive.org/details/..."
        >

      </div>


      <div class="section">

        <div class="pages-title">

          <label style="margin:0;">
            PDF pages
          </label>

          <button
            id="addPage"
            type="button"
          >
            + Add page
          </button>

        </div>


        <div id="pageInputs">

          <div class="page-row">

            <input
              class="page-number"
              type="number"
              min="1"
              placeholder="PDF page number"
            >

            <button
              class="remove-page"
              type="button"
            >
              ×
            </button>

          </div>

        </div>


        <div class="small-note">
          Maximum 4 pages. They will appear in exactly
          the order entered.
        </div>

      </div>


      <button
        id="createButton"
        class="main-button"
        type="button"
      >
        Create Clip
      </button>


      <div id="status"></div>

    </div>



    <section id="clipSection">

      <div class="clip-controls">

        <button
          id="printButton"
          class="secondary-button dark"
          type="button"
        >
          Save as PDF
        </button>

        <button
          id="newClipButton"
          class="secondary-button"
          type="button"
        >
          New Clip
        </button>

      </div>


      <div id="bookClip"></div>

    </section>

  </main>



<script>

  const archiveUrl =
    document.getElementById("archiveUrl");

  const pageInputs =
    document.getElementById("pageInputs");

  const addPage =
    document.getElementById("addPage");

  const createButton =
    document.getElementById("createButton");

  const status =
    document.getElementById("status");

  const clipSection =
    document.getElementById("clipSection");

  const bookClip =
    document.getElementById("bookClip");

  const printButton =
    document.getElementById("printButton");

  const newClipButton =
    document.getElementById("newClipButton");



  /*
   * Get Archive item identifier
   */

  function getIdentifier(value) {

    value = value.trim();

    if (!value) {
      throw new Error(
        "Paste an Internet Archive link."
      );
    }


    let url;

    try {

      url = new URL(value);

    } catch {

      throw new Error(
        "That doesn't look like a valid URL."
      );

    }


    if (
      url.hostname !== "archive.org" &&
      url.hostname !== "www.archive.org"
    ) {

      throw new Error(
        "Please use an archive.org link."
      );

    }


    const parts =
      url.pathname
        .split("/")
        .filter(Boolean);


    const detailsIndex =
      parts.indexOf("details");


    if (
      detailsIndex !== -1 &&
      parts[detailsIndex + 1]
    ) {

      return parts[detailsIndex + 1];

    }


    const downloadIndex =
      parts.indexOf("download");


    if (
      downloadIndex !== -1 &&
      parts[downloadIndex + 1]
    ) {

      return parts[downloadIndex + 1];

    }


    throw new Error(
      "Couldn't determine the Archive item."
    );

  }



  /*
   * Page boxes
   */

  function updateRows() {

    const rows =
      document.querySelectorAll(".page-row");


    addPage.style.display =
      rows.length >= 4
        ? "none"
        : "inline-block";


    rows.forEach(row => {

      const button =
        row.querySelector(".remove-page");


      button.style.visibility =
        rows.length === 1
          ? "hidden"
          : "visible";

    });

  }



  addPage.addEventListener(
    "click",
    () => {

      const count =
        document.querySelectorAll(
          ".page-row"
        ).length;


      if (count >= 4) {
        return;
      }


      const row =
        document.createElement("div");


      row.className =
        "page-row";


      row.innerHTML = `

        <input
          class="page-number"
          type="number"
          min="1"
          placeholder="PDF page number"
        >

        <button
          class="remove-page"
          type="button"
        >
          ×
        </button>

      `;


      pageInputs.appendChild(row);

      updateRows();

      row
        .querySelector("input")
        .focus();

    }
  );



  pageInputs.addEventListener(
    "click",
    event => {

      if (
        !event.target.classList.contains(
          "remove-page"
        )
      ) {
        return;
      }


      const rows =
        document.querySelectorAll(
          ".page-row"
        );


      if (rows.length <= 1) {
        return;
      }


      event.target
        .closest(".page-row")
        .remove();


      updateRows();

    }
  );



  updateRows();



  /*
   * Read page numbers
   */

  function getPages() {

    const values =
      [
        ...document.querySelectorAll(
          ".page-number"
        )
      ];


    const pages =
      values
        .map(input => input.value.trim())
        .filter(value => value !== "")
        .map(value => Number(value));


    if (!pages.length) {

      throw new Error(
        "Enter at least one page."
      );

    }


    if (pages.length > 4) {

      throw new Error(
        "Maximum 4 pages."
      );

    }


    for (const page of pages) {

      if (
        !Number.isInteger(page) ||
        page < 1
      ) {

        throw new Error(
          "Page numbers must be whole numbers starting at 1."
        );

      }

    }


    return pages;

  }



  /*
   * Load image and report success/failure
   */

  function loadPageImage(
    identifier,
    pdfPage
  ) {

    return new Promise(
      (resolve, reject) => {

        /*
         * IA's accessible page index starts at zero.
         *
         * PDF page 1 -> n0
         * PDF page 2 -> n1
         * PDF page 500 -> n499
         */

        const iaIndex =
          pdfPage - 1;


        /*
         * _large requests a high-quality image.
         *
         * We can switch this to the full-resolution
         * .jpg later if desired.
         */

        const src =
          `https://archive.org/download/${encodeURIComponent(identifier)}/page/n${iaIndex}_large.jpg`;


        const img =
          new Image();


        img.onload =
          () => resolve({
            img,
            pdfPage,
            src
          });


        img.onerror =
          () => reject(
            new Error(
              `Could not load PDF page ${pdfPage}.`
            )
          );


        img.src =
          src;

      }
    );

  }



  /*
   * Create clip
   */

  createButton.addEventListener(
    "click",
    async () => {

      status.textContent = "";

      status.className = "";

      bookClip.innerHTML = "";

      clipSection.style.display =
        "none";


      try {

        const identifier =
          getIdentifier(
            archiveUrl.value
          );


        const pages =
          getPages();


        createButton.disabled =
          true;


        status.textContent =
          "Loading pages...";


        const loadedPages = [];


        /*
         * Load sequentially so that the order
         * always matches what the user entered.
         */

        for (
          let i = 0;
          i < pages.length;
          i++
        ) {

          const page =
            pages[i];


          status.textContent =
            `Loading page ${page} (${i + 1} of ${pages.length})...`;


          const loaded =
            await loadPageImage(
              identifier,
              page
            );


          loadedPages.push(
            loaded
          );

        }



        /*
         * Put images into clip.
         */

        loadedPages.forEach(
          (item, index) => {

            item.img.alt =
              `PDF page ${item.pdfPage}`;


            item.img.title =
              `PDF page ${item.pdfPage}`;


            bookClip.appendChild(
              item.img
            );


            if (
              index <
              loadedPages.length - 1
            ) {

              const divider =
                document.createElement(
                  "div"
                );


              divider.className =
                "page-divider";


              bookClip.appendChild(
                divider
              );

            }

          }
        );


        clipSection.style.display =
          "block";


        status.textContent =
          `Done — pages ${pages.join(", ")} are ready.`;

        status.className =
          "success";


        /*
         * Scroll result into view.
         */

        clipSection.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });


      } catch (error) {

        console.error(error);


        status.textContent =
          error.message ||
          "Something went wrong.";


        status.className =
          "error";

      } finally {

        createButton.disabled =
          false;

      }

    }
  );



  /*
   * Print / Save as PDF
   */

  printButton.addEventListener(
    "click",
    () => {

      /*
       * Determine proportions of the finished
       * stacked image.
       */

      const images =
        [
          ...bookClip.querySelectorAll(
            "img"
          )
        ];


      if (!images.length) {
        return;
      }


      /*
       * Use the first page as our reference width.
       */

      const referenceWidth =
        1000;


      let totalHeight = 0;


      for (const img of images) {

        const ratio =
          img.naturalHeight /
          img.naturalWidth;


        totalHeight +=
          referenceWidth * ratio;

      }


      /*
       * Dynamically tell the browser that the PDF
       * page itself should be tall enough to hold
       * the entire clip on ONE page.
       */

      const oldStyle =
        document.getElementById(
          "dynamicPrintSize"
        );


      if (oldStyle) {
        oldStyle.remove();
      }


      const style =
        document.createElement(
          "style"
        );


      style.id =
        "dynamicPrintSize";


      style.textContent = `

        @media print {

          @page {
            size:
              ${referenceWidth}px
              ${Math.ceil(totalHeight)}px;

            margin: 0;
          }

        }

      `;


      document.head.appendChild(
        style
      );


      /*
       * Let browser's normal PDF printer handle it.
       */

      setTimeout(
        () => window.print(),
        100
      );

    }
  );



  /*
   * Start over
   */

  newClipButton.addEventListener(
    "click",
    () => {

      bookClip.innerHTML =
        "";

      clipSection.style.display =
        "none";

      status.textContent =
        "";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }
  );

</script>

</body>
</html>
