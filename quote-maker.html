<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quote Maker</title>

  <!--
    BACKGROUND IMAGES

    assets/quote-maker/night.jpeg
    assets/quote-maker/sunset.jpeg
    assets/quote-maker/green-stars.jpeg
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!--
    Amiri:
      Main quotations / hadith

    Aref Ruqaa:
      Speaker / source / attribution

    Inter:
      Interface
  -->
  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    :root{
      --page:#f5f4f1;
      --panel:#ffffff;
      --ink:#191919;
      --muted:#73716d;
      --line:#e6e3dd;
      --accent:#242424;
      --paper:#F3EBDD;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;

      color:var(--ink);

      background:
        radial-gradient(
          circle at 15% 0%,
          #fff 0 18%,
          transparent 40%
        ),
        var(--page);

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .shell{
      width:min(
        1220px,
        calc(100% - 32px)
      );

      margin:34px auto 60px;
    }

    .topbar{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:18px;

      margin-bottom:24px;
    }

    .title h1{
      font-size:clamp(
        25px,
        3vw,
        38px
      );

      margin:0 0 6px;

      font-weight:600;
      letter-spacing:-.035em;
    }

    .title p{
      margin:0;

      color:var(--muted);

      font-size:14px;
    }

    .layout{
      display:grid;

      grid-template-columns:
        minmax(330px,440px)
        minmax(0,1fr);

      gap:26px;

      align-items:start;
    }

    .panel{
      background:
        rgba(255,255,255,.9);

      border:
        1px solid var(--line);

      border-radius:22px;

      box-shadow:
        0 18px 48px
        rgba(40,35,28,.06);
    }

    .controls{
      padding:22px;

      position:sticky;

      top:18px;
    }

    .section + .section{
      margin-top:22px;

      padding-top:22px;

      border-top:
        1px solid var(--line);
    }

    .section-title{
      font-size:12px;

      text-transform:uppercase;

      letter-spacing:.11em;

      color:#8b8882;

      margin:0 0 12px;

      font-weight:600;
    }

    label{
      display:block;

      font-size:13px;

      font-weight:600;

      margin:0 0 7px;
    }

    .field + .field{
      margin-top:14px;
    }

    textarea,
    input{
      width:100%;

      border:
        1px solid #dcd9d2;

      border-radius:13px;

      background:#fff;

      color:#1d1d1b;

      padding:12px 13px;

      outline:none;

      transition:
        border-color .15s,
        box-shadow .15s;
    }

    textarea{
      min-height:190px;

      resize:vertical;

      line-height:1.95;

      font-family:
        "Amiri",
        serif;

      font-size:21px;
    }

    input{
      font-family:
        "Aref Ruqaa",
        "Amiri",
        serif;

      font-size:18px;
    }

    input:focus,
    textarea:focus{
      border-color:#aaa59b;

      box-shadow:
        0 0 0 3px
        rgba(70,65,58,.07);
    }

    .segmented{
      display:grid;

      gap:8px;
    }

    .segmented.two{
      grid-template-columns:
        repeat(2,1fr);
    }

    .segmented.four{
      grid-template-columns:
        repeat(2,1fr);
    }

    button{
      font:inherit;
    }

    .choice{
      border:
        1px solid #dedbd4;

      background:#fff;

      color:#403e39;

      border-radius:12px;

      padding:10px 11px;

      cursor:pointer;

      transition:.15s ease;

      font-size:13px;
    }

    .choice:hover{
      border-color:#bdb8ae;
    }

    .choice.active{
      background:#232321;

      color:#fff;

      border-color:#232321;
    }

    .toggle-row{
      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:16px;
    }

    .toggle-copy strong{
      display:block;

      font-size:13px;

      margin-bottom:3px;
    }

    .toggle-copy span{
      display:block;

      color:var(--muted);

      font-size:12px;

      line-height:1.45;
    }

    .private-label{
      color:#928c82;
    }

    .switch{
      position:relative;

      width:46px;
      height:27px;

      flex:0 0 auto;
    }

    .switch input{
      opacity:0;

      width:0;
      height:0;
    }

    .slider{
      position:absolute;

      inset:0;

      background:#d7d4ce;

      border-radius:99px;

      cursor:pointer;

      transition:.18s;
    }

    .slider:before{
      content:"";

      position:absolute;

      width:21px;
      height:21px;

      left:3px;
      top:3px;

      background:#fff;

      border-radius:50%;

      box-shadow:
        0 2px 7px
        rgba(0,0,0,.14);

      transition:.18s;
    }

    .switch input:checked + .slider{
      background:#232321;
    }

    .switch input:checked + .slider:before{
      transform:
        translateX(19px);
    }

    .actions{
      display:grid;

      grid-template-columns:
        1fr 1fr;

      gap:9px;
    }

    .primary,
    .secondary{
      border-radius:13px;

      padding:12px 14px;

      cursor:pointer;

      font-weight:600;

      border:
        1px solid #252522;
    }

    .primary{
      background:#252522;

      color:#fff;
    }

    .secondary{
      background:#fff;

      color:#252522;
    }

    .note{
      margin:12px 0 0;

      color:#77746e;

      font-size:11px;

      line-height:1.55;
    }

    .preview-panel{
      padding:22px;

      min-height:500px;

      display:flex;

      align-items:center;

      justify-content:center;

      overflow:hidden;

      background:
        linear-gradient(
          45deg,
          #f1efe9 25%,
          transparent 25%
        ),
        linear-gradient(
          -45deg,
          #f1efe9 25%,
          transparent 25%
        ),
        linear-gradient(
          45deg,
          transparent 75%,
          #f1efe9 75%
        ),
        linear-gradient(
          -45deg,
          transparent 75%,
          #f1efe9 75%
        );

      background-size:
        24px 24px;

      background-position:
        0 0,
        0 12px,
        12px -12px,
        -12px 0;
    }

    .canvas-wrap{
      width:min(
        100%,
        560px
      );

      filter:
        drop-shadow(
          0 24px 34px
          rgba(36,31,25,.16)
        );
    }

    canvas{
      display:block;

      width:100%;

      height:auto;

      border-radius:4px;

      background:#ddd;
    }

    .status{
      margin-top:10px;

      text-align:center;

      font-size:12px;

      color:#77736d;

      min-height:18px;
    }

    .hidden{
      display:none;
    }

    @media(max-width:900px){

      .layout{
        grid-template-columns:1fr;
      }

      .controls{
        position:static;
      }

      .preview-panel{
        padding:16px;
      }

    }

    @media(max-width:520px){

      .shell{
        width:min(
          100% - 18px,
          1220px
        );

        margin-top:18px;
      }

      .topbar{
        align-items:flex-start;

        flex-direction:column;
      }

      .panel{
        border-radius:17px;
      }

      .controls{
        padding:16px;
      }

      .actions{
        grid-template-columns:1fr;
      }

    }

  </style>
</head>

<body>

  <main class="shell">

    <div class="topbar">

      <div class="title">

        <h1>
          Quote Maker
        </h1>

        <p>
          A simple, quiet tool for making shareable quotation cards.
        </p>

      </div>

    </div>


    <div class="layout">

      <aside class="panel controls">


        <!-- TYPE -->

        <section
          class="section"
          style="
            padding-top:0;
            margin-top:0;
            border-top:0
          "
        >

          <p class="section-title">
            Type
          </p>

          <div
            class="segmented two"
            id="typeChoices"
          >

            <button
              class="choice active"
              data-type="general"
            >
              General
            </button>

            <button
              class="choice"
              data-type="hadith"
            >
              Hadith
            </button>

          </div>

        </section>


        <!-- CONTENT -->

        <section class="section">

          <p class="section-title">
            Content
          </p>

          <div class="field">

            <label for="quote">
              Quote
            </label>

            <textarea
              id="quote"
              dir="auto"
            >مَنْ كَانَ بِاللَّهِ أَعْرَفَ، كَانَ مِنْهُ أَخْوَفَ.</textarea>

          </div>


          <div
            class="field"
            id="authorField"
          >

            <label for="author">
              Name
            </label>

            <input
              id="author"
              dir="auto"
              value="سفيان الثوري"
            />

          </div>


          <div class="field">

            <label for="source">
              Source
            </label>

            <input
              id="source"
              dir="auto"
              value="حلية الأولياء"
            />

          </div>

        </section>


        <!-- STYLE -->

        <section class="section">

          <p class="section-title">
            Style
          </p>

          <label>
            Background
          </label>

          <div
            class="segmented four"
            id="themeChoices"
          >

            <button
              class="choice active"
              data-theme="night"
            >
              Night
            </button>

            <button
              class="choice"
              data-theme="sunset"
            >
              Sunset
            </button>

            <button
              class="choice"
              data-theme="green"
            >
              Stars
            </button>

            <button
              class="choice"
              data-theme="paper"
            >
              Paper
            </button>

          </div>


          <div style="height:14px"></div>


          <label>
            Format
          </label>

          <div
            class="segmented two"
            id="ratioChoices"
          >

            <button
              class="choice active"
              data-ratio="4:5"
            >
              4:5 Portrait
            </button>

            <button
              class="choice"
              data-ratio="1:1"
            >
              1:1 Square
            </button>

          </div>


          <div style="height:14px"></div>


          <label>
            Text alignment
          </label>

          <div
            class="segmented two"
            id="alignChoices"
          >

            <button
              class="choice active"
              data-align="center"
            >
              Centered
            </button>

            <button
              class="choice"
              data-align="right"
            >
              Right aligned
            </button>

          </div>

        </section>


        <!-- WATERMARK -->

        <section class="section">

          <div class="toggle-row">

            <div class="toggle-copy">

              <strong>
                Private watermark
              </strong>

              <span class="private-label">
                Adds المتوكل — requires access.
              </span>

            </div>

            <label
              class="switch"
              aria-label="Toggle private watermark"
            >

              <input
                id="watermark"
                type="checkbox"
              >

              <span class="slider"></span>

            </label>

          </div>

        </section>


        <!-- ACTIONS -->

        <section class="section">

          <div class="actions">

            <button
              class="primary"
              id="downloadBtn"
            >
              Download PNG
            </button>

            <button
              class="secondary"
              id="copyBtn"
            >
              Copy Image
            </button>

          </div>

          <p class="note">
            Please verify quotations and sources before sharing.
            This tool formats the text provided; it does not verify
            its authenticity.
          </p>

        </section>

      </aside>


      <!-- PREVIEW -->

      <section>

        <div class="panel preview-panel">

          <div class="canvas-wrap">

            <canvas
              id="card"
              width="2160"
              height="2700"
            ></canvas>

          </div>

        </div>

        <div
          class="status"
          id="status"
        ></div>

      </section>

    </div>

  </main>


<script>

(() => {


  /*
    ==================================================
    ELEMENTS
    ==================================================
  */

  const canvas =
    document.getElementById("card");

  const ctx =
    canvas.getContext("2d");

  const quoteInput =
    document.getElementById("quote");

  const authorInput =
    document.getElementById("author");

  const sourceInput =
    document.getElementById("source");

  const authorField =
    document.getElementById("authorField");

  const watermarkInput =
    document.getElementById("watermark");

  const statusEl =
    document.getElementById("status");


  /*
    ==================================================
    STATE
    ==================================================
  */

  const state = {

    type:"general",

    theme:"night",

    ratio:"4:5",

    align:"center"

  };


  /*
    ==================================================
    PRIVATE WATERMARK
    ==================================================
  */

  const WATERMARK_PASSWORD =
    "barbarawi";

  let watermarkUnlocked =
    false;


  /*
    ==================================================
    THEMES
    ==================================================
  */

  const themeConfig = {


    night:{

      type:"image",

      src:
        "assets/quote-maker/night.jpeg",

      text:
        "#F7F4ED",

      secondary:
        "rgba(247,244,237,.88)",

      shadow:
        "rgba(0,0,0,.52)",

      overlayTop:.13,

      overlayBottom:.60

    },


    sunset:{

      type:"image",

      src:
        "assets/quote-maker/sunset.jpeg",

      text:
        "#FFF9ED",

      secondary:
        "rgba(255,249,237,.92)",

      shadow:
        "rgba(54,32,12,.48)",

      overlayTop:.12,

      overlayBottom:.55

    },


    green:{

      type:"image",

      src:
        "assets/quote-maker/green-stars.jpeg",

      text:
        "#F8F7F1",

      secondary:
        "rgba(248,247,241,.88)",

      shadow:
        "rgba(8,25,20,.48)",

      overlayTop:.10,

      overlayBottom:.48

    },


    paper:{

      type:"paper",

      bg:
        "#F3EBDD",

      text:
        "#2C2925",

      secondary:
        "#6A6054"

    }

  };


  const imageCache =
    new Map();


  /*
    ==================================================
    STATUS
    ==================================================
  */

  function setStatus(
    text,
    timeout = 1700
  ){

    statusEl.textContent =
      text;

    if(timeout){

      clearTimeout(
        setStatus.timer
      );

      setStatus.timer =
        setTimeout(
          () => {

            statusEl.textContent =
              "";

          },

          timeout
        );

    }

  }


  /*
    ==================================================
    ARABIC DETECTION
    ==================================================
  */

  function containsArabic(text){

    return /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/
      .test(text || "");

  }


  /*
    ==================================================
    HARAKAT DETECTION
    ==================================================
  */

  function harakatRatio(text){

    const arabicLetters =
      (
        text.match(
          /[\u0621-\u064A\u066E-\u06D3]/g
        )
        ||
        []
      ).length;


    const marks =
      (
        text.match(
          /[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED]/g
        )
        ||
        []
      ).length;


    if(
      arabicLetters === 0
    ){

      return 0;

    }


    return marks / arabicLetters;

  }


  /*
    Heavily vocalized Arabic gets
    additional line spacing.
  */

  function getArabicLineHeightMultiplier(text){

    const ratio =
      harakatRatio(text);


    if(
      ratio >= .42
    ){

      return 2.05;

    }


    if(
      ratio >= .22
    ){

      return 1.92;

    }


    return 1.78;

  }


  /*
    ==================================================
    CANVAS SIZE
    ==================================================
  */

  function configureCanvas(){

    if(
      state.ratio === "4:5"
    ){

      canvas.width =
        2160;

      canvas.height =
        2700;

    }

    else{

      canvas.width =
        2160;

      canvas.height =
        2160;

    }

  }


  /*
    ==================================================
    IMAGE LOADING
    ==================================================
  */

  async function loadImage(src){

    if(
      imageCache.has(src)
    ){

      return imageCache.get(src);

    }


    const promise =
      new Promise(
        (resolve,reject) => {

          const img =
            new Image();


          img.onload =
            () => resolve(img);


          img.onerror =
            reject;


          img.src =
            src;

        }
      );


    imageCache.set(
      src,
      promise
    );


    return promise;

  }


  /*
    ==================================================
    COVER IMAGE
    ==================================================
  */

  function drawCoverImage(
    img,
    x,
    y,
    w,
    h
  ){

    const imageRatio =
      img.width / img.height;


    const boxRatio =
      w / h;


    let sw;
    let sh;
    let sx;
    let sy;


    if(
      imageRatio > boxRatio
    ){

      sh =
        img.height;


      sw =
        sh * boxRatio;


      sx =
        (img.width - sw) / 2;


      sy =
        0;

    }

    else{

      sw =
        img.width;


      sh =
        sw / boxRatio;


      sx =
        0;


      sy =
        (img.height - sh) / 2;

    }


    ctx.drawImage(
      img,
      sx,
      sy,
      sw,
      sh,
      x,
      y,
      w,
      h
    );

  }


  /*
    ==================================================
    IMAGE TREATMENT
    ==================================================
  */

  function drawImageTreatment(
    config,
    W,
    H
  ){

    ctx.fillStyle =
      "rgba(0,0,0,.07)";


    ctx.fillRect(
      0,
      0,
      W,
      H
    );


    const grad =
      ctx.createLinearGradient(
        0,
        0,
        0,
        H
      );


    grad.addColorStop(
      0,
      `rgba(0,0,0,${config.overlayTop})`
    );


    grad.addColorStop(
      .38,
      "rgba(0,0,0,.14)"
    );


    grad.addColorStop(
      1,
      `rgba(0,0,0,${config.overlayBottom})`
    );


    ctx.fillStyle =
      grad;


    ctx.fillRect(
      0,
      0,
      W,
      H
    );


    const radial =
      ctx.createRadialGradient(
        W/2,
        H/2,
        Math.min(W,H)*.20,
        W/2,
        H/2,
        Math.max(W,H)*.72
      );


    radial.addColorStop(
      0,
      "rgba(0,0,0,0)"
    );


    radial.addColorStop(
      1,
      "rgba(0,0,0,.20)"
    );


    ctx.fillStyle =
      radial;


    ctx.fillRect(
      0,
      0,
      W,
      H
    );

  }


  /*
    ==================================================
    PAPER
    ==================================================
  */

  function drawPaper(
    config,
    W,
    H
  ){

    ctx.fillStyle =
      config.bg;


    ctx.fillRect(
      0,
      0,
      W,
      H
    );


    const glow =
      ctx.createRadialGradient(
        W*.28,
        H*.16,
        0,
        W*.28,
        H*.16,
        W*.9
      );


    glow.addColorStop(
      0,
      "rgba(255,255,255,.38)"
    );


    glow.addColorStop(
      1,
      "rgba(122,96,68,.045)"
    );


    ctx.fillStyle =
      glow;


    ctx.fillRect(
      0,
      0,
      W,
      H
    );


    /*
      Fine parchment texture.
      No decorative top rule.
    */

    ctx.save();


    ctx.globalAlpha =
      .055;


    ctx.strokeStyle =
      "#806C54";


    ctx.lineWidth =
      1.3;


    for(
      let y=40;
      y<H;
      y+=31
    ){

      ctx.beginPath();


      ctx.moveTo(
        0,
        y
      );


      ctx.bezierCurveTo(
        W*.25,
        y+4,
        W*.65,
        y-4,
        W,
        y+2
      );


      ctx.stroke();

    }


    ctx.restore();

  }


  /*
    ==================================================
    TEXT WRAPPING
    ==================================================
  */

  function splitExplicitLines(text){

    return (text || "")
      .replace(/\r/g,"")
      .split("\n");

  }


  function wrapParagraph(
    text,
    maxWidth
  ){

    if(
      !text.trim()
    ){

      return [""];

    }


    const words =
      text
        .trim()
        .split(/\s+/);


    const lines =
      [];


    let line =
      "";


    for(
      const word
      of words
    ){

      const test =
        line
          ? line + " " + word
          : word;


      if(
        ctx.measureText(test).width
        <= maxWidth
        ||
        !line
      ){

        line =
          test;

      }

      else{

        lines.push(
          line
        );


        line =
          word;

      }

    }


    if(line){

      lines.push(
        line
      );

    }


    return lines;

  }


  function wrapText(
    text,
    maxWidth
  ){

    const paragraphs =
      splitExplicitLines(text);


    const result =
      [];


    paragraphs.forEach(
      (paragraph,index) => {


        const wrapped =
          wrapParagraph(
            paragraph,
            maxWidth
          );


        result.push(
          ...wrapped
        );


        if(
          index
          <
          paragraphs.length - 1
        ){

          result.push("");

        }

      }
    );


    return result;

  }


  /*
    ==================================================
    FONT FUNCTIONS
    ==================================================
  */

  /*
    Main text:
      Amiri
  */

  function fontString(
    size,
    weight,
    arabic
  ){

    const family =
      arabic
        ? '"Amiri"'
        : 'Georgia';


    return `${weight} ${size}px ${family}`;

  }


  /*
    Attribution:
      Aref Ruqaa for Arabic

    This gives the speaker/source
    a distinct calligraphic character.
  */

  function metaFontString(
    size,
    weight,
    arabic
  ){

    const family =
      arabic
        ? '"Aref Ruqaa"'
        : 'Georgia';


    return `${weight} ${size}px ${family}`;

  }


  /*
    ==================================================
    FIT MAIN QUOTE
    ==================================================
  */

  function fitQuote(
    text,
    maxWidth,
    maxHeight,
    arabic
  ){

    const textLength =
      text
        .replace(/\s/g,"")
        .length;


    let size;


    if(arabic){

      if(
        textLength <= 90
      ){

        size =
          150;

      }

      else if(
        textLength <= 180
      ){

        size =
          138;

      }

      else if(
        textLength <= 320
      ){

        size =
          124;

      }

      else{

        size =
          112;

      }

    }

    else{

      if(
        textLength <= 120
      ){

        size =
          126;

      }

      else if(
        textLength <= 250
      ){

        size =
          116;

      }

      else{

        size =
          104;

      }

    }


    const minSize =
      arabic
        ? 50
        : 48;


    while(
      size >= minSize
    ){

      ctx.font =
        fontString(
          size,
          400,
          arabic
        );


      const lines =
        wrapText(
          text,
          maxWidth
        );


      const multiplier =
        arabic
          ? getArabicLineHeightMultiplier(text)
          : 1.38;


      const lineHeight =
        size
        *
        multiplier;


      const totalHeight =
        lines.length
        *
        lineHeight;


      if(
        totalHeight <= maxHeight
      ){

        return {

          size,

          lines,

          lineHeight,

          totalHeight

        };

      }


      size -=
        3;

    }


    ctx.font =
      fontString(
        minSize,
        400,
        arabic
      );


    const lines =
      wrapText(
        text,
        maxWidth
      );


    const multiplier =
      arabic
        ? getArabicLineHeightMultiplier(text)
        : 1.38;


    const lineHeight =
      minSize
      *
      multiplier;


    return {

      size:
        minSize,

      lines,

      lineHeight,

      totalHeight:
        lines.length
        *
        lineHeight

    };

  }


  /*
    ==================================================
    MAIN QUOTE DRAWING
    ==================================================
  */

  function drawMainQuote(
    config,
    fitted,
    arabic,
    W,
    startY,
    marginX
  ){

    ctx.save();


    ctx.fillStyle =
      config.text;


    ctx.shadowColor =
      config.type === "image"
        ? config.shadow
        : "rgba(0,0,0,0)";


    ctx.shadowBlur =
      config.type === "image"
        ? 24
        : 0;


    ctx.shadowOffsetY =
      config.type === "image"
        ? 5
        : 0;


    ctx.font =
      fontString(
        fitted.size,
        400,
        arabic
      );


    ctx.textBaseline =
      "top";


    ctx.direction =
      arabic
        ? "rtl"
        : "ltr";


    if(
      state.align === "center"
    ){

      ctx.textAlign =
        "center";

    }

    else{

      ctx.textAlign =
        "right";

    }


    const tx =
      state.align === "center"
        ? W/2
        : W-marginX;


    fitted.lines.forEach(
      (line,index) => {


        ctx.fillText(
          line,
          tx,
          startY
          +
          index
          *
          fitted.lineHeight
        );

      }
    );


    ctx.restore();

  }


  /*
    ==================================================
    HADITH HEADING
    ==================================================

    Exactly:

      قال النبي ﷺ:

    The same x-position / alignment anchor
    is used as the hadith itself.
  */

  function drawHadithHeading(
    config,
    W,
    y,
    marginX
  ){

    const text =
      "قال النبي ﷺ:";


    ctx.save();


    ctx.fillStyle =
      config.text;


    ctx.shadowColor =
      config.type === "image"
        ? config.shadow
        : "rgba(0,0,0,0)";


    ctx.shadowBlur =
      config.type === "image"
        ? 15
        : 0;


    ctx.shadowOffsetY =
      config.type === "image"
        ? 3
        : 0;


    ctx.font =
      fontString(
        state.ratio === "4:5"
          ? 76
          : 70,
        700,
        true
      );


    ctx.direction =
      "rtl";


    ctx.textBaseline =
      "top";


    const headingX =
      state.align === "center"
        ? W/2
        : W-marginX;


    ctx.textAlign =
      state.align === "center"
        ? "center"
        : "right";


    ctx.fillText(
      text,
      headingX,
      y
    );


    ctx.restore();

  }


  /*
    ==================================================
    GENERAL ATTRIBUTION
    ==================================================
  */

  function drawGeneralAttribution(
    config,
    W,
    H,
    marginX,
    author,
    source,
    authorArabic,
    sourceArabic
  ){

    const authorY =
      state.ratio === "4:5"
        ? H * .800
        : H * .785;


    const sourceY =
      authorY
      +
      (
        state.ratio === "4:5"
          ? 128
          : 116
      );


    const metaX =
      state.align === "center"
        ? W/2
        : W-marginX;


    /*
      SPEAKER / AUTHOR

      Larger than previous version.
      Aref Ruqaa.
    */

    if(author){

      ctx.save();


      ctx.fillStyle =
        config.secondary;


      ctx.shadowColor =
        config.type === "image"
          ? config.shadow
          : "rgba(0,0,0,0)";


      ctx.shadowBlur =
        config.type === "image"
          ? 14
          : 0;


      ctx.shadowOffsetY =
        config.type === "image"
          ? 2
          : 0;


      ctx.textBaseline =
        "top";


      ctx.textAlign =
        state.align === "center"
          ? "center"
          : "right";


      ctx.direction =
        authorArabic
          ? "rtl"
          : "ltr";


      ctx.font =
        metaFontString(
          authorArabic
            ? 82
            : 62,
          700,
          authorArabic
        );


      ctx.fillText(
        author,
        metaX,
        authorY
      );


      ctx.restore();

    }


    /*
      SOURCE

      Also larger.
      Aref Ruqaa.
    */

    if(source){

      ctx.save();


      ctx.fillStyle =
        config.secondary;


      ctx.globalAlpha =
        .90;


      ctx.shadowColor =
        config.type === "image"
          ? config.shadow
          : "rgba(0,0,0,0)";


      ctx.shadowBlur =
        config.type === "image"
          ? 11
          : 0;


      ctx.shadowOffsetY =
        config.type === "image"
          ? 2
          : 0;


      ctx.textBaseline =
        "top";


      ctx.textAlign =
        state.align === "center"
          ? "center"
          : "right";


      ctx.direction =
        sourceArabic
          ? "rtl"
          : "ltr";


      ctx.font =
        metaFontString(
          sourceArabic
            ? 60
            : 46,
          400,
          sourceArabic
        );


      ctx.fillText(
        source,
        metaX,
        author
          ? sourceY
          : authorY
      );


      ctx.restore();

    }

  }


  /*
    ==================================================
    HADITH SOURCE
    ==================================================
  */

  function drawHadithSource(
    config,
    W,
    H,
    marginX,
    source,
    sourceArabic
  ){

    if(
      !source
    ){

      return;

    }


    const sourceY =
      state.ratio === "4:5"
        ? H * .815
        : H * .80;


    const sourceX =
      state.align === "center"
        ? W/2
        : W-marginX;


    ctx.save();


    ctx.fillStyle =
      config.secondary;


    ctx.globalAlpha =
      .92;


    ctx.shadowColor =
      config.type === "image"
        ? config.shadow
        : "rgba(0,0,0,0)";


    ctx.shadowBlur =
      config.type === "image"
        ? 11
        : 0;


    ctx.shadowOffsetY =
      config.type === "image"
        ? 2
        : 0;


    ctx.textBaseline =
      "top";


    ctx.textAlign =
      state.align === "center"
        ? "center"
        : "right";


    ctx.direction =
      sourceArabic
        ? "rtl"
        : "ltr";


    ctx.font =
      metaFontString(
        sourceArabic
          ? 61
          : 46,
        400,
        sourceArabic
      );


    ctx.fillText(
      source,
      sourceX,
      sourceY
    );


    ctx.restore();

  }


  /*
    ==================================================
    MAIN TEXT LAYOUT
    ==================================================
  */

  function drawTextBlock(
    config,
    W,
    H
  ){

    const quote =
      quoteInput.value.trim()
      ||
      "اكتب النص هنا";


    const author =
      authorInput.value.trim();


    const source =
      sourceInput.value.trim();


    const quoteArabic =
      containsArabic(
        quote
      );


    const authorArabic =
      containsArabic(
        author
      );


    const sourceArabic =
      containsArabic(
        source
      );


    const marginX =
      W * .10;


    const maxWidth =
      W
      -
      marginX * 2;


    /*
      ================================================
      GENERAL QUOTE
      ================================================
    */

    if(
      state.type === "general"
    ){

      const quoteCenterY =
        state.ratio === "4:5"
          ? H * .445
          : H * .425;


      const quoteSafeTop =
        state.ratio === "4:5"
          ? H * .115
          : H * .10;


      const quoteSafeBottom =
        state.ratio === "4:5"
          ? H * .720
          : H * .700;


      const availableHeight =
        quoteSafeBottom
        -
        quoteSafeTop;


      const fitted =
        fitQuote(
          quote,
          maxWidth,
          availableHeight,
          quoteArabic
        );


      let startY =
        quoteCenterY
        -
        fitted.totalHeight / 2;


      if(
        startY < quoteSafeTop
      ){

        startY =
          quoteSafeTop;

      }


      if(
        startY + fitted.totalHeight
        >
        quoteSafeBottom
      ){

        startY =
          quoteSafeBottom
          -
          fitted.totalHeight;

      }


      drawMainQuote(
        config,
        fitted,
        quoteArabic,
        W,
        startY,
        marginX
      );


      drawGeneralAttribution(
        config,
        W,
        H,
        marginX,
        author,
        source,
        authorArabic,
        sourceArabic
      );

    }


    /*
      ================================================
      HADITH
      ================================================
    */

    else{


      /*
        More room beneath:

          قال النبي ﷺ:

        This is intentionally substantially
        larger than the previous version.
      */

      const headingHeight =
        state.ratio === "4:5"
          ? 108
          : 98;


      const headingGap =
        state.ratio === "4:5"
          ? 128
          : 110;


      const quoteSafeTop =
        state.ratio === "4:5"
          ? H * .105
          : H * .095;


      const quoteSafeBottom =
        state.ratio === "4:5"
          ? H * .735
          : H * .705;


      const availableForEverything =
        quoteSafeBottom
        -
        quoteSafeTop;


      const availableForQuote =
        availableForEverything
        -
        headingHeight
        -
        headingGap;


      const fitted =
        fitQuote(
          quote,
          maxWidth,
          availableForQuote,
          quoteArabic
        );


      const groupHeight =
        headingHeight
        +
        headingGap
        +
        fitted.totalHeight;


      /*
        Hadith group sits slightly higher
        than the general quotation because
        the source remains fixed below.
      */

      const groupCenterY =
        state.ratio === "4:5"
          ? H * .415
          : H * .395;


      let groupStartY =
        groupCenterY
        -
        groupHeight / 2;


      /*
        Top boundary protection.
      */

      if(
        groupStartY
        <
        quoteSafeTop
      ){

        groupStartY =
          quoteSafeTop;

      }


      /*
        Bottom boundary protection.
      */

      if(
        groupStartY
        +
        groupHeight
        >
        quoteSafeBottom
      ){

        groupStartY =
          quoteSafeBottom
          -
          groupHeight;

      }


      const headingY =
        groupStartY;


      const quoteStartY =
        headingY
        +
        headingHeight
        +
        headingGap;


      drawHadithHeading(
        config,
        W,
        headingY,
        marginX
      );


      drawMainQuote(
        config,
        fitted,
        quoteArabic,
        W,
        quoteStartY,
        marginX
      );


      drawHadithSource(
        config,
        W,
        H,
        marginX,
        source,
        sourceArabic
      );

    }


    /*
      ================================================
      PRIVATE WATERMARK
      ================================================
    */

    if(
      watermarkInput.checked
      &&
      watermarkUnlocked
    ){

      ctx.save();


      ctx.fillStyle =
        config.type === "paper"
          ? "rgba(44,41,37,.42)"
          : "rgba(255,255,255,.48)";


      ctx.font =
        metaFontString(
          47,
          400,
          true
        );


      ctx.textAlign =
        "center";


      ctx.textBaseline =
        "bottom";


      ctx.direction =
        "rtl";


      ctx.fillText(
        "المتوكل",
        W/2,
        H-54
      );


      ctx.restore();

    }

  }


  /*
    ==================================================
    RENDER
    ==================================================
  */

  async function render(){

    configureCanvas();


    const W =
      canvas.width;


    const H =
      canvas.height;


    const config =
      themeConfig[
        state.theme
      ];


    ctx.clearRect(
      0,
      0,
      W,
      H
    );


    if(
      config.type === "paper"
    ){

      drawPaper(
        config,
        W,
        H
      );

    }

    else{

      try{

        const img =
          await loadImage(
            config.src
          );


        drawCoverImage(
          img,
          0,
          0,
          W,
          H
        );

      }

      catch(err){

        const fallback =
          ctx.createLinearGradient(
            0,
            0,
            0,
            H
          );


        fallback.addColorStop(
          0,
          "#252735"
        );


        fallback.addColorStop(
          1,
          "#111217"
        );


        ctx.fillStyle =
          fallback;


        ctx.fillRect(
          0,
          0,
          W,
          H
        );


        setStatus(
          `Add ${config.src} to use this background.`,
          2600
        );

      }


      drawImageTreatment(
        config,
        W,
        H
      );

    }


    drawTextBlock(
      config,
      W,
      H
    );

  }


  /*
    ==================================================
    CHOICE GROUPS
    ==================================================
  */

  function bindChoiceGroup(
    groupId,
    key
  ){

    document
      .getElementById(
        groupId
      )
      .addEventListener(
        "click",
        event => {


          const btn =
            event.target.closest(
              ".choice"
            );


          if(
            !btn
          ){

            return;

          }


          const value =
            btn.dataset[key];


          if(
            !value
          ){

            return;

          }


          state[key] =
            value;


          btn.parentElement
            .querySelectorAll(
              ".choice"
            )
            .forEach(
              item => {

                item.classList.remove(
                  "active"
                );

              }
            );


          btn.classList.add(
            "active"
          );


          if(
            key === "type"
          ){

            updateTypeInterface();

          }


          render();

        }
      );

  }


  bindChoiceGroup(
    "typeChoices",
    "type"
  );


  bindChoiceGroup(
    "themeChoices",
    "theme"
  );


  bindChoiceGroup(
    "ratioChoices",
    "ratio"
  );


  bindChoiceGroup(
    "alignChoices",
    "align"
  );


  /*
    ==================================================
    GENERAL / HADITH INTERFACE
    ==================================================
  */

  function updateTypeInterface(){

    if(
      state.type === "hadith"
    ){

      authorField.classList.add(
        "hidden"
      );

    }

    else{

      authorField.classList.remove(
        "hidden"
      );

    }

  }


  /*
    ==================================================
    LIVE UPDATES
    ==================================================
  */

  [
    quoteInput,
    authorInput,
    sourceInput
  ]
  .forEach(
    element => {


      element.addEventListener(
        "input",
        render
      );

    }
  );


  /*
    ==================================================
    WATERMARK PASSWORD
    ==================================================
  */

  watermarkInput
    .addEventListener(
      "change",
      () => {


        if(
          !watermarkInput.checked
        ){

          render();

          return;

        }


        if(
          watermarkUnlocked
        ){

          render();

          return;

        }


        const entered =
          window.prompt(
            "Enter watermark password:"
          );


        if(
          entered ===
          WATERMARK_PASSWORD
        ){

          watermarkUnlocked =
            true;


          watermarkInput.checked =
            true;


          setStatus(
            "Private watermark unlocked.",
            1800
          );


          render();

        }

        else{

          watermarkInput.checked =
            false;


          if(
            entered !== null
          ){

            setStatus(
              "Incorrect password.",
              2000
            );

          }


          render();

        }

      }
    );


  /*
    ==================================================
    DOWNLOAD PNG
    ==================================================
  */

  document
    .getElementById(
      "downloadBtn"
    )
    .addEventListener(
      "click",
      async () => {


        await render();


        const link =
          document.createElement(
            "a"
          );


        let filenameBase;


        if(
          state.type === "hadith"
        ){

          filenameBase =
            "hadith";

        }

        else{

          filenameBase =
            authorInput.value.trim()
            ||
            "quote";

        }


        const safeName =
          filenameBase
            .replace(
              /[^\p{L}\p{N}_-]+/gu,
              "-"
            )
            .replace(
              /^-+|-+$/g,
              ""
            );


        link.download =
          `${
            safeName || "quote"
          }-${
            state.ratio.replace(
              ":",
              "x"
            )
          }.png`;


        link.href =
          canvas.toDataURL(
            "image/png",
            1
          );


        link.click();


        setStatus(
          "PNG downloaded."
        );

      }
    );


  /*
    ==================================================
    COPY IMAGE
    ==================================================
  */

  document
    .getElementById(
      "copyBtn"
    )
    .addEventListener(
      "click",
      async () => {


        try{


          await render();


          const blob =
            await new Promise(
              resolve => {


                canvas.toBlob(
                  resolve,
                  "image/png",
                  1
                );

              }
            );


          if(
            !navigator.clipboard
            ||
            !window.ClipboardItem
          ){

            throw new Error(
              "Clipboard images are not supported."
            );

          }


          await navigator.clipboard.write(
            [

              new ClipboardItem(
                {

                  "image/png":
                    blob

                }
              )

            ]
          );


          setStatus(
            "Image copied."
          );

        }

        catch(err){


          setStatus(
            "Copy Image is not supported here — use Download PNG instead.",
            3000
          );

        }

      }
    );


  /*
    ==================================================
    START / FONT LOADING
    ==================================================

    Canvas measurements depend on the
    actual fonts being loaded first.
  */

  async function start(){

    if(
      document.fonts
      &&
      document.fonts.ready
    ){

      await document.fonts.ready;

    }


    if(
      document.fonts
      &&
      document.fonts.load
    ){

      try{


        await Promise.all(
          [

            /*
              Amiri
            */

            document.fonts.load(
              '400 150px "Amiri"'
            ),

            document.fonts.load(
              '700 76px "Amiri"'
            ),


            /*
              Aref Ruqaa
            */

            document.fonts.load(
              '400 60px "Aref Ruqaa"'
            ),

            document.fonts.load(
              '700 82px "Aref Ruqaa"'
            )

          ]
        );


      }

      catch(err){

        /*
          Continue normally if the browser
          doesn't support explicit loading.
        */

      }

    }


    updateTypeInterface();


    render();

  }


  start();


})();

</script>
