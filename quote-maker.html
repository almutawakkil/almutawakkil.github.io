<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quote Maker · al-Mutawakkil</title>

  <!--
    QUOTE MAKER — VERSION 1.2.1

    Background files:

      assets/quote-maker/night.jpeg
      assets/quote-maker/mountains.jpg
      assets/quote-maker/lake.jpg
      assets/quote-maker/tree.jpg

    Paper is generated directly in the canvas.
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>

    :root{
      --page:#f5f4f1;
      --panel:#ffffff;
      --ink:#191919;
      --muted:#73716d;
      --line:#e6e3dd;
      --paper:#F3EBDD;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;

      color:var(--ink);

      background:
        radial-gradient(
          circle at 15% 0%,
          #fff 0 18%,
          transparent 40%
        ),
        var(--page);

      font-family:
        "Amiri",
        Georgia,
        serif;
    }

    .shell{
      width:min(
        1220px,
        calc(100% - 32px)
      );

      margin:0 auto;
      padding:56px 0 72px;
    }

    /* ===== Al-Mutawakkil site header ===== */

    .site-header{
      max-width:820px;
      margin:0 auto 42px;
    }

    .site-top{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:24px;
    }

    .brand{
      margin:0;
      font-size:36px;
      line-height:1.1;
      font-weight:400;
      letter-spacing:0;
    }

    .site-subtitle{
      margin:5px 0 0;
      color:#6e6d67;
      font-size:16px;
    }

    nav{
      display:flex;
      flex-wrap:wrap;
      gap:18px;
      padding-bottom:4px;
    }

    nav a{
      color:#6e6d67;
      text-decoration:none;
      font-size:16px;
    }

    nav a:hover,
    nav a.active{
      color:#27500a;
    }

    /* ===== Tool heading ===== */

    .tool-intro{
      max-width:820px;
      margin:0 auto 24px;
    }

    .tool-title{
      margin:0 0 6px;
      font-size:34px;
      line-height:1.2;
      font-weight:400;
      letter-spacing:0;
    }

    .tool-intro p{
      margin:0;
      color:var(--muted);
      font-size:17px;
    }

    .layout{
      display:grid;

      grid-template-columns:
        minmax(330px,440px)
        minmax(0,1fr);

      gap:26px;

      align-items:start;
    }

    .panel{
      background:
        rgba(255,255,255,.9);

      border:
        1px solid var(--line);

      border-radius:22px;

      box-shadow:
        0 18px 48px
        rgba(40,35,28,.06);
    }

    .controls{
      padding:22px;

      position:sticky;

      top:18px;
    }

    .section + .section{
      margin-top:22px;

      padding-top:22px;

      border-top:
        1px solid var(--line);
    }

    .section-title{
      margin:0 0 12px;

      color:#8b8882;

      font-size:12px;

      font-weight:600;

      text-transform:uppercase;

      letter-spacing:.11em;
    }

    label{
      display:block;

      margin:0 0 7px;

      font-size:13px;

      font-weight:600;
    }

    .field + .field{
      margin-top:14px;
    }

    .optional-control{
      margin-top:9px;
      padding:0;
      border:0;
      background:transparent;
      color:#4f681f;
      font:600 13px Georgia,serif;
      cursor:pointer;
    }

    .optional-control:hover{ text-decoration:underline; }

    .translation-field[hidden],
    .watermark-text-field[hidden]{ display:none; }

    #translation{
      min-height:120px;
      direction:ltr;
      line-height:1.55;
      font-family:Georgia,serif;
      font-size:16px;
    }

    #source{
      min-height:74px;
      line-height:1.55;
      font-size:18px;
    }

    .watermark-text-field{ margin-top:14px; }

    .fit-warning{
      min-height:20px;
      margin:12px 0 0;
      color:#9a3f30;
      font:600 13px/1.45 Georgia,sans-serif;
    }

    textarea,
    input{
      width:100%;

      padding:12px 13px;

      border:
        1px solid #dcd9d2;

      border-radius:13px;

      background:#fff;

      color:#1d1d1b;

      outline:none;

      transition:
        border-color .15s,
        box-shadow .15s;
    }

    textarea{
      min-height:190px;

      resize:vertical;

      line-height:1.95;

      font-family:
        "Amiri",
        serif;

      font-size:21px;
    }

    input{
      font-family:
        "Amiri",
        Georgia,
        serif;

      font-size:18px;
    }

    input::placeholder,
    textarea::placeholder{
      font-family:
        "Amiri",
        Georgia,
        serif;
    }

    input:focus,
    textarea:focus{
      border-color:#aaa59b;

      box-shadow:
        0 0 0 3px
        rgba(70,65,58,.07);
    }

    .segmented{
      display:grid;

      gap:8px;
    }

    .segmented.two{
      grid-template-columns:
        repeat(2,1fr);
    }

    .segmented.five{
      grid-template-columns:
        repeat(2,1fr);
    }

    .segmented.five .choice:last-child{
      grid-column:
        1 / -1;
    }

    button{
      font:inherit;
    }

    .choice{
      padding:10px 11px;

      border:
        1px solid #dedbd4;

      border-radius:12px;

      background:#fff;

      color:#403e39;

      cursor:pointer;

      transition:.15s ease;

      font-size:13px;
    }

    .choice:hover{
      border-color:#bdb8ae;
    }

    .choice.active{
      background:#232321;

      color:#fff;

      border-color:#232321;
    }

    .toggle-row{
      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:16px;
    }

    .toggle-copy strong{
      display:block;

      margin-bottom:3px;

      font-size:13px;
    }

    .toggle-copy span{
      display:block;

      color:var(--muted);

      font-size:12px;

      line-height:1.45;
    }

    .switch{
      position:relative;

      width:46px;

      height:27px;

      flex:0 0 auto;
    }

    .switch input{
      opacity:0;

      width:0;

      height:0;
    }

    .slider{
      position:absolute;

      inset:0;

      border-radius:99px;

      background:#d7d4ce;

      cursor:pointer;

      transition:.18s;
    }

    .slider:before{
      content:"";

      position:absolute;

      width:21px;

      height:21px;

      left:3px;

      top:3px;

      border-radius:50%;

      background:#fff;

      box-shadow:
        0 2px 7px
        rgba(0,0,0,.14);

      transition:.18s;
    }

    .switch input:checked + .slider{
      background:#232321;
    }

    .switch input:checked + .slider:before{
      transform:
        translateX(19px);
    }

    .actions{
      display:grid;

      grid-template-columns:
        1fr 1fr;

      gap:9px;
    }

    .primary,
    .secondary{
      padding:12px 14px;

      border:
        1px solid #252522;

      border-radius:13px;

      cursor:pointer;

      font-weight:600;
    }

    .primary{
      background:#252522;

      color:#fff;
    }

    .secondary{
      background:#fff;

      color:#252522;
    }

    .note{
      margin:12px 0 0;

      color:#77746e;

      font-size:11px;

      line-height:1.55;
    }

    .preview-panel{
      min-height:500px;

      padding:22px;

      display:flex;

      align-items:center;

      justify-content:center;

      overflow:hidden;

      background:
        linear-gradient(
          45deg,
          #f1efe9 25%,
          transparent 25%
        ),
        linear-gradient(
          -45deg,
          #f1efe9 25%,
          transparent 25%
        ),
        linear-gradient(
          45deg,
          transparent 75%,
          #f1efe9 75%
        ),
        linear-gradient(
          -45deg,
          transparent 75%,
          #f1efe9 75%
        );

      background-size:
        24px 24px;

      background-position:
        0 0,
        0 12px,
        12px -12px,
        -12px 0;
    }

    .canvas-wrap{
      width:min(
        100%,
        560px
      );

      filter:
        drop-shadow(
          0 24px 34px
          rgba(36,31,25,.16)
        );
    }

    canvas{
      display:block;

      width:100%;

      height:auto;

      border-radius:4px;

      background:#ddd;
    }

    .status{
      min-height:18px;

      margin-top:10px;

      color:#77736d;

      text-align:center;

      font-size:12px;
    }

    .hidden{
      display:none;
    }

    @media(max-width:900px){

      .layout{
        grid-template-columns:1fr;
      }

      .controls{
        position:static;
      }

      .preview-panel{
        padding:16px;
      }

    }

    @media(max-width:520px){

      .shell{
        width:min(
          100% - 18px,
          1220px
        );

        padding-top:32px;
      }

      .site-header{
        margin-bottom:36px;
      }

      .site-top{
        align-items:flex-start;
        flex-direction:column;
        gap:14px;
      }

      .brand{
        font-size:32px;
      }

      nav{
        gap:14px;
      }

      nav a{
        font-size:15px;
      }

      .tool-title{
        font-size:31px;
      }

      .panel{
        border-radius:17px;
      }

      .controls{
        padding:16px;
      }

      .actions{
        grid-template-columns:1fr;
      }

    }


    /* ===== Dark mode ===== */

    @media (prefers-color-scheme: dark){

      :root{
        --page:#1b1a18;
        --panel:#22211f;
        --ink:#f2efe8;
        --muted:#9b9890;
        --line:rgba(255,255,255,.08);
        --soft:rgba(255,255,255,.07);
      }

      body{
        background:#1b1a18;
        color:#f2efe8;
      }

      .site-subtitle,
      nav a,
      .tool-intro p,
      .toggle-copy span,
      .note,
      .status{
        color:#9b9890;
      }

      nav a:hover,
      nav a.active{
        color:#b8d98d;
      }

      .panel{
        background:#22211f;
        border-color:rgba(255,255,255,.08);
        box-shadow:0 18px 48px rgba(0,0,0,.18);
      }

      .section + .section{
        border-color:rgba(255,255,255,.08);
      }

      .section-title{
        color:#a8a59d;
      }

      textarea,
      input{
        background:#1b1a18;
        color:#f2efe8;
        border-color:rgba(255,255,255,.15);
      }

      textarea:focus,
      input:focus{
        border-color:#8da675;
        box-shadow:0 0 0 3px rgba(184,217,141,.08);
      }

      .choice{
        background:#1b1a18;
        color:#d8d5cd;
        border-color:rgba(255,255,255,.14);
      }

      .choice:hover{
        border-color:rgba(255,255,255,.28);
      }

      .choice.active{
        background:#496f2b;
        color:#fff;
        border-color:#496f2b;
      }

      .slider{
        background:#4b4944;
      }

      .switch input:checked + .slider{
        background:#496f2b;
      }

      .primary{
        background:#496f2b;
        color:#fff;
        border-color:#496f2b;
      }

      .secondary{
        background:#1b1a18;
        color:#f2efe8;
        border-color:rgba(255,255,255,.18);
      }

      .preview-panel{
        background:
          linear-gradient(45deg,#292824 25%,transparent 25%),
          linear-gradient(-45deg,#292824 25%,transparent 25%),
          linear-gradient(45deg,transparent 75%,#292824 75%),
          linear-gradient(-45deg,transparent 75%,#292824 75%);
        background-size:24px 24px;
        background-position:0 0,0 12px,12px -12px,-12px 0;
      }

      .canvas-wrap{
        filter:drop-shadow(0 24px 34px rgba(0,0,0,.35));
      }

    }

  </style>
</head>

<body>

  <main class="shell">

    <header class="site-header">
      <div class="site-top">

        <div>
          <h1 class="brand">المتوكل</h1>
          <p class="site-subtitle">Islamic Library</p>
        </div>

        <nav>
          <a href="index.html">Translated Works</a>
          <a href="excerpts.html" lang="ar" dir="rtl">مختارات من التراث</a>
          <a href="adhkar.html" lang="ar" dir="rtl">الأذكار</a>
          <a href="tools.html" class="active">Tools</a>
        </nav>

      </div>
    </header>


    <div class="layout">

      <aside class="panel controls">


        <!-- CONTENT -->

        <section class="section">

          <p class="section-title">
            Content
          </p>


          <div class="field">

            <label for="author">
              Attribution
            </label>

            <input
              id="author"
              dir="auto"
              placeholder="عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:"
              value=""
            />

          </div>


          <div class="field">

            <label for="quote">
              Quote
            </label>

            <textarea
              id="quote"
              dir="auto"
            >لَا تَكْذِبُوا عَلَيَّ فَإِنَّهُ مَنْ كَذَبَ عَلَيَّ فَلْيَلِجِ النَّارَ.</textarea>

            <button
              type="button"
              class="optional-control"
              id="translationToggle"
              aria-expanded="false"
              aria-controls="translationField"
            >+ Add English translation</button>

          </div>

          <div
            class="field translation-field"
            id="translationField"
            hidden
          >
            <label for="translation">English translation</label>
            <textarea id="translation" dir="ltr"></textarea>
          </div>


          <div class="field">

            <label for="source">
              Source
            </label>

            <textarea
              id="source"
              dir="auto"
            >صحيح البخاري</textarea>

          </div>

        </section>


        <!-- STYLE -->

        <section class="section">

          <p class="section-title">
            Style
          </p>


          <label>
            Background
          </label>

          <div
            class="segmented five"
            id="themeChoices"
          >

            <button
              class="choice active"
              data-theme="night"
            >
              Night
            </button>

            <button
              class="choice"
              data-theme="mountains"
            >
              Mountains
            </button>

            <button
              class="choice"
              data-theme="lake"
            >
              Lake
            </button>

            <button
              class="choice"
              data-theme="tree"
            >
              Tree
            </button>

            <button
              class="choice"
              data-theme="paper"
            >
              Paper
            </button>

          </div>


          <div style="height:14px"></div>


          <label>
            Format
          </label>

          <div
            class="segmented two"
            id="ratioChoices"
          >

            <button
              class="choice active"
              data-ratio="4:5"
            >
              4:5 Portrait
            </button>

            <button
              class="choice"
              data-ratio="1:1"
            >
              1:1 Square
            </button>

          </div>


          <div style="height:14px"></div>


          <label>
            Text alignment
          </label>

          <div
            class="segmented two"
            id="alignChoices"
          >

            <button
              class="choice active"
              data-align="center"
            >
              Centered
            </button>

            <button
              class="choice"
              data-align="right"
            >
              Right / Justified
            </button>

          </div>

        </section>


        <!-- WATERMARK -->

        <section class="section">

          <div class="toggle-row">

            <div class="toggle-copy">

              <strong>
                Private watermark
              </strong>

              <span>
                Adds المتوكل — requires access.
              </span>

            </div>

            <label
              class="switch"
              aria-label="Toggle private watermark"
            >

              <input
                id="watermark"
                type="checkbox"
              >

              <span class="slider"></span>

            </label>

          </div>

          <div
            class="field watermark-text-field"
            id="watermarkTextField"
            hidden
          >
            <label for="watermarkText">Watermark text</label>
            <input id="watermarkText" dir="auto" value="المتوكل" />
          </div>

        </section>


        <!-- ACTIONS -->

        <section class="section">

          <div class="actions">

            <button
              class="primary"
              id="downloadBtn"
            >
              Download PNG
            </button>

            <button
              class="secondary"
              id="copyBtn"
            >
              Copy Image
            </button>

          </div>

          <p class="note">
            Please verify quotations and sources before sharing.
            This tool formats the text provided; it does not verify
            its authenticity.
          </p>

        </section>

      </aside>


      <!-- PREVIEW -->

      <section>

        <div class="panel preview-panel">

          <div class="canvas-wrap">

            <canvas
              id="card"
              width="2160"
              height="2700"
            ></canvas>

          </div>

        </div>

        <div
          class="status"
          id="status"
        ></div>

        <p class="fit-warning" id="fitWarning" role="status" aria-live="polite"></p>

      </section>

    </div>

  </main>


<script>

(() => {


  /*
    ==================================================
    ELEMENTS
    ==================================================
  */

  const canvas =
    document.getElementById("card");

  const ctx =
    canvas.getContext("2d");

  const quoteInput =
    document.getElementById("quote");

  const authorInput =
    document.getElementById("author");

  const sourceInput =
    document.getElementById("source");

  const translationInput =
    document.getElementById("translation");

  const translationToggle =
    document.getElementById("translationToggle");

  const translationField =
    document.getElementById("translationField");

  const watermarkInput =
    document.getElementById("watermark");

  const watermarkTextInput =
    document.getElementById("watermarkText");

  const watermarkTextField =
    document.getElementById("watermarkTextField");

  const fitWarning =
    document.getElementById("fitWarning");

  const statusEl =
    document.getElementById("status");


  /*
    ==================================================
    STATE
    ==================================================
  */

  const state = {

    theme:"night",

    ratio:"4:5",

    align:"center",

    translationEnabled:false

  };


  /*
    ==================================================
    PRIVATE WATERMARK
    ==================================================
  */

  const WATERMARK_PASSWORD =
    "barbarawi";

  let watermarkUnlocked =
    false;


  /*
    ==================================================
    THEMES
    ==================================================
  */

  const themeConfig = {


    /*
      Night remains very close to
      the existing treatment.
    */

    night:{

      type:"image",

      src:
        "assets/quote-maker/night.jpeg",

      text:
        "#F7F4ED",

      secondary:
        "#F7F4ED",

      shadow:
        "rgba(0,0,0,.55)",

      overlayTop:.13,

      overlayMiddle:.14,

      overlayBottom:.60,

      veil:
        "rgba(0,0,0,.07)"

    },


    /*
      Dramatic mountain image.

      Slightly stronger treatment than Night
      because the sky has brighter regions.
    */

    mountains:{

      type:"image",

      src:
        "assets/quote-maker/mountains.jpg",

      text:
        "#FBF8F0",

      secondary:
        "#FBF8F0",

      shadow:
        "rgba(0,0,0,.60)",

      overlayTop:.26,

      overlayMiddle:.22,

      overlayBottom:.58,

      veil:
        "rgba(11,20,27,.08)"

    },


    /*
      Lake image is naturally bright,
      especially in the sky and water.

      Dark treatment ensures consistent
      white typography.
    */

    lake:{

      type:"image",

      src:
        "assets/quote-maker/lake.jpg",

      text:
        "#FFFDF6",

      secondary:
        "#FFFDF6",

      shadow:
        "rgba(0,0,0,.62)",

      overlayTop:.28,

      overlayMiddle:.24,

      overlayBottom:.55,

      veil:
        "rgba(11,22,26,.10)"

    },


    /*
      Tree image is deliberately soft
      and very bright.

      We keep that painterly feeling
      but darken the whole photograph
      substantially for text readability.
    */

    tree:{

      type:"image",

      src:
        "assets/quote-maker/tree.jpg",

      text:
        "#FFFDF7",

      secondary:
        "#FFFDF7",

      shadow:
        "rgba(25,18,12,.68)",

      overlayTop:.34,

      overlayMiddle:.30,

      overlayBottom:.52,

      veil:
        "rgba(32,26,18,.15)"

    },


    /*
      Paper uses dark warm-brown typography.

      Watermark now inherits the same
      secondary color.
    */

    paper:{

      type:"paper",

      bg:
        "#F3EBDD",

      text:
        "#2C2925",

      secondary:
        "#62584D"

    }

  };


  const imageCache =
    new Map();


  /*
    ==================================================
    STATUS
    ==================================================
  */

  function setStatus(
    text,
    timeout = 1700
  ){

    statusEl.textContent =
      text;


    if(timeout){

      clearTimeout(
        setStatus.timer
      );


      setStatus.timer =
        setTimeout(
          () => {

            statusEl.textContent =
              "";

          },

          timeout
        );

    }

  }


  /*
    ==================================================
    LANGUAGE DETECTION
    ==================================================
  */

  function containsArabic(text){

    return /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/
      .test(text || "");

  }


  /*
    ==================================================
    HARAKAT DETECTION
    ==================================================
  */

  function harakatRatio(text){

    const letters =
      (
        text.match(
          /[\u0621-\u064A\u066E-\u06D3]/g
        )
        ||
        []
      ).length;


    const marks =
      (
        text.match(
          /[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED]/g
        )
        ||
        []
      ).length;


    if(
      letters === 0
    ){

      return 0;

    }


    return marks / letters;

  }


  /*
    Generous Amiri spacing,
    especially with full vocalization.

    We don't go excessively wide because
    doing so unnecessarily reduces font size.
  */

  function getArabicLineHeightMultiplier(text){

    const ratio =
      harakatRatio(text);


    if(
      ratio >= .42
    ){

      return 1.94;

    }


    if(
      ratio >= .22
    ){

      return 1.85;

    }


    return 1.74;

  }


  /*
    ==================================================
    CANVAS
    ==================================================
  */

  function configureCanvas(){

    if(
      state.ratio === "4:5"
    ){

      canvas.width =
        2160;

      canvas.height =
        2700;

    }

    else{

      canvas.width =
        2160;

      canvas.height =
        2160;

    }

  }


  /*
    ==================================================
    IMAGE LOADING
    ==================================================
  */

  async function loadImage(src){

    if(
      imageCache.has(src)
    ){

      return imageCache.get(src);

    }


    const promise =
      new Promise(
        (resolve,reject) => {


          const img =
            new Image();


          img.onload =
            () => resolve(img);


          img.onerror =
            () => {
              imageCache.delete(src);
              reject(new Error(`Unable to load background: ${src}`));
            };


          img.src =
            src;

        }
      );


    imageCache.set(
      src,
      promise
    );


    return promise;

  }


  /*
    ==================================================
    COVER CROPPING
    ==================================================

    Image dimensions do NOT need
    to match the canvas.

    Landscape, portrait and square images
    all work.

    The image is enlarged until it fills
    the canvas, then excess is cropped.
  */

  function drawCoverImage(
    img,
    x,
    y,
    w,
    h
  ){

    const imageRatio =
      img.width / img.height;


    const boxRatio =
      w / h;


    let sw;
    let sh;
    let sx;
    let sy;


    if(
      imageRatio > boxRatio
    ){

      sh =
        img.height;


      sw =
        sh * boxRatio;


      sx =
        (img.width - sw) / 2;


      sy =
        0;

    }

    else{

      sw =
        img.width;


      sh =
        sw / boxRatio;


      sx =
        0;


      sy =
        (img.height - sh) / 2;

    }


    ctx.drawImage(
      img,
      sx,
      sy,
      sw,
      sh,
      x,
      y,
      w,
      h
    );

  }


  /*
    ==================================================
    PHOTO TREATMENT
    ==================================================
  */

  function drawImageTreatment(
    config,
    W,
    H
  ){

    /*
      Theme-specific veil.
    */

    ctx.fillStyle =
      config.veil;


    ctx.fillRect(
      0,
      0,
      W,
      H
    );


    /*
      Vertical tonal treatment.
    */

    const grad =
      ctx.createLinearGradient(
        0,
        0,
        0,
        H
      );


    grad.addColorStop(
      0,
      `rgba(0,0,0,${config.overlayTop})`
    );


    grad.addColorStop(
      .42,
      `rgba(0,0,0,${config.overlayMiddle})`
    );


    grad.addColorStop(
      1,
      `rgba(0,0,0,${config.overlayBottom})`
    );


    ctx.fillStyle =
      grad;


    ctx.fillRect(
      0,
      0,
      W,
      H
    );


    /*
      Edge vignette.
    */

    const radial =
      ctx.createRadialGradient(
        W/2,
        H/2,
        Math.min(W,H)*.20,
        W/2,
        H/2,
        Math.max(W,H)*.72
      );


    radial.addColorStop(
      0,
      "rgba(0,0,0,0)"
    );


    radial.addColorStop(
      1,
      "rgba(0,0,0,.20)"
    );


    ctx.fillStyle =
      radial;


    ctx.fillRect(
      0,
      0,
      W,
      H
    );

  }


  /*
    ==================================================
    PAPER
    ==================================================
  */

  function drawPaper(
    config,
    W,
    H
  ){

    ctx.fillStyle =
      config.bg;


    ctx.fillRect(
      0,
      0,
      W,
      H
    );


    /*
      Warm paper variation.
    */

    const glow =
      ctx.createRadialGradient(
        W*.28,
        H*.16,
        0,
        W*.28,
        H*.16,
        W*.9
      );


    glow.addColorStop(
      0,
      "rgba(255,255,255,.38)"
    );


    glow.addColorStop(
      1,
      "rgba(122,96,68,.045)"
    );


    ctx.fillStyle =
      glow;


    ctx.fillRect(
      0,
      0,
      W,
      H
    );


    /*
      Fine paper fibers.
    */

    ctx.save();


    ctx.globalAlpha =
      .055;


    ctx.strokeStyle =
      "#806C54";


    ctx.lineWidth =
      1.3;


    for(
      let y=40;
      y<H;
      y+=31
    ){

      ctx.beginPath();


      ctx.moveTo(
        0,
        y
      );


      ctx.bezierCurveTo(
        W*.25,
        y+4,
        W*.65,
        y-4,
        W,
        y+2
      );


      ctx.stroke();

    }


    ctx.restore();

  }


  /*
    ==================================================
    FONTS
    ==================================================
  */

  function quoteFont(
    size,
    weight,
    arabic
  ){

    const family =
      arabic
        ? '"Amiri"'
        : '"Amiri", "Times New Roman", serif';


    return `${weight} ${size}px ${family}`;

  }


  function metaFont(
    size,
    weight,
    arabic
  ){

    const family =
      arabic
        ? '"Aref Ruqaa"'
        : '"Amiri", "Times New Roman", serif';


    return `${weight} ${size}px ${family}`;

  }


  /*
    ==================================================
    PARAGRAPH + LINE WRAPPING
    ==================================================

    Each line carries metadata telling us
    whether it is the final line of its
    paragraph.

    That is important for justification:
    final lines should remain naturally
    right aligned.
  */

  function splitParagraphs(text){

    return (text || "")
      .replace(/\r/g,"")
      .split("\n");

  }


  function wrapOneParagraph(
    text,
    maxWidth
  ){

    if(
      !text.trim()
    ){

      return [
        {
          text:"",
          paragraphEnd:true,
          blank:true
        }
      ];

    }


    const words =
      text
        .trim()
        .split(/\s+/);


    const rawLines =
      [];


    let line =
      "";


    for(
      const word
      of words
    ){

      const test =
        line
          ? line + " " + word
          : word;


      if(
        ctx.measureText(test).width
        <= maxWidth
        ||
        !line
      ){

        line =
          test;

      }

      else{

        rawLines.push(
          line
        );


        line =
          word;

      }

    }


    if(line){

      rawLines.push(
        line
      );

    }


    return rawLines.map(
      (lineText,index) => ({

        text:
          lineText,

        paragraphEnd:
          index === rawLines.length - 1,

        blank:false

      })
    );

  }


  function wrapText(
    text,
    maxWidth
  ){

    const paragraphs =
      splitParagraphs(text);


    const result =
      [];


    paragraphs.forEach(
      (paragraph,index) => {


        const wrapped =
          wrapOneParagraph(
            paragraph,
            maxWidth
          );


        result.push(
          ...wrapped
        );


        /*
          Preserve manually-entered
          paragraph separation.
        */

        if(
          index
          <
          paragraphs.length - 1
        ){

          result.push(
            {
              text:"",
              paragraphEnd:true,
              blank:true
            }
          );

        }

      }
    );


    return result;

  }









  /*
    ==================================================
    JUSTIFIED ARABIC
    ==================================================

    Canvas does not give us high-end Arabic
    book-layout justification.

    We therefore use restrained word-space
    distribution.

    We DO NOT insert tatweel/kashida into the
    quoted Arabic itself.

    Rules:

      - right-aligned mode only
      - at least 3 words
      - never final paragraph line
      - never blank line
      - never stretch excessively
  */

  function drawJustifiedLine(
    text,
    rightX,
    y,
    targetWidth
  ){

    const words =
      text
        .trim()
        .split(/\s+/);


    if(
      words.length < 3
    ){

      ctx.textAlign =
        "right";


      ctx.fillText(
        text,
        rightX,
        y
      );


      return;

    }


    /*
      Measure all words individually.
    */

    const widths =
      words.map(
        word =>
          ctx.measureText(word).width
      );


    const wordsWidth =
      widths.reduce(
        (sum,width) =>
          sum + width,
        0
      );


    const gaps =
      words.length - 1;


    const normalSpace =
      ctx.measureText(" ").width;


    const naturalWidth =
      wordsWidth
      +
      normalSpace
      *
      gaps;


    const extra =
      targetWidth
      -
      naturalWidth;


    /*
      If the line is already close to width,
      or if justification would create huge
      spaces, keep normal right alignment.
    */

    if(
      extra <= 0
      ||
      extra / gaps
      >
      normalSpace * 2.35
    ){

      ctx.textAlign =
        "right";


      ctx.fillText(
        text,
        rightX,
        y
      );


      return;

    }


    const gapWidth =
      normalSpace
      +
      extra / gaps;


    /*
      RTL line:
      begin at right edge and manually
      move left word-by-word.
    */

    ctx.textAlign =
      "right";


    let x =
      rightX;


    words.forEach(
      (word,index) => {


        ctx.fillText(
          word,
          x,
          y
        );


        x -=
          widths[index];


        if(
          index
          <
          words.length - 1
        ){

          x -=
            gapWidth;

        }

      }
    );

  }


  /*
    ==================================================
    DRAW MAIN QUOTE / MATN
    ==================================================
  */

  function drawMainQuote(
    config,
    fitted,
    arabic,
    W,
    startY,
    marginX
  ){

    ctx.save();


    ctx.fillStyle =
      config.text;


    ctx.shadowColor =
      config.type === "image"
        ? config.shadow
        : "rgba(0,0,0,0)";


    ctx.shadowBlur =
      config.type === "image"
        ? 24
        : 0;


    ctx.shadowOffsetY =
      config.type === "image"
        ? 5
        : 0;


    ctx.font =
      quoteFont(
        fitted.size,
        400,
        arabic
      );


    ctx.textBaseline =
      "top";


    ctx.direction =
      arabic
        ? "rtl"
        : "ltr";


    const maxTextWidth =
      W
      -
      marginX * 2;


    /*
      CENTERED
    */

    if(
      state.align === "center"
    ){

      ctx.textAlign =
        "center";


      fitted.lines.forEach(
        (line,index) => {


          if(
            line.blank
          ){

            return;

          }


          ctx.fillText(
            line.text,
            W/2,
            startY
            +
            index
            *
            fitted.lineHeight
          );

        }
      );

    }


    /*
      RIGHT / JUSTIFIED
    */

    else{

      const rightX =
        W
        -
        marginX;


      fitted.lines.forEach(
        (line,index) => {


          if(
            line.blank
          ){

            return;

          }


          const y =
            startY
            +
            index
            *
            fitted.lineHeight;


          /*
            Arabic non-final paragraph lines
            receive restrained justification.
          */

          if(
            arabic
            &&
            !line.paragraphEnd
          ){

            drawJustifiedLine(
              line.text,
              rightX,
              y,
              maxTextWidth
            );

          }

          else{

            ctx.textAlign =
              "right";


            ctx.fillText(
              line.text,
              rightX,
              y
            );

          }

        }
      );

    }


    ctx.restore();


    return (
      startY
      +
      fitted.totalHeight
    );

  }


  /*
    ==================================================
    ATTRIBUTION
    ==================================================

    One optional attribution field now serves every
    card. It preserves the strong visual treatment of
    the former Hadith heading while allowing arbitrary
    text, and may be left blank.
  */

  function fitAttribution(text,maxWidth,arabic,ratio,maxHeight){
    if(!text){ return null; }

    const maxSize = ratio === "4:5" ? 114 : 103;
    const minSize = arabic ? 68 : 60;
    const allowedHeight = Math.max(1,maxHeight || Infinity);
    let best = null;

    function measureAttribution(size){
      const font = quoteFont(size,700,arabic);
      const multiplier = arabic
        ? Math.max(1.48,getArabicLineHeightMultiplier(text)*.80)
        : 1.30;
      const lineHeight = measuredLineAdvance(text,size,multiplier,font);
      return measureWrappedBlock(text,maxWidth,size,font,lineHeight);
    }

    for(let low=minSize,high=maxSize;low<=high;){
      const size = Math.floor((low+high)/2);
      const candidate = measureAttribution(size);
      if(candidate.totalHeight <= allowedHeight){
        best = candidate;
        low = size + 1;
      }else{
        high = size - 1;
      }
    }

    const result = best || measureAttribution(minSize);
    return {...result,overflow:result.totalHeight > allowedHeight};
  }


  function drawAttribution(
    config,
    fitted,
    arabic,
    W,
    y,
    marginX
  ){

    if(!fitted){
      return y;
    }


    ctx.save();


    ctx.fillStyle =
      config.text;


    ctx.shadowColor =
      config.type === "image"
        ? config.shadow
        : "rgba(0,0,0,0)";


    ctx.shadowBlur =
      config.type === "image"
        ? 18
        : 0;


    ctx.shadowOffsetY =
      config.type === "image"
        ? 3
        : 0;


    ctx.font =
      quoteFont(
        fitted.size,
        700,
        arabic
      );


    ctx.direction =
      arabic
        ? "rtl"
        : "ltr";


    ctx.textBaseline =
      "top";


    ctx.textAlign =
      state.align === "center"
        ? "center"
        : "right";


    const x =
      state.align === "center"
        ? W/2
        : W-marginX;


    fitted.lines.forEach(
      (line,index) => {

        if(line.blank){
          return;
        }


        ctx.fillText(
          line.text,
          x,
          y
          +
          index * fitted.lineHeight
        );

      }
    );


    ctx.restore();


    return y + fitted.totalHeight;

  }





  








  /*
    ==================================================
    PRECISION LAYOUT v1.2
    ==================================================

    The renderer below replaces the earlier threshold-based
    composition with a measured two-pass plan.  It deliberately
    leaves the original drawing helpers intact so the established
    Arabic rendering and justification remain unchanged.
  */

  function clamp(value,min,max){
    return Math.max(min,Math.min(max,value));
  }


  function measuredLineAdvance(text,size,multiplier,font){
    ctx.font = font;
    const metrics = ctx.measureText(text || "Hg");
    const paintedHeight =
      Number.isFinite(metrics.actualBoundingBoxAscent) &&
      Number.isFinite(metrics.actualBoundingBoxDescent)
        ? metrics.actualBoundingBoxAscent + metrics.actualBoundingBoxDescent
        : size;

    /* Keep the established rhythm while protecting unusually tall glyphs. */
    return Math.max(size*multiplier,paintedHeight*1.12);
  }


  function measureWrappedBlock(text,maxWidth,size,font,lineHeight){
    ctx.font = font;
    const lines = wrapText(text,maxWidth);
    return {
      size,
      lines,
      lineHeight,
      totalHeight:lines.length * lineHeight
    };
  }


  function fitSource(text,maxWidth,maxHeight){
    if(!text){ return null; }

    const arabic = containsArabic(text);
    const maxSize = arabic ? 86 : 62;
    const minSize = arabic ? 48 : 38;
    let best = null;

    for(let low=minSize,high=maxSize;low<=high;){
      const size = Math.floor((low+high)/2);
      const font = metaFont(size,400,arabic);
      const lineHeight = measuredLineAdvance(
        text,size,arabic ? 1.50 : 1.32,font
      );
      const measured = measureWrappedBlock(
        text,maxWidth,size,font,lineHeight
      );

      if(measured.totalHeight <= maxHeight){
        best = measured;
        low = size + 1;
      }else{
        high = size - 1;
      }
    }

    if(best){ return {...best,arabic,overflow:false}; }

    const font = metaFont(minSize,400,arabic);
    const lineHeight = measuredLineAdvance(
      text,minSize,arabic ? 1.50 : 1.32,font
    );
    const measured = measureWrappedBlock(
      text,maxWidth,minSize,font,lineHeight
    );
    return {...measured,arabic,overflow:measured.totalHeight > maxHeight};
  }


  function fitComposition(quote,translation,maxWidth,maxHeight,quoteArabic){
    const minQuote = quoteArabic ? 50 : 46;
    const maxQuote = quoteArabic ? 188 : 132;
    const hasEnglish = state.translationEnabled && !!translation;
    let best = null;

    function measureComposition(size){
      const quoteTypeface = quoteFont(size,400,quoteArabic);
      const quoteLineHeight = measuredLineAdvance(
        quote,
        size,
        quoteArabic ? getArabicLineHeightMultiplier(quote) : 1.38,
        quoteTypeface
      );
      const quoteFit = measureWrappedBlock(
        quote,maxWidth,size,quoteTypeface,quoteLineHeight
      );

      let englishFit = null;
      let translationGap = 0;

      if(hasEnglish){
        const englishSize = clamp(Math.round(size * .62),34,82);
        const englishTypeface = quoteFont(englishSize,400,false);
        const englishLineHeight = measuredLineAdvance(
          translation,englishSize,1.43,englishTypeface
        );
        englishFit = measureWrappedBlock(
          translation,maxWidth,englishSize,englishTypeface,englishLineHeight
        );
        translationGap = clamp(size * .31,44,70);
      }

      return {
        quoteFit,
        englishFit,
        translationGap,
        totalHeight:quoteFit.totalHeight + translationGap +
          (englishFit ? englishFit.totalHeight : 0)
      };
    }

    for(let low=minQuote,high=maxQuote;low<=high;){
      const size = Math.floor((low+high)/2);
      const candidate = measureComposition(size);
      if(candidate.totalHeight <= maxHeight){
        best = candidate;
        low = size + 1;
      }else{
        high = size - 1;
      }
    }

    const result = best || measureComposition(minQuote);
    result.overflow = result.totalHeight > maxHeight;
    return result;
  }


  function drawSimpleBlock(config,fitted,W,y,marginX,options={}){
    if(!fitted){ return y; }
    const arabic = options.arabic;

    ctx.save();
    ctx.fillStyle = options.secondary ? config.secondary : config.text;
    ctx.globalAlpha = options.secondary ? .96 : 1;
    ctx.shadowColor = config.type === "image" ? config.shadow : "rgba(0,0,0,0)";
    ctx.shadowBlur = config.type === "image" ? (options.secondary ? 12 : 18) : 0;
    ctx.shadowOffsetY = config.type === "image" ? 2 : 0;
    ctx.font = options.meta
      ? metaFont(fitted.size,options.weight || 400,arabic)
      : quoteFont(fitted.size,options.weight || 400,arabic);
    ctx.textBaseline = "top";
    ctx.direction = arabic ? "rtl" : "ltr";

    if(state.align === "center"){
      ctx.textAlign = "center";
    }else if(arabic){
      ctx.textAlign = "right";
    }else{
      ctx.textAlign = "left";
    }

    const x = state.align === "center"
      ? W/2
      : (arabic ? W-marginX : marginX);

    fitted.lines.forEach((line,index) => {
      if(!line.blank){
        const lineArabic = options.perLineDirection
          ? containsArabic(line.text)
          : arabic;
        if(options.perLineDirection){
          ctx.direction = lineArabic ? "rtl" : "ltr";
          ctx.textAlign = state.align === "center"
            ? "center"
            : (lineArabic ? "right" : "left");
        }
        const lineX = state.align === "center"
          ? W/2
          : (lineArabic ? W-marginX : marginX);
        ctx.fillText(line.text,lineX,y + index*fitted.lineHeight);
      }
    });
    ctx.restore();
    return y + fitted.totalHeight;
  }


  function drawWatermark(config,W,H){
    if(!watermarkInput.checked || !watermarkUnlocked){ return; }

    const text = watermarkTextInput.value.trim() || "المتوكل";
    const arabic = containsArabic(text);
    const maxWidth = W * .74;
    let size = state.ratio === "4:5" ? 114 : 104;
    const minSize = 48;

    ctx.save();
    do{
      ctx.font = metaFont(size,700,arabic);
      if(ctx.measureText(text).width <= maxWidth){ break; }
      size -= 2;
    }while(size > minSize);

    ctx.fillStyle = config.secondary;
    ctx.globalAlpha = .98;
    ctx.shadowColor = config.type === "image" ? config.shadow : "rgba(0,0,0,0)";
    ctx.shadowBlur = config.type === "image" ? 14 : 0;
    ctx.shadowOffsetY = config.type === "image" ? 3 : 0;
    ctx.font = metaFont(Math.max(size,minSize),700,arabic);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.direction = arabic ? "rtl" : "ltr";
    ctx.fillText(text,W/2,state.ratio === "4:5" ? H*.905 : H*.90,maxWidth);
    ctx.restore();
  }


  function drawTextBlock(config,W,H){
    const quote = quoteInput.value.trim() || "اكتب النص هنا";
    const attribution = authorInput.value.trim();
    const source = sourceInput.value.trim();
    const translation = translationInput.value.trim();
    const quoteArabic = containsArabic(quote);
    const attributionArabic = containsArabic(attribution);
    const marginX = W * .072;
    const maxWidth = W - marginX*2;
    const safeTop = state.ratio === "4:5" ? H*.075 : H*.065;
    const watermarkOn = watermarkInput.checked && watermarkUnlocked;
    const footerBottom = watermarkOn
      ? (state.ratio === "4:5" ? H*.835 : H*.82)
      : H*.90;

    const sourceFit = fitSource(source,maxWidth,H*.11);
    const sourceGap = sourceFit ? clamp(H*.035,72,108) : 0;
    const sourceHeight = sourceFit ? sourceFit.totalHeight : 0;
    const mainBottom = footerBottom - sourceHeight - sourceGap;

    const attributionLimit = Math.max(
      1,
      Math.min(H*.18,mainBottom-safeTop-H*.22)
    );
    const attributionFit = fitAttribution(
      attribution,maxWidth,attributionArabic,state.ratio,attributionLimit
    );
    const attributionHeight = attributionFit ? attributionFit.totalHeight : 0;

    const rawMainRoom = Math.max(120,mainBottom-safeTop-attributionHeight);
    let attributionGap = attributionFit
      ? clamp(rawMainRoom*.075,H*.032,H*.052)
      : 0;
    const contentRoom = Math.max(80,rawMainRoom-attributionGap);
    const composition = fitComposition(
      quote,translation,maxWidth,contentRoom,quoteArabic
    );

    const groupHeight = attributionHeight + attributionGap + composition.totalHeight;
    const regionHeight = Math.max(1,mainBottom-safeTop);
    const occupancy = clamp(groupHeight/regionHeight,0,1);

    /* Smoothly move the visual center upward as measured occupancy grows. */
    const lowCenter = state.ratio === "4:5" ? .505 : .485;
    const highCenter = state.ratio === "4:5" ? .405 : .385;
    const eased = occupancy*occupancy*(3-2*occupancy);
    const centerRatio = lowCenter + (highCenter-lowCenter)*eased;
    const desiredStart = H*centerRatio - groupHeight/2;
    const groupStart = clamp(desiredStart,safeTop,Math.max(safeTop,mainBottom-groupHeight));

    let y = groupStart;
    if(attributionFit){
      y = drawAttribution(
        config,attributionFit,attributionArabic,W,y,marginX
      ) + attributionGap;
    }

    y = drawMainQuote(
      config,composition.quoteFit,quoteArabic,W,y,marginX
    );

    if(composition.englishFit){
      y += composition.translationGap;
      y = drawSimpleBlock(
        config,composition.englishFit,W,y,marginX,{arabic:false}
      );
    }

    if(sourceFit){
      const earliest = y + sourceGap;
      const latest = footerBottom - sourceHeight;
      const preferred = earliest + Math.max(0,latest-earliest)*.62;
      const sourceY = clamp(preferred,earliest,Math.max(earliest,latest));
      drawSimpleBlock(
        config,sourceFit,W,sourceY,marginX,
        {arabic:sourceFit.arabic,meta:true,secondary:true,perLineDirection:true}
      );
    }

    drawWatermark(config,W,H);

    const overflow = composition.overflow ||
      (attributionFit && attributionFit.overflow) ||
      (sourceFit && sourceFit.overflow) ||
      groupHeight > regionHeight ||
      (sourceFit && y+sourceGap+sourceHeight > footerBottom);
    fitWarning.textContent = overflow
      ? "This composition is too long to fit safely at the minimum readable size. Shorten the text or remove an optional block."
      : "";
  }


  /*
    ==================================================
    RENDER
    ==================================================
  */

  let renderSequence = 0;

  async function render(){

    const sequence = ++renderSequence;

    configureCanvas();


    const W =
      canvas.width;


    const H =
      canvas.height;


    const config =
      themeConfig[
        state.theme
      ];


    ctx.clearRect(
      0,
      0,
      W,
      H
    );


    if(
      config.type === "paper"
    ){

      drawPaper(
        config,
        W,
        H
      );

    }

    else{

      try{


        const img =
          await loadImage(
            config.src
          );

        if(sequence !== renderSequence){ return; }


        drawCoverImage(
          img,
          0,
          0,
          W,
          H
        );


      }

      catch(err){

        if(sequence !== renderSequence){ return; }


        /*
          Safe fallback if the filename
          is wrong or image wasn't uploaded.
        */

        const fallback =
          ctx.createLinearGradient(
            0,
            0,
            0,
            H
          );


        fallback.addColorStop(
          0,
          "#252735"
        );


        fallback.addColorStop(
          1,
          "#111217"
        );


        ctx.fillStyle =
          fallback;


        ctx.fillRect(
          0,
          0,
          W,
          H
        );


        setStatus(
          `Add ${config.src} to use this background.`,
          2800
        );

      }


      drawImageTreatment(
        config,
        W,
        H
      );

    }


    drawTextBlock(
      config,
      W,
      H
    );

  }


  /*
    ==================================================
    BUTTON GROUPS
    ==================================================
  */

  function bindChoiceGroup(
    groupId,
    key
  ){

    document
      .getElementById(
        groupId
      )
      .addEventListener(
        "click",
        event => {


          const btn =
            event.target.closest(
              ".choice"
            );


          if(
            !btn
          ){

            return;

          }


          const value =
            btn.dataset[key];


          if(
            !value
          ){

            return;

          }


          state[key] =
            value;


          btn.parentElement
            .querySelectorAll(
              ".choice"
            )
            .forEach(
              item => {

                item.classList.remove(
                  "active"
                );

              }
            );


          btn.classList.add(
            "active"
          );


          render();

        }
      );

  }


  bindChoiceGroup(
    "themeChoices",
    "theme"
  );


  bindChoiceGroup(
    "ratioChoices",
    "ratio"
  );


  bindChoiceGroup(
    "alignChoices",
    "align"
  );


  /*
    ==================================================
    LIVE INPUT
    ==================================================
  */

  [
    quoteInput,
    authorInput,
    sourceInput,
    translationInput,
    watermarkTextInput
  ]
  .forEach(
    element => {


      element.addEventListener(
        "input",
        render
      );

    }
  );

  translationToggle.addEventListener("click",() => {
    state.translationEnabled = !state.translationEnabled;
    translationField.hidden = !state.translationEnabled;
    translationToggle.setAttribute(
      "aria-expanded",String(state.translationEnabled)
    );
    translationToggle.textContent = state.translationEnabled
      ? "− Remove English translation"
      : "+ Add English translation";
    render();
  });


  /*
    ==================================================
    PASSWORD-GATED WATERMARK
    ==================================================
  */

  watermarkInput
    .addEventListener(
      "change",
      () => {


        /*
          Turning off never needs password.
        */

        if(
          !watermarkInput.checked
        ){

          watermarkTextField.hidden = true;

          render();

          return;

        }


        /*
          Already unlocked during this
          browser session.
        */

        if(
          watermarkUnlocked
        ){

          watermarkTextField.hidden = false;

          render();

          return;

        }


        const entered =
          window.prompt(
            "Enter watermark password:"
          );


        if(
          entered
          ===
          WATERMARK_PASSWORD
        ){

          watermarkUnlocked =
            true;


          watermarkInput.checked =
            true;

          watermarkTextField.hidden =
            false;


          setStatus(
            "Private watermark unlocked.",
            1800
          );


          render();

        }

        else{


          watermarkInput.checked =
            false;

          watermarkTextField.hidden =
            true;


          if(
            entered !== null
          ){

            setStatus(
              "Incorrect password.",
              2000
            );

          }


          render();

        }

      }
    );


  /*
    ==================================================
    DOWNLOAD PNG
    ==================================================
  */

  document
    .getElementById(
      "downloadBtn"
    )
    .addEventListener(
      "click",
      async () => {


        await render();


        const link =
          document.createElement(
            "a"
          );


        const filenameBase =
          authorInput.value.trim()
          ||
          "quote";


        const safeName =
          filenameBase
            .replace(
              /[^\p{L}\p{N}_-]+/gu,
              "-"
            )
            .replace(
              /^-+|-+$/g,
              ""
            );


        link.download =
          `${
            safeName || "quote"
          }-${
            state.ratio.replace(
              ":",
              "x"
            )
          }.png`;


        link.href =
          canvas.toDataURL(
            "image/png",
            1
          );


        link.click();


        setStatus(
          "PNG downloaded."
        );

      }
    );


  /*
    ==================================================
    COPY IMAGE
    ==================================================
  */

  document
    .getElementById(
      "copyBtn"
    )
    .addEventListener(
      "click",
      async () => {


        try{


          await render();


          const blob =
            await new Promise(
              resolve => {


                canvas.toBlob(
                  resolve,
                  "image/png",
                  1
                );

              }
            );


          if(
            !navigator.clipboard
            ||
            !window.ClipboardItem
          ){

            throw new Error(
              "Clipboard images are not supported."
            );

          }


          await navigator.clipboard.write(
            [

              new ClipboardItem(
                {
                  "image/png":
                    blob
                }
              )

            ]
          );


          setStatus(
            "Image copied."
          );


        }

        catch(err){


          setStatus(
            "Copy Image is not supported here — use Download PNG instead.",
            3000
          );

        }

      }
    );


  /*
    ==================================================
    START / FONT LOADING
    ==================================================

    Canvas must wait for the actual fonts
    before measuring text.
  */

  async function start(){

    if(
      document.fonts
      &&
      document.fonts.ready
    ){

      await document.fonts.ready;

    }


    if(
      document.fonts
      &&
      document.fonts.load
    ){

      try{


        await Promise.all(
          [

            /*
              AMIRI
            */

            document.fonts.load(
              '400 210px "Amiri"'
            ),

            document.fonts.load(
              '700 124px "Amiri"'
            ),


            /*
              AREF RUQAA
            */

            document.fonts.load(
              '400 78px "Aref Ruqaa"'
            ),

            document.fonts.load(
              '700 114px "Aref Ruqaa"'
            )

          ]
        );


      }

      catch(err){

        /*
          Continue even if explicit
          font loading is unsupported.
        */

      }

    }


    render();

  }


  start();


})();

</script>
