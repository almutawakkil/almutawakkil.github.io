  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;

    }

    body {
      font-family: "Amiri", Georgia, serif;
      background: #f6f5f0;
      color: #1a1a18;
      line-height: 1.7;
    }

    .wrap {
      width: 100%;
      max-width: 900px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 42px 20px 32px;

      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    header {
      width: 100%;
      max-width: 780px;
      margin: 0 auto 28px;
      direction: ltr;
    }

    .top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }

    .arabic {
      font-family: "Amiri", Georgia, serif;
      font-size: 36px;
      line-height: 1.1;
      margin: 0;
      font-weight: 400;
    }

    .subtitle {
      margin: 5px 0 0;
      color: #6e6d67;
      font-size: 16px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 18px;
      padding-bottom: 4px;
    }

      font-family: "Amiri", Georgia, serif;
      color: #6e6d67;
      text-decoration: none;
      font-size: 16px;
    }

    nav a:hover,
    nav a.active {

    }

    /* READER */

    .reader {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
    }

    .dhikr-card {
      width: 100%;
      min-height: 430px;

      background: #fff;
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 18px;

      padding: 46px 42px 34px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .dhikr-text {
      width: 100%;
      max-width: 760px;
      margin: auto 0;

      font-size: clamp(31px, 5vw, 44px);
      line-height: 2;
      font-weight: 400;

      direction: rtl;
      text-align: center;
      white-space: pre-line;
    }

    .dhikr-text.medium {
      font-size: clamp(27px, 4.4vw, 38px);
      line-height: 1.9;
    }

    .dhikr-text.long {
      font-size: clamp(23px, 3.8vw, 32px);
      line-height: 1.85;
    }

    .dhikr-text.very-long {
      font-size: clamp(19px, 3vw, 27px);
      line-height: 1.75;
    }

    /* COUNTER */

    .counter {
      display: none;
      margin-top: 18px;

      font-family: "Amiri", Georgia, serif;
      font-size: 21px;
      line-height: 1.2;
      font-weight: 400;

      color: #8b8982;
      direction: ltr;
      text-align: center;

      user-select: none;
      -webkit-user-select: none;
    }

    .counter.complete {
      color: #27500a;
    }

    .dhikr-card.countable {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* ARROWS AND SOURCE */

    .controls {
      width: 100%;
      max-width: 260px;
      margin-top: 34px;

      display: flex;
      direction: ltr;
      align-items: center;
      justify-content: space-between;
    }

    .arrow {
      font-family: "Amiri", Georgia, serif;
      appearance: none;
      border: none;
      background: transparent;
      color: #77756e;

      font-size: 34px;
      line-height: 1;

      padding: 10px 16px;
      cursor: pointer;
      border-radius: 10px;
    }

    .arrow:hover {
      color: #27500a;
      background: rgba(0,0,0,.035);
    }

    .arrow:disabled {
      opacity: .22;
      cursor: default;
      background: transparent;
    }

    .source-marker {
      font-family: "Amiri", Georgia, serif;
      font-size: 16px;
      font-weight: 400;
      color: #9a9891;
      direction: rtl;
      unicode-bidi: isolate;
      text-align: center;
      min-width: 40px;
    }

    /* MOBILE */

    @media (max-width: 600px) {
      .wrap {
        padding: 28px 14px 18px;
      }

      header {
        max-width: none;
        margin-bottom: 18px;
      }

      .top {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .arabic {
        font-size: 32px;
      }

      nav {
        gap: 14px;
      }

      nav a {
        font-size: 15px;
      }

      .dhikr-card {
        min-height: calc(100vh - 190px);
        border-radius: 14px;
        padding: 28px 20px 22px;
      }

      .dhikr-text {
        font-size: clamp(29px, 8.5vw, 38px);
        line-height: 1.95;
      }

      .dhikr-text.medium {
        font-size: clamp(25px, 7.3vw, 33px);
      }

      .dhikr-text.long {
        font-size: clamp(21px, 6vw, 28px);
      }

      .dhikr-text.very-long {
        font-size: clamp(17px, 4.7vw, 23px);
      }

      .counter {
        font-size: 19px;
        margin-top: 14px;
      }

      .source-marker {
        font-size: 15px;
      }
    }

    /* DARK MODE */

    @media (prefers-color-scheme: dark) {
      body {
        background: #1b1a18;
        color: #f2efe8;
      }

      .dhikr-card {
        background: #22211f;
        border-color: rgba(255,255,255,.08);
      }

      .subtitle,
      nav a,
      .arrow,
      .source-marker,
      .counter {
        color: #9b9890;
      }

      nav a:hover,
      nav a.active,
      .arrow:hover,
      .counter.complete {
        color: #b8d98d;
      }

      .arrow:hover {
        background: rgba(255,255,255,.04);
      }
    }

  <script>

const adhkar = [

  `اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْمًا كَثِيرًا، وَلَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدِكَ، وَارْحَمْنِي إِنَّك أَنْتَ الْغَفُورُ الرَّحِيمُ`,

  `اللَّهُمَّ لَكَ الْحَمْدُ، أَنْتَ قَيِّمُ السَّمَاوَاتِ وَالْأَرْضِ وَمَنْ فِيهِنَّ، وَلَكَ الْحَمْدُ، لَكَ مُلْكُ السَّمَاوَاتِ وَالْأرضِ وَمَنْ فِيهِنَّ، وَلَكَ الْحَمْدُ، نُورُ السَّمَاوَاتِ وَالْأَرْضِ، وَلَكَ الْحَمْدُ

أَنْتَ الْحَقُّ، وَوَعْدُكَ الْحَقُّ، وَلِقَاؤُكَ حَقٌّ، وَقَوْلُكَ حَقٌّ، وَالْجَنَّةُ حَقٌّ، وَالنَّارُ حَقٌّ، وَالنَّبِيُّونَ حَقٌّ، وَمُحَمَّدٌ ﷺ حَقٌّ، وَالسَّاعَةُ حَقٌّ

اللَّهُمَّ لَكَ أَسْلَمْتُ، وَبِكَ آمَنْتُ، وَعَلَيْكَ تَوَكَّلْتُ، وَإِلَيْكَ أَنَبْتُ، وَبِكَ خَاصَمْتُ، وَإِلَيْكَ حَاكَمْتُ، فَاغْفِرْ لِي مَا قَدَّمْتُ وَمَا أَخَّرْتُ، وَمَا أَسْرَرْتُ وَمَا أَعْلَنْتُ، أَنْتَ الْمُقَدِّمُ وَأَنْتَ الْمُؤَخِّرُ، لَا إِلَهَ إِلَّا أَنْتَ`,

  `لَا إِلَهَ إِلَّا اللهُ الْعَظِيمُ الْحَلِيمُ، لَا إِلَهَ إِلَّا اللهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لَا إِلَهَ إِلَّا اللهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ`,

  `اللَّهُمَّ الرَّفِيقَ الْأَعْلَى`,

  `اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكَسَلِ وَالْهَرَمِ، وَالْمَأْثَمِ وَالْمَغْرَمِ، وَمِنْ فِتْنَةِ الْقَبْرِ وَعَذَابِ الْقَبْرِ، وَمِنْ فِتْنَةِ النَّارِ وَعَذَابِ النَّارِ، وَمِنْ شَرِّ فِتْنَةِ الْغِنَى، وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الْفَقْرِ، وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ

اللَّهُمَّ اغْسِلْ عَنِّي خَطَايَايَ بِمَاءِ الثَّلْجِ وَالْبَرَدِ، وَنَقِّ قَلْبِي مِنَ الْخَطَايَا كَمَا نَقَّيْتَ الثَّوْبَ الْأَبْيَضَ مِنَ الدَّنَسِ، وَبَاعِدْ بَيْنِي وَبَيْنَ خَطَايَايَ كَمَا بَاعَدْتَ بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ`,

  `اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْجُبْنِ وَالْبُخْلِ، وَضَلَعِ الدَّيْنِ، وَغَلَبَةِ الرِّجَالِ`,

  `اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْبُخْلِ، وَأَعُوذُ بِكَ مِنَ الْجُبْنِ، وَأَعُوذُ بِكَ أَنْ نُرَدَّ إِلَى أَرْذَلِ الْعُمُرِ، وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الدُّنْيَا وَعَذَابِ الْقَبْرِ`,

  `اللَّهُمَّ اغْفِرْ لِي خَطِيئَتِي وَجَهْلِي، وَإِسْرَافِي فِي أَمْرِي، وَمَا أَنْتَ أَعْلَمُ بِهِ مِنِّي

اللَّهُمَّ اغْفِرْ لِي هَزْلِي وَجِدِّي، وَخَطَايَ وَعَمْدِي، وَكُلُّ ذَلِكَ عِنْدِي`,

  `لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ المُلْكُ وَلَهُ الحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ`,

  `لا حول ولا قوة إلا بالله`,

  `رَبِّ اغْفِرْ لِي خَطِيئَتِي يَوْمَ الدِّينِ`,

  `اللَّهُمَّ اغْفِرْ لِي ذَنْبِي كُلَّهُ: دِقَّهُ وَجِلَّهُ، وَأَوَّلَهُ وَآخِرَهُ، وَعَلَانِيَتَهُ وَسِرَّهُ`,

  `اللَّهُمَّ إني أَعُوذُ بِرِضَاكَ مِنْ سَخَطِكَ، وَبِمُعَافَاتِكَ مِنْ عُقُوبَتِكَ، وَأَعُوذُ بِكَ مِنْكَ، لَا أُحْصِي ثَنَاءً عَلَيْكَ، أَنْتَ كَمَا أَثْنَيْتَ عَلَى نَفْسِكَ`,

  `اللَّهُمَّ رَبَّ جَبْرَائِيلَ وَمِيكَائِيلَ وَإِسْرَافِيلَ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، أَنْتَ تَحْكُمُ بَيْنَ عِبَادِكَ فِيمَا كَانُوا فِيهِ يَخْتَلِفُونَ

اهْدِنِي لِمَا اخْتُلِفَ فِيهِ مِنَ الْحَقِّ بِإِذْنِكَ، إِنَّكَ تَهْدِي مَنْ تَشَاءُ إِلَى صِرَاطٍ مُسْتَقِيمٍ`,

  `اللَّهُمَّ أَنْتَ الْمَلِكُ، لَا إِلَهَ إِلَّا أَنْتَ أَنْتَ رَبِّي وَأَنَا عَبْدُكَ، ظَلَمْتُ نَفْسِي وَاعْتَرَفْتُ بِذَنْبِي فَاغْفِرْ لِي ذُنُوبِي جَمِيعًا إِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ

وَاهْدِنِي لِأَحْسَنِ الْأَخْلَاقِ لَا يَهْدِي لِأَحْسَنِهَا إِلَّا أَنْتَ، وَاصْرِفْ عَنِّي سَيِّئَهَا لَا يَصْرِفُ عَنِّي سَيِّئَهَا إِلَّا أَنْتَ

لَبَّيْكَ وَسَعْدَيْكَ وَالْخَيْرُ كُلُّهُ فِي يَدَيْكَ، وَالشَّرُّ لَيْسَ إِلَيْكَ

أَنَا بِكَ وَإِلَيْكَ، تَبَارَكْتَ وَتَعَالَيْتَ، أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ`,

  `اللَّهُمَّ مُصَرِّفَ الْقُلُوبِ صَرِّفْ قُلُوبَنَا عَلَى طَاعَتِكَ`,

  `اللَّهُمَّ اغْفِرْ لِي، وَارْحَمْنِي، وَاهْدِنِي، وَعَافِنِي، وَارْزُقْنِي`,

  `اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ مَا عَمِلْتُ وَمِنْ شَرِّ مَا لَمْ أَعْمَلْ`,

  `اللَّهُمَّ لَكَ أَسْلَمْتُ، وَبِكَ آمَنْتُ، وَعَلَيْكَ تَوَكَّلْتُ، وَإِلَيْكَ أَنَبْتُ، وَبِكَ خَاصَمْتُ

اللَّهُمَّ إِنِّي أَعُوذُ بِعِزَّتِكَ لَا إِلَهَ إِلَّا أَنْتَ أَنْ تُضِلَّنِي، أَنْتَ الْحَيُّ الَّذِي لَا يَمُوتُ، وَالْجِنُّ وَالْإِنْسُ يَمُوتُونَ`,

  `اللَّهُمَّ أَصْلِحْ لِي دِينِي الَّذِي هُوَ عِصْمَةُ أَمْرِي، وَأَصْلِحْ لِي دُنْيَايَ الَّتِي فِيهَا مَعَاشِي، وَأَصْلِحْ لِي آخِرَتِي الَّتِي فِيهَا مَعَادِي

وَاجْعَلْ الْحَيَاةَ زِيَادَةً لِي فِي كُلِّ خَيْرٍ وَاجْعَلْ الْمَوْتَ رَاحَةً لِي مِنْ كُلِّ شَرٍّ`,

  `اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى`,

  `اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ، وَالْجُبْنِ، وَالْبُخْلِ، وَالْهَرَمِ، وَعَذَابِ الْقَبْرِ

اللَّهُمَّ آتِ نَفْسِي تَقْوَاهَا، وَزَكِّهَا أَنْتَ خَيْرُ مَنْ زَكَّاهَا، أَنْتَ وَلِيُّهَا وَمَوْلَاهَا

اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عِلْمٍ لَا يَنْفَعُ، وَمِنْ قَلْبٍ لَا يَخْشَعُ، وَمِنْ نَفْسٍ لَا تَشْبَعُ، وَمِنْ دَعْوَةٍ لَا يُسْتَجَابُ لَهَا`,

  `اللَّهُمَّ اهْدِنِي وَسَدِّدْنِي`,

  `اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالسَّدَادَ`,

  `اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ زَوَالِ نِعْمَتِكَ، وَتَحَوُّلِ عَافِيَتِكَ، وَفُجَاءَةِ نِقْمَتِكَ، وَجَمِيعِ سَخَطِكَ`,
  
  `اللَّهُمَّ إنِّي أسألُكَ فِعْلَ الخَيْرَاتِ، وتَرْكَ المُنْكَرَاتِ، وحُبَّ المساكينِ، وأنْ تَغفِرَ لي وتَرحَمَنِي

وإذا أرَدْتَ فِتْنةً في قَومٍ فتَوفَّني غيرَ مَفْتُونٍ، وأسألُكَ حُبَّكَ وحُبَّ من يُحِبُّكَ، وحُبَّ عَمَلٍ يُقَرِّبُ إلى حُبِّكَ`,

  `اللهُمَّ إنَّكَ عَفوٌّ تُحبُّ العَفْوَ فاعْفُ عَنِّي`,

  `رَبَّ أعِنَّي وَلا تُعِنْ عَليَّ، وَانْصُرني وَلا تَنْصُرْ عَليَّ، وَامكُرْ لِي وَلَا تَمْكُرْ عَليَّ، وَاهْدني وَيَسَّرِ الْهُدَى لِي، وَانْصُرْني على من بَغَى عَليَّ

رَبِّ اجْعَلْني لَكَ شَكَّارًا، لَكَ ذَكَّارًا، لَكَ رَهَّابًا، لَكَ مِطْواعًا، لَكَ مخْبِتًا، إلَيْكَ أوَّاهًا مُنِيبًا

رَبَّ تَقبَّلَ تَوْبَتي، وَاغْسِلْ حَوْبَتي، وَأَجِبْ دَعْوَتي، وَثَبَّتْ حُجَّتي، وَسَدِّدْ لِساني، وَاهْدِ قَلْبي، وَاسْلُلْ سَخِيمةَ صَدْرِي`,

  `اللهُمَّ بِعِلْمِكَ الْغَيْبَ، وَقُدْرَتِكَ عَلَى الْخَلْقِ، أَحْيِنِي مَا عَلِمْتَ الْحَيَاةَ خَيْرًا لِي، وَتَوَفَّنِي إِذَا كَانَتِ الْوَفَاةُ خَيْرًا لِي

أَسْأَلُكَ خَشْيَتَكَ فِي الْغَيْبِ وَالشَّهَادَةِ، وَكَلِمَةَ الْحَقِّ فِي الْغَضَبِ وَالرِّضَا، وَالْقَصْدَ فِي الْفَقْرِ وَالْغِنَى

وَلَذَّةَ النَّظَرِ إِلَى وَجْهِكَ، وَالشَّوْقَ إِلَى لِقَائِكَ، وَأَعُوذُ بِكَ مِنْ ضَرَّاءَ مُضِرَّةٍ، وَمِنْ فِتْنَةٍ مُضِلَّةٍ

اللهُمَّ زَيِّنَّا بِزِينَةِ الْإِيمَانِ، وَاجْعَلْنَا هُدَاةً مَهْدِيِّينَ`,

  `اللهُم إِنِّي أَسألُك مِن الخَير كُله عَاجِله وآجِله مَا عَلمتُ مِنه ومَا لَم أَعلم، وأَعوذُ بِك مِن الشَرِ كُلهِ عَاجِله وآجِله مَا عَلمتُ مِنه ومَا لَم أَعلم

وأَسألُك الجَنةَ ومَا قَربَ إِليها مِن قَولٍ أَو عَملٍ، وأَعوذُ بِك مِن النَّار ومَا قَربَ إِليها مِن قَول أَوْ عَملٍ

وأَسألُك مِمَا سَألَك بِه مُحمدٌ، وأَعوذُ بِك مِمَا تَعوذَ مِنه مُحمدٌ، ومَا قَضيتَ لِي مِن قَضاءٍ فَاجعل عَاقِبتَه رَشداً`

];


const sources = [

  `خ`,
  `خ`,
  `خ`,
  `خ`,
  `خ`,
  `خ`,
  `خ`,
  `خ`,
  `خ`,
  `خ`,
  `م`,
  `م`,
  `م`,
  `م`,
  `م`,
  `م`,
  `م`,
  `م`,
  `م`,
  `م`,
  `م`,
  `م`,
  `م`,
  `م`,
  `م`,
  `ت`,
  `ت`,
  `ت`,
  `حم س`,
  `بخ`

];


    /*
      Only the 100-or-more dhikr has a counter.

      Array indexes begin at 0:
      8 = لا إله إلا الله وحده لا شريك له...
    */

    const countTargets = {
      8: 100
    };


    /*
      This card may continue beyond 100.
      Reaching 100 marks the target as complete,
      but counting remains available afterward.
    */

    const unlimitedCounters = {
      8: true
    };


    /*
      The count is remembered only while this page remains open.
      Nothing is saved to localStorage.
    */

    const counts = {
      8: 0
    };


    let currentIndex = 0;
    let touchStartX = 0;
    let touchEndX = 0;
    let swipeJustOccurred = false;


    const dhikrCard =
      document.getElementById("dhikrCard");

    const dhikrText =
      document.getElementById("dhikrText");

    const counter =
      document.getElementById("counter");

    const sourceMarker =
      document.getElementById("sourceMarker");

    const previousButton =
      document.getElementById("previousButton");

    const nextButton =
      document.getElementById("nextButton");


    function isCountable() {

      return Object.prototype.hasOwnProperty.call(
        countTargets,
        currentIndex
      );

    }


    function renderCounter() {

      if (!isCountable()) {

        counter.style.display = "none";
        counter.textContent = "";
        counter.classList.remove("complete");
        dhikrCard.classList.remove("countable");

        return;

      }


      const currentCount =
        counts[currentIndex];

      const target =
        countTargets[currentIndex];


      counter.style.display = "block";
      dhikrCard.classList.add("countable");


      if (currentCount >= target) {

        counter.textContent =
          currentCount + " / " + target + "+ ✓";

        counter.classList.add("complete");

      }

      else {

        counter.textContent =
          currentCount + " / " + target + "+";

        counter.classList.remove("complete");

      }

    }


    function renderDhikr() {

      const text =
        adhkar[currentIndex];


      dhikrText.textContent = text;


      sourceMarker.textContent =
        sources[currentIndex];


      dhikrText.className = "dhikr-text";


      if (text.length > 500) {

        dhikrText.classList.add("very-long");

      }

      else if (text.length > 200) {

        dhikrText.classList.add("long");

      }

      else if (text.length > 130) {

        dhikrText.classList.add("medium");

      }


      renderCounter();


      previousButton.disabled =
        currentIndex === 0;

      nextButton.disabled =
        currentIndex === adhkar.length - 1;


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /*
      Tap the card to increase the counter.

      Navigation controls never add a count.
      A swipe also will not accidentally add a count.

      Because this particular dhikr is 100 or more,
      the counter continues after reaching 100.
    */

    dhikrCard.addEventListener(
      "click",
      function (event) {

        if (
          swipeJustOccurred ||
          event.target.closest(".controls") ||
          !isCountable()
        ) {
          return;
        }


        const target =
          countTargets[currentIndex];

        const isUnlimited =
          unlimitedCounters[currentIndex] === true;


        if (
          isUnlimited ||
          counts[currentIndex] < target
        ) {

          counts[currentIndex]++;

          renderCounter();

        }

      }
    );


    previousButton.addEventListener(
      "click",
      function () {

        if (currentIndex > 0) {

          currentIndex--;

          renderDhikr();

        }

      }
    );


    nextButton.addEventListener(
      "click",
      function () {

        if (currentIndex < adhkar.length - 1) {

          currentIndex++;

          renderDhikr();

        }

      }
    );


    document.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key === "ArrowLeft" &&
          currentIndex > 0
        ) {

          currentIndex--;

          renderDhikr();

        }


        if (
          event.key === "ArrowRight" &&
          currentIndex < adhkar.length - 1
        ) {

          currentIndex++;

          renderDhikr();

        }

      }
    );


    document.addEventListener(
      "touchstart",
      function (event) {

        touchStartX =
          event.changedTouches[0].screenX;

        swipeJustOccurred = false;

      },
      { passive: true }
    );


    document.addEventListener(
      "touchend",
      function (event) {

        touchEndX =
          event.changedTouches[0].screenX;


        const difference =
          touchEndX - touchStartX;


        if (Math.abs(difference) < 60) {

          return;

        }


        swipeJustOccurred = true;


        if (
          difference < 0 &&
          currentIndex < adhkar.length - 1
        ) {

          currentIndex++;

          renderDhikr();

        }


        if (
          difference > 0 &&
          currentIndex > 0
        ) {

          currentIndex--;

          renderDhikr();

        }


        setTimeout(
          function () {

            swipeJustOccurred = false;

          },
          300
        );

      },
      { passive: true }
    );


    renderDhikr();

  </script>
