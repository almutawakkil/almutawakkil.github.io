<!doctype html>
<html lang="ar" dir="rtl">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{font-family:"Amiri",serif;color:#172c25;background:#edf2ef}*{box-sizing:border-box}body{margin:0}.print-toolbar{position:sticky;top:0;z-index:2;display:flex;justify-content:center;align-items:center;gap:12px;padding:10px;background:#173f34;color:#fff}.print-toolbar button{font:700 17px "Amiri",serif;border:0;border-radius:8px;background:#fff;color:#173f34;padding:7px 18px;cursor:pointer}.print-toolbar span{font-size:14px}.report{width:210mm;min-height:297mm;margin:18px auto;background:#fff;padding:18mm 17mm;box-shadow:0 8px 35px #18392f22}.cover{text-align:center}.cover h1{font-size:30px;line-height:1.35;margin:0 0 10px;color:#173f34}.matn{font-size:20px;line-height:2;text-align:justify;margin:16px auto;max-width:165mm;padding:12px 16px;border-block:1px solid #d8c693}.attribution{font-size:16px;color:#5b6e66;margin:8px 0}.section-title{font-size:23px;color:#173f34;border-bottom:2px solid #d8c693;padding-bottom:5px;margin:0 0 12px}.diagram-page{page:diagram;break-before:page;break-after:page;width:100%;min-height:155mm;display:flex;flex-direction:column;justify-content:center}.diagram-frame{width:100%;display:flex;align-items:center;justify-content:center}.diagram-frame svg{display:block;width:100%;height:auto;max-height:165mm}.chains-page,.notes-page{break-before:page}.chains{margin:0;padding:0 28px 0 0}.chain-entry{break-inside:avoid;margin:0 0 13px;padding:0 0 10px;border-bottom:1px solid #e3e9e5}.chain-path{font-size:17px;line-height:1.9}.source{color:#53675f;font-size:14px;line-height:1.7;margin-top:2px}.notes-list{padding-right:25px}.notes-list li{break-inside:avoid;margin-bottom:9px;line-height:1.8}.research-notes{break-inside:avoid;margin-top:18px;padding:12px 14px;background:#f5f8f6;border-right:3px solid #417c66;white-space:pre-wrap;line-height:1.9}.empty{color:#697a73;text-align:center}.report-footer{margin-top:18mm;padding-top:5px;border-top:1px solid #dfe6e2;color:#76857f;text-align:center;font-size:11px}.error{color:#8b2e35;text-align:center;padding:40px;font-size:20px}@page{size:A4 portrait;margin:14mm}@page diagram{size:A4 landscape;margin:12mm}@media print{body{background:#fff}.print-toolbar{display:none}.report{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}.cover{break-inside:avoid}.diagram-page{min-height:0}.report-footer{position:fixed;bottom:-8mm;left:0;right:0}}
    @media print{html,body{background:#fff!important}.report{background:#fff}.chains-page,.notes-page{background:#fff}.notes-page::before{content:"";display:block;height:12mm}.report-footer{position:static}}
    @media(max-width:850px){.report{width:calc(100% - 20px);padding:24px 18px}.print-toolbar{flex-wrap:wrap}.diagram-page{min-height:auto}}
  </style>
</head>
