<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>أذكار المساء · Al-Mutawakkil</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap"
    rel="stylesheet"
  />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Amiri", Georgia, serif;
      background: #f6f5f0;
      color: #1a1a18;
      line-height: 1.7;
    }

    .wrap {
      width: 100%;
      max-width: 900px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 42px 20px 32px;

      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    header {
      width: 100%;
      max-width: 780px;
      margin: 0 auto 28px;
      direction: ltr;
    }

    .top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }

    .arabic {
      font-family: "Amiri", Georgia, serif;
      font-size: 36px;
      line-height: 1.1;
      margin: 0;
      font-weight: 400;
    }

    .subtitle {
      margin: 5px 0 0;
      color: #6e6d67;
      font-size: 16px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 18px;
      padding-bottom: 4px;
    }

    nav a {
      font-family: "Amiri", Georgia, serif;
      color: #6e6d67;
      text-decoration: none;
      font-size: 16px;
    }

    nav a:hover,
    nav a.active {
      color: #27500a;
    }

    /* READER */

    .reader {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
    }

    .dhikr-card {
      width: 100%;
      min-height: 430px;

      background: #fff;
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 18px;

      padding: 46px 42px 34px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .dhikr-text {
      width: 100%;
      max-width: 760px;
      margin: auto 0;

      font-size: clamp(31px, 5vw, 44px);
      line-height: 2;
      font-weight: 400;

      direction: rtl;
      text-align: center;
      white-space: pre-line;
    }

    .dhikr-text.medium {
      font-size: clamp(27px, 4.4vw, 38px);
      line-height: 1.9;
    }

    .dhikr-text.long {
      font-size: clamp(23px, 3.8vw, 32px);
      line-height: 1.85;
    }

    .dhikr-text.very-long {
      font-size: clamp(19px, 3vw, 27px);
      line-height: 1.75;
    }

    /* COUNTER */

    .counter {
      display: none;
      margin-top: 18px;

      font-family: "Amiri", Georgia, serif;
      font-size: 21px;
      line-height: 1.2;
      font-weight: 400;

      color: #8b8982;
      direction: ltr;
      text-align: center;

      user-select: none;
      -webkit-user-select: none;
    }

    .counter.complete {
      color: #27500a;
    }

    .dhikr-card.countable {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* ARROWS AND SOURCE */

    .controls {
      width: 100%;
      max-width: 260px;
      margin-top: 34px;

      display: flex;
      direction: ltr;
      align-items: center;
      justify-content: space-between;
    }

    .arrow {
      font-family: "Amiri", Georgia, serif;
      appearance: none;
      border: none;
      background: transparent;
      color: #77756e;

      font-size: 34px;
      line-height: 1;

      padding: 10px 16px;
      cursor: pointer;
      border-radius: 10px;
    }

    .arrow:hover {
      color: #27500a;
      background: rgba(0,0,0,.035);
    }

    .arrow:disabled {
      opacity: .22;
      cursor: default;
      background: transparent;
    }

    .source-marker {
      font-family: "Amiri", Georgia, serif;
      font-size: 16px;
      font-weight: 400;
      color: #9a9891;
      direction: rtl;
      unicode-bidi: isolate;
      text-align: center;
      min-width: 40px;
    }

    /* MOBILE */

    @media (max-width: 600px) {
      .wrap {
        padding: 28px 14px 18px;
      }

      header {
        max-width: none;
        margin-bottom: 18px;
      }

      .top {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .arabic {
        font-size: 32px;
      }

      nav {
        gap: 14px;
      }

      nav a {
        font-size: 15px;
      }

      .dhikr-card {
        min-height: calc(100vh - 190px);
        border-radius: 14px;
        padding: 28px 20px 22px;
      }

      .dhikr-text {
        font-size: clamp(29px, 8.5vw, 38px);
        line-height: 1.95;
      }

      .dhikr-text.medium {
        font-size: clamp(25px, 7.3vw, 33px);
      }

      .dhikr-text.long {
        font-size: clamp(21px, 6vw, 28px);
      }

      .dhikr-text.very-long {
        font-size: clamp(17px, 4.7vw, 23px);
      }

      .counter {
        font-size: 19px;
        margin-top: 14px;
      }

      .source-marker {
        font-size: 15px;
      }
    }

    /* DARK MODE */

    @media (prefers-color-scheme: dark) {
      body {
        background: #1b1a18;
        color: #f2efe8;
      }

      .dhikr-card {
        background: #22211f;
        border-color: rgba(255,255,255,.08);
      }

      .subtitle,
      nav a,
      .arrow,
      .source-marker,
      .counter {
        color: #9b9890;
      }

      nav a:hover,
      nav a.active,
      .arrow:hover,
      .counter.complete {
        color: #b8d98d;
      }

      .arrow:hover {
        background: rgba(255,255,255,.04);
      }
    }
  </style>
</head>

<body>

  <main class="wrap">

    <header>
      <div class="top">

        <div>
          <h1 class="arabic">المتوكل</h1>
          <p class="subtitle">Islamic Library</p>
        </div>

        <nav>
          <a href="index.html">Translated Works</a>
          <a href="excerpts.html">Classical Excerpts</a>
          <a href="40.html" lang="ar" dir="rtl">الأربعون للمتوكل</a>
          <a href="adhkar.html" class="active" lang="ar" dir="rtl">الأذكار</a>
          <a href="night.html">Night Calculator</a>
        </nav>

      </div>
    </header>


    <section class="reader">

      <div
        id="dhikrCard"
        class="dhikr-card">

        <div
          id="dhikrText"
          class="dhikr-text">
        </div>

        <div
          id="counter"
          class="counter">
        </div>

        <div class="controls">

          <button
            id="previousButton"
            class="arrow"
            type="button"
            aria-label="Previous">
            ←
          </button>

          <span
            id="sourceMarker"
            class="source-marker">
          </span>

          <button
            id="nextButton"
            class="arrow"
            type="button"
            aria-label="Next">
            →
          </button>

        </div>

      </div>

    </section>

  </main>


  <script>

    const adhkar = [

      `﴿قُلْ هُوَ ٱللَّهُ أَحَدٌ﴾ وَالمُعَوِّذَتَيْنِ`,

      `أعُوذُ بِكلماتِ اللهِ التَّامَّاتِ من شَرَّ مَا خَلقَ`,

      `بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الأَرْضِ وَلَا فِي السَّمَاءِ، وَهُوَ السَّمِيعُ العَلِيمُ`,

      `أَمْسَيْنَا عَلَى فِطْرَةِ الإِسْلَامِ، وَعَلَى كَلِمَةِ الإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفاً مُسْلِماً، وَمَا كَانَ مِنَ المُشْرِكِينَ`,

      `رَضِيتُ بِاللَّهِ رَبّاً، وَبِالإِسْلَامِ دِيناً، وَبِمُحَمَّدٍ ﷺ نَبِيّاً`,

      `اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ المَصِيرُ`,

      `أَمْسَيْنَا وَأَمْسَى المُلْكُ لِلَّهِ، وَالحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ المُلْكُ، وَلَهُ الحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ

رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذِهِ اللَّيْلَةِ، وَخَيْرَ مَا بَعْدَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذِهِ اللَّيْلَةِ، وَشَرِّ مَا بَعْدَهَا

رَبِّ أَعُوذُ بِكَ مِنَ الكَسَلِ وَسُوءِ الكِبَرِ

رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي القَبْرِ`,

      `اللَّهُمَّ عَالِمَ الغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَوَاتِ وَالأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ ألَّا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ`,

      `اللَّهُمَّ إِنِّي أَسْأَلُكَ العَافِيَةَ فِي الدُّنْيَا وَالآخِرَةِ

اللَّهُمَّ إِنِّي أَسْأَلُكَ العَفْوَ وَالعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي

اللَّهُمَّ اسْتُرْ عَوْرَاتِي، وَآمِنْ رَوْعَاتِي

اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ، وَمِنْ خَلْفِي، وَعَنْ يَمِينِي، وَعَنْ شِمَالِي، وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي`,

      `اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ

أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ لَكَ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ`,

      `سُبْحَانَ اللَّهِ وَبِحَمْدِهِ`

    ];


    const sources = [

      `س`,
      `حم`,
      `ت`,
      `حم`,
      `حم`,
      `بخ`,
      `م`,
      `ت`,
      `حم`,
      `خ`,
      `م`

    ];


    /*
      Every dhikr on this page with a repetition count
      now has a counter.

      Array indexes begin at 0:

      0 = قل هو الله أحد والمعوذتين — 3
      1 = أعوذ بكلمات الله التامات... — 3
      2 = بسم الله الذي لا يضر... — 3
      4 = رضيت بالله رباً... — 3
      10 = سبحان الله وبحمده — 100
    */

    const countTargets = {
      0: 3,
      1: 3,
      2: 3,
      4: 3,
      10: 100
    };


    /*
      Each counter is remembered separately
      while this page remains open.

      Nothing is saved to localStorage.
    */

    const counts = {
      0: 0,
      1: 0,
      2: 0,
      4: 0,
      10: 0
    };


    let currentIndex = 0;
    let touchStartX = 0;
    let touchEndX = 0;
    let swipeJustOccurred = false;


    const dhikrCard =
      document.getElementById("dhikrCard");

    const dhikrText =
      document.getElementById("dhikrText");

    const counter =
      document.getElementById("counter");

    const sourceMarker =
      document.getElementById("sourceMarker");

    const previousButton =
      document.getElementById("previousButton");

    const nextButton =
      document.getElementById("nextButton");


    function isCountable() {

      return Object.prototype.hasOwnProperty.call(
        countTargets,
        currentIndex
      );

    }


    function renderCounter() {

      if (!isCountable()) {

        counter.style.display = "none";
        counter.textContent = "";
        counter.classList.remove("complete");
        dhikrCard.classList.remove("countable");

        return;

      }


      const currentCount =
        counts[currentIndex];

      const target =
        countTargets[currentIndex];


      counter.style.display = "block";
      dhikrCard.classList.add("countable");


      if (currentCount >= target) {

        counter.textContent =
          currentCount + " / " + target + " ✓";

        counter.classList.add("complete");

      }

      else {

        counter.textContent =
          currentCount + " / " + target;

        counter.classList.remove("complete");

      }

    }


    function renderDhikr() {

      const text =
        adhkar[currentIndex];


      dhikrText.textContent = text;


      sourceMarker.textContent =
        sources[currentIndex];


      dhikrText.className =
        "dhikr-text";


      if (text.length > 500) {

        dhikrText.classList.add(
          "very-long"
        );

      }

      else if (text.length > 200) {

        dhikrText.classList.add(
          "long"
        );

      }

      else if (text.length > 130) {

        dhikrText.classList.add(
          "medium"
        );

      }


      renderCounter();


      previousButton.disabled =
        currentIndex === 0;

      nextButton.disabled =
        currentIndex === adhkar.length - 1;


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /*
      Tap or click the card to increase the counter.

      Navigation controls never add a count.

      Swiping also does not accidentally add a count.
    */

    dhikrCard.addEventListener(
      "click",
      function (event) {

        if (
          swipeJustOccurred ||
          event.target.closest(".controls") ||
          !isCountable()
        ) {
          return;
        }


        const target =
          countTargets[currentIndex];


        if (
          counts[currentIndex] < target
        ) {

          counts[currentIndex]++;

          renderCounter();

        }

      }
    );


    previousButton.addEventListener(
      "click",
      function () {

        if (currentIndex > 0) {

          currentIndex--;

          renderDhikr();

        }

      }
    );


    nextButton.addEventListener(
      "click",
      function () {

        if (
          currentIndex <
          adhkar.length - 1
        ) {

          currentIndex++;

          renderDhikr();

        }

      }
    );


    document.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key === "ArrowLeft" &&
          currentIndex > 0
        ) {

          currentIndex--;

          renderDhikr();

        }


        if (
          event.key === "ArrowRight" &&
          currentIndex <
          adhkar.length - 1
        ) {

          currentIndex++;

          renderDhikr();

        }

      }
    );


    document.addEventListener(
      "touchstart",
      function (event) {

        touchStartX =
          event.changedTouches[0].screenX;

        swipeJustOccurred = false;

      },
      { passive: true }
    );


    document.addEventListener(
      "touchend",
      function (event) {

        touchEndX =
          event.changedTouches[0].screenX;


        const difference =
          touchEndX - touchStartX;


        if (
          Math.abs(difference) < 60
        ) {

          return;

        }


        swipeJustOccurred = true;


        if (
          difference < 0 &&
          currentIndex <
          adhkar.length - 1
        ) {

          currentIndex++;

          renderDhikr();

        }


        if (
          difference > 0 &&
          currentIndex > 0
        ) {

          currentIndex--;

          renderDhikr();

        }


        setTimeout(
          function () {

            swipeJustOccurred = false;

          },
          300
        );

      },
      { passive: true }
    );


    renderDhikr();

  </script>

</body>
</html>
