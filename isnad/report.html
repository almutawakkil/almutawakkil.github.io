<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تقرير بحثي - مُشَجِّر الأسانيد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{font-family:"Amiri",serif;color:#172c25;background:#edf2ef}*{box-sizing:border-box}body{margin:0}.print-toolbar{position:sticky;top:0;z-index:2;display:flex;justify-content:center;align-items:center;gap:12px;padding:10px;background:#173f34;color:#fff}.print-toolbar button{font:700 17px "Amiri",serif;border:0;border-radius:8px;background:#fff;color:#173f34;padding:7px 18px;cursor:pointer}.print-toolbar span{font-size:14px}.report{width:297mm;margin:18px auto;background:#fff;padding:12mm 14mm;box-shadow:0 8px 35px #18392f22}.report-page{break-after:page}.report-page:last-of-type{break-after:auto}.cover{text-align:center;margin-bottom:4mm}.cover h1{font-size:28px;line-height:1.35;margin:0 0 2mm;color:#173f34}.matn{font-size:18px;line-height:1.75;text-align:justify;margin:2mm auto;max-width:255mm;padding:2.5mm 5mm;border-block:1px solid #d8c693}.attribution{font-size:15px;color:#5b6e66;margin:1.5mm 0}.section-title{font-size:21px;color:#173f34;border-bottom:2px solid #d8c693;padding-bottom:2mm;margin:0 0 4mm}.diagram-page{min-height:180mm;display:flex;flex-direction:column}.diagram-frame{width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}.diagram-frame svg{display:block;width:100%;height:100%;max-height:164mm}.intro-page .diagram-frame svg{max-height:130mm}.diagram-continuation .diagram-frame svg{max-height:172mm}.chains{margin:0;padding:0 9mm 0 0;columns:2;column-gap:12mm}.chain-entry{break-inside:avoid;page-break-inside:avoid;margin:0 0 4mm;padding:0 0 3mm;border-bottom:1px solid #e3e9e5}.chain-path{font-size:16px;line-height:1.8}.wording-line{color:#6d552b;font-size:13px;line-height:1.7}.source{color:#53675f;font-size:13px;line-height:1.7;margin-top:1mm}.notes-list{padding-right:8mm;columns:2;column-gap:12mm}.notes-list li{break-inside:avoid;page-break-inside:avoid;margin-bottom:3mm;line-height:1.75}.research-notes{break-inside:avoid;page-break-inside:avoid;margin-top:5mm;padding:4mm 5mm;background:#f5f8f6;border-right:3px solid #417c66;white-space:pre-wrap;line-height:1.8}.empty{color:#697a73;text-align:center}.report-footer{margin:7mm 14mm 0;padding-top:2mm;border-top:1px solid #dfe6e2;color:#76857f;text-align:center;font-size:10px}.error{color:#8b2e35;text-align:center;padding:40px;font-size:20px}@page{size:A4 landscape;margin:10mm}
    @media print{html,body{background:#fff!important}.print-toolbar{display:none}.report{width:auto;margin:0;padding:0;box-shadow:none}.report-page{min-height:0;padding-top:8mm}.intro-page{height:170mm;padding-top:0;display:block;overflow:hidden}.intro-page .diagram-frame{height:104mm;display:flex}.intro-page .diagram-frame svg{width:100%!important;height:104mm!important;max-height:104mm!important}.diagram-continuation{height:170mm}.diagram-continuation .diagram-frame{height:150mm}.diagram-continuation .diagram-frame svg{width:100%;height:150mm;max-height:150mm}.notes-page::before{content:"";display:block;height:5mm}.report-footer{margin-inline:0}.chain-entry,.notes-list li,.research-notes{break-inside:avoid;page-break-inside:avoid}}
    @media(max-width:1000px){.report{width:calc(100% - 20px);padding:24px 18px}.print-toolbar{flex-wrap:wrap}.diagram-page{min-height:auto}.diagram-frame{min-height:420px}.chains,.notes-list{columns:1}}
  </style>
</head>
<body>
  <div class="print-toolbar"><button id="printReport">طباعة / حفظ PDF</button><span>اختر A4 أفقيًا، وألغِ «الرؤوس والتذييلات» في نافذة الطباعة إن ظهرت؛ يتحكم المتصفح في هذا الخيار.</span></div>
  <main id="report" class="report" aria-live="polite"></main>

</body>
</html>
