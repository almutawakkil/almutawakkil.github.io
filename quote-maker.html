<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quote Maker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    :root{
      --page:#f5f4f1;
      --panel:#ffffff;
      --ink:#191919;
      --muted:#73716d;
      --line:#e6e3dd;
      --paper:#F3EBDD;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      color:var(--ink);

      background:
        radial-gradient(
          circle at 15% 0%,
          #fff 0 18%,
          transparent 40%
        ),
        var(--page);

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .shell{
      width:min(1220px,calc(100% - 32px));
      margin:34px auto 60px;
    }

    .topbar{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:18px;
      margin-bottom:24px;
    }

    .title h1{
      font-size:clamp(25px,3vw,38px);
      margin:0 0 6px;
      font-weight:600;
      letter-spacing:-.035em;
    }

    .title p{
      margin:0;
      color:var(--muted);
      font-size:14px;
    }

    .layout{
      display:grid;
      grid-template-columns:minmax(330px,440px) minmax(0,1fr);
      gap:26px;
      align-items:start;
    }

    .panel{
      background:rgba(255,255,255,.9);
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:0 18px 48px rgba(40,35,28,.06);
    }

    .controls{
      padding:22px;
      position:sticky;
      top:18px;
    }

    .section + .section{
      margin-top:22px;
      padding-top:22px;
      border-top:1px solid var(--line);
    }

    .section-title{
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.11em;
      color:#8b8882;
      margin:0 0 12px;
      font-weight:600;
    }

    label{
      display:block;
      font-size:13px;
      font-weight:600;
      margin:0 0 7px;
    }

    .field + .field{
      margin-top:14px;
    }

    textarea,
    input{
      width:100%;
      border:1px solid #dcd9d2;
      border-radius:13px;
      background:#fff;
      color:#1d1d1b;
      padding:12px 13px;
      outline:none;

      transition:
        border-color .15s,
        box-shadow .15s;
    }

    textarea{
      min-height:190px;
      resize:vertical;
      line-height:1.95;
      font-family:"Amiri",serif;
      font-size:21px;
    }

    input{
      font-family:"Aref Ruqaa","Amiri",serif;
      font-size:18px;
    }

    input:focus,
    textarea:focus{
      border-color:#aaa59b;
      box-shadow:0 0 0 3px rgba(70,65,58,.07);
    }

    .segmented{
      display:grid;
      gap:8px;
    }

    .segmented.two{
      grid-template-columns:repeat(2,1fr);
    }

    .segmented.four{
      grid-template-columns:repeat(2,1fr);
    }

    button{
      font:inherit;
    }

    .choice{
      border:1px solid #dedbd4;
      background:#fff;
      color:#403e39;
      border-radius:12px;
      padding:10px 11px;
      cursor:pointer;
      transition:.15s ease;
      font-size:13px;
    }

    .choice:hover{
      border-color:#bdb8ae;
    }

    .choice.active{
      background:#232321;
      color:#fff;
      border-color:#232321;
    }

    .toggle-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }

    .toggle-copy strong{
      display:block;
      font-size:13px;
      margin-bottom:3px;
    }

    .toggle-copy span{
      display:block;
      color:var(--muted);
      font-size:12px;
      line-height:1.45;
    }

    .switch{
      position:relative;
      width:46px;
      height:27px;
      flex:0 0 auto;
    }

    .switch input{
      opacity:0;
      width:0;
      height:0;
    }

    .slider{
      position:absolute;
      inset:0;
      background:#d7d4ce;
      border-radius:99px;
      cursor:pointer;
      transition:.18s;
    }

    .slider:before{
      content:"";
      position:absolute;
      width:21px;
      height:21px;
      left:3px;
      top:3px;
      background:#fff;
      border-radius:50%;
      box-shadow:0 2px 7px rgba(0,0,0,.14);
      transition:.18s;
    }

    .switch input:checked + .slider{
      background:#232321;
    }

    .switch input:checked + .slider:before{
      transform:translateX(19px);
    }

    .actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;
    }

    .primary,
    .secondary{
      border-radius:13px;
      padding:12px 14px;
      cursor:pointer;
      font-weight:600;
      border:1px solid #252522;
    }

    .primary{
      background:#252522;
      color:#fff;
    }

    .secondary{
      background:#fff;
      color:#252522;
    }

    .note{
      margin:12px 0 0;
      color:#77746e;
      font-size:11px;
      line-height:1.55;
    }

    .preview-panel{
      padding:22px;
      min-height:500px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;

      background:
        linear-gradient(45deg,#f1efe9 25%,transparent 25%),
        linear-gradient(-45deg,#f1efe9 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#f1efe9 75%),
        linear-gradient(-45deg,transparent 75%,#f1efe9 75%);

      background-size:24px 24px;

      background-position:
        0 0,
        0 12px,
        12px -12px,
        -12px 0;
    }

    .canvas-wrap{
      width:min(100%,560px);
      filter:drop-shadow(0 24px 34px rgba(36,31,25,.16));
    }

    canvas{
      display:block;
      width:100%;
      height:auto;
      border-radius:4px;
      background:#ddd;
    }

    .status{
      margin-top:10px;
      text-align:center;
      font-size:12px;
      color:#77736d;
      min-height:18px;
    }

    .hidden{
      display:none;
    }

    @media(max-width:900px){
      .layout{
        grid-template-columns:1fr;
      }

      .controls{
        position:static;
      }

      .preview-panel{
        padding:16px;
      }
    }

    @media(max-width:520px){
      .shell{
        width:min(100% - 18px,1220px);
        margin-top:18px;
      }

      .topbar{
        align-items:flex-start;
        flex-direction:column;
      }

      .panel{
        border-radius:17px;
      }

      .controls{
        padding:16px;
      }

      .actions{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

  <main class="shell">

    <div class="topbar">
      <div class="title">
        <h1>Quote Maker</h1>
        <p>A simple, quiet tool for making shareable quotation cards.</p>
      </div>
    </div>

    <div class="layout">

      <aside class="panel controls">

        <section
          class="section"
          style="padding-top:0;margin-top:0;border-top:0"
        >

          <p class="section-title">
            Type
          </p>

          <div
            class="segmented two"
            id="typeChoices"
          >

            <button
              class="choice active"
              data-type="general"
            >
              General
            </button>

            <button
              class="choice"
              data-type="hadith"
            >
              Hadith
            </button>

          </div>

        </section>


        <section class="section">

          <p class="section-title">
            Content
          </p>

          <div class="field">

            <label for="quote">
              Quote
            </label>

            <textarea
              id="quote"
              dir="auto"
            >مَنْ كَانَ بِاللَّهِ أَعْرَفَ، كَانَ مِنْهُ أَخْوَفَ.</textarea>

          </div>


          <div
            class="field"
            id="authorField"
          >

            <label for="author">
              Name
            </label>

            <input
              id="author"
              dir="auto"
              value="سفيان الثوري"
            />

          </div>


          <div class="field">

            <label for="source">
              Source
            </label>

            <input
              id="source"
              dir="auto"
              value="حلية الأولياء"
            />

          </div>

        </section>


        <section class="section">

          <p class="section-title">
            Style
          </p>

          <label>
            Background
          </label>

          <div
            class="segmented four"
            id="themeChoices"
          >

            <button
              class="choice active"
              data-theme="night"
            >
              Night
            </button>

            <button
              class="choice"
              data-theme="sunset"
            >
              Sunset
            </button>

            <button
              class="choice"
              data-theme="green"
            >
              Stars
            </button>

            <button
              class="choice"
              data-theme="paper"
            >
              Paper
            </button>

          </div>


          <div style="height:14px"></div>


          <label>
            Format
          </label>

          <div
            class="segmented two"
            id="ratioChoices"
          >

            <button
              class="choice active"
              data-ratio="4:5"
            >
              4:5 Portrait
            </button>

            <button
              class="choice"
              data-ratio="1:1"
            >
              1:1 Square
            </button>

          </div>


          <div style="height:14px"></div>


          <label>
            Text alignment
          </label>

          <div
            class="segmented two"
            id="alignChoices"
          >

            <button
              class="choice active"
              data-align="center"
            >
              Centered
            </button>

            <button
              class="choice"
              data-align="right"
            >
              Right aligned
            </button>

          </div>

        </section>


        <section class="section">

          <div class="toggle-row">

            <div class="toggle-copy">

              <strong>
                Private watermark
              </strong>

              <span>
                Adds المتوكل — requires access.
              </span>

            </div>

            <label
              class="switch"
              aria-label="Toggle private watermark"
            >

              <input
                id="watermark"
                type="checkbox"
              >

              <span class="slider"></span>

            </label>

          </div>

        </section>


        <section class="section">

          <div class="actions">

            <button
              class="primary"
              id="downloadBtn"
            >
              Download PNG
            </button>

            <button
              class="secondary"
              id="copyBtn"
            >
              Copy Image
            </button>

          </div>

          <p class="note">
            Please verify quotations and sources before sharing.
            This tool formats the text provided; it does not verify
            its authenticity.
          </p>

        </section>

      </aside>


      <section>

        <div class="panel preview-panel">

          <div class="canvas-wrap">

            <canvas
              id="card"
              width="2160"
              height="2700"
            ></canvas>

          </div>

        </div>

        <div
          class="status"
          id="status"
        ></div>

      </section>

    </div>

  </main>


<script>

(() => {

  const canvas =
    document.getElementById("card");

  const ctx =
    canvas.getContext("2d");

  const quoteInput =
    document.getElementById("quote");

  const authorInput =
    document.getElementById("author");

  const sourceInput =
    document.getElementById("source");

  const authorField =
    document.getElementById("authorField");

  const watermarkInput =
    document.getElementById("watermark");

  const statusEl =
    document.getElementById("status");


  const state = {
    type:"general",
    theme:"night",
    ratio:"4:5",
    align:"center"
  };


  const WATERMARK_PASSWORD =
    "barbarawi";

  let watermarkUnlocked =
    false;


  const themeConfig = {

    night:{
      type:"image",
      src:"assets/quote-maker/night.jpeg",
      text:"#F7F4ED",
      secondary:"#F7F4ED",
      shadow:"rgba(0,0,0,.55)",
      overlayTop:.13,
      overlayBottom:.60
    },

    sunset:{
      type:"image",
      src:"assets/quote-maker/sunset.jpeg",
      text:"#FFF9ED",
      secondary:"#FFF9ED",
      shadow:"rgba(54,32,12,.50)",
      overlayTop:.12,
      overlayBottom:.55
    },

    green:{
      type:"image",
      src:"assets/quote-maker/green-stars.jpeg",
      text:"#F8F7F1",
      secondary:"#F8F7F1",
      shadow:"rgba(8,25,20,.50)",
      overlayTop:.10,
      overlayBottom:.48
    },

    paper:{
      type:"paper",
      bg:"#F3EBDD",
      text:"#2C2925",
      secondary:"#62584D"
    }

  };


  const imageCache =
    new Map();


  function setStatus(
    text,
    timeout = 1700
  ){

    statusEl.textContent =
      text;


    if(timeout){

      clearTimeout(
        setStatus.timer
      );


      setStatus.timer =
        setTimeout(
          () => {

            statusEl.textContent =
              "";

          },

          timeout
        );

    }

  }


  function containsArabic(text){

    return /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/
      .test(text || "");

  }


  function harakatRatio(text){

    const letters =
      (
        text.match(
          /[\u0621-\u064A\u066E-\u06D3]/g
        )
        ||
        []
      ).length;


    const marks =
      (
        text.match(
          /[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED]/g
        )
        ||
        []
      ).length;


    if(
      letters === 0
    ){

      return 0;

    }


    return marks / letters;

  }


  function getArabicLineHeightMultiplier(text){

    const ratio =
      harakatRatio(text);


    if(
      ratio >= .42
    ){

      return 1.94;

    }


    if(
      ratio >= .22
    ){

      return 1.85;

    }


    return 1.75;

  }


  function configureCanvas(){

    if(
      state.ratio === "4:5"
    ){

      canvas.width =
        2160;

      canvas.height =
        2700;

    }

    else{

      canvas.width =
        2160;

      canvas.height =
        2160;

    }

  }


  async function loadImage(src){

    if(
      imageCache.has(src)
    ){

      return imageCache.get(src);

    }


    const promise =
      new Promise(
        (resolve,reject) => {

          const img =
            new Image();


          img.onload =
            () => resolve(img);


          img.onerror =
            reject;


          img.src =
            src;

        }
      );


    imageCache.set(
      src,
      promise
    );


    return promise;

  }


  function drawCoverImage(
    img,
    x,
    y,
    w,
    h
  ){

    const imageRatio =
      img.width / img.height;


    const boxRatio =
      w / h;


    let sw;
    let sh;
    let sx;
    let sy;


    if(
      imageRatio > boxRatio
    ){

      sh =
        img.height;

      sw =
        sh * boxRatio;

      sx =
        (img.width - sw) / 2;

      sy =
        0;

    }

    else{

      sw =
        img.width;

      sh =
        sw / boxRatio;

      sx =
        0;

      sy =
        (img.height - sh) / 2;

    }


    ctx.drawImage(
      img,
      sx,
      sy,
      sw,
      sh,
      x,
      y,
      w,
      h
    );

  }


  function drawImageTreatment(
    config,
    W,
    H
  ){

    ctx.fillStyle =
      "rgba(0,0,0,.07)";


    ctx.fillRect(
      0,
      0,
      W,
      H
    );


    const grad =
      ctx.createLinearGradient(
        0,
        0,
        0,
        H
      );


    grad.addColorStop(
      0,
      `rgba(0,0,0,${config.overlayTop})`
    );


    grad.addColorStop(
      .38,
      "rgba(0,0,0,.14)"
    );


    grad.addColorStop(
      1,
      `rgba(0,0,0,${config.overlayBottom})`
    );


    ctx.fillStyle =
      grad;


    ctx.fillRect(
      0,
      0,
      W,
      H
    );


    const radial =
      ctx.createRadialGradient(
        W/2,
        H/2,
        Math.min(W,H)*.20,
        W/2,
        H/2,
        Math.max(W,H)*.72
      );


    radial.addColorStop(
      0,
      "rgba(0,0,0,0)"
    );


    radial.addColorStop(
      1,
      "rgba(0,0,0,.20)"
    );


    ctx.fillStyle =
      radial;


    ctx.fillRect(
      0,
      0,
      W,
      H
    );

  }


  function drawPaper(
    config,
    W,
    H
  ){

    ctx.fillStyle =
      config.bg;


    ctx.fillRect(
      0,
      0,
      W,
      H
    );


    const glow =
      ctx.createRadialGradient(
        W*.28,
        H*.16,
        0,
        W*.28,
        H*.16,
        W*.9
      );


    glow.addColorStop(
      0,
      "rgba(255,255,255,.38)"
    );


    glow.addColorStop(
      1,
      "rgba(122,96,68,.045)"
    );


    ctx.fillStyle =
      glow;


    ctx.fillRect(
      0,
      0,
      W,
      H
    );


    ctx.save();


    ctx.globalAlpha =
      .055;


    ctx.strokeStyle =
      "#806C54";


    ctx.lineWidth =
      1.3;


    for(
      let y=40;
      y<H;
      y+=31
    ){

      ctx.beginPath();


      ctx.moveTo(
        0,
        y
      );


      ctx.bezierCurveTo(
        W*.25,
        y+4,
        W*.65,
        y-4,
        W,
        y+2
      );


      ctx.stroke();

    }


    ctx.restore();

  }


  function splitExplicitLines(text){

    return (text || "")
      .replace(/\r/g,"")
      .split("\n");

  }


  function wrapParagraph(
    text,
    maxWidth
  ){

    if(
      !text.trim()
    ){

      return [""];

    }


    const words =
      text
        .trim()
        .split(/\s+/);


    const lines =
      [];


    let line =
      "";


    for(
      const word
      of words
    ){

      const test =
        line
          ? line + " " + word
          : word;


      if(
        ctx.measureText(test).width
        <= maxWidth
        ||
        !line
      ){

        line =
          test;

      }

      else{

        lines.push(
          line
        );


        line =
          word;

      }

    }


    if(line){

      lines.push(
        line
      );

    }


    return lines;

  }


  function wrapText(
    text,
    maxWidth
  ){

    const paragraphs =
      splitExplicitLines(text);


    const result =
      [];


    paragraphs.forEach(
      (paragraph,index) => {


        const wrapped =
          wrapParagraph(
            paragraph,
            maxWidth
          );


        result.push(
          ...wrapped
        );


        if(
          index <
          paragraphs.length - 1
        ){

          result.push("");

        }

      }
    );


    return result;

  }


  function fontString(
    size,
    weight,
    arabic
  ){

    const family =
      arabic
        ? '"Amiri"'
        : 'Georgia';


    return `${weight} ${size}px ${family}`;

  }


  function metaFontString(
    size,
    weight,
    arabic
  ){

    const family =
      arabic
        ? '"Aref Ruqaa"'
        : 'Georgia';


    return `${weight} ${size}px ${family}`;

  }


  function fitQuote(
    text,
    maxWidth,
    maxHeight,
    arabic
  ){

    const textLength =
      text
        .replace(/\s/g,"")
        .length;


    let size;


    if(arabic){

      if(
        textLength <= 90
      ){

        size =
          158;

      }

      else if(
        textLength <= 180
      ){

        size =
          148;

      }

      else if(
        textLength <= 320
      ){

        size =
          136;

      }

      else if(
        textLength <= 500
      ){

        size =
          126;

      }

      else{

        size =
          118;

      }

    }

    else{

      if(
        textLength <= 120
      ){

        size =
          128;

      }

      else if(
        textLength <= 250
      ){

        size =
          118;

      }

      else{

        size =
          106;

      }

    }


    const minSize =
      arabic
        ? 50
        : 46;


    while(
      size >= minSize
    ){

      ctx.font =
        fontString(
          size,
          400,
          arabic
        );


      const lines =
        wrapText(
          text,
          maxWidth
        );


      const multiplier =
        arabic
          ? getArabicLineHeightMultiplier(text)
          : 1.38;


      const lineHeight =
        size
        *
        multiplier;


      const totalHeight =
        lines.length
        *
        lineHeight;


      if(
        totalHeight <= maxHeight
      ){

        return {
          size,
          lines,
          lineHeight,
          totalHeight
        };

      }


      size -=
        2;

    }


    ctx.font =
      fontString(
        minSize,
        400,
        arabic
      );


    const lines =
      wrapText(
        text,
        maxWidth
      );


    const multiplier =
      arabic
        ? getArabicLineHeightMultiplier(text)
        : 1.38;


    const lineHeight =
      minSize
      *
      multiplier;


    return {
      size:minSize,
      lines,
      lineHeight,

      totalHeight:
        lines.length
        *
        lineHeight
    };

  }


  function drawMainQuote(
    config,
    fitted,
    arabic,
    W,
    startY,
    marginX
  ){

    ctx.save();


    ctx.fillStyle =
      config.text;


    ctx.shadowColor =
      config.type === "image"
        ? config.shadow
        : "rgba(0,0,0,0)";


    ctx.shadowBlur =
      config.type === "image"
        ? 24
        : 0;


    ctx.shadowOffsetY =
      config.type === "image"
        ? 5
        : 0;


    ctx.font =
      fontString(
        fitted.size,
        400,
        arabic
      );


    ctx.textBaseline =
      "top";


    ctx.direction =
      arabic
        ? "rtl"
        : "ltr";


    ctx.textAlign =
      state.align === "center"
        ? "center"
        : "right";


    const tx =
      state.align === "center"
        ? W/2
        : W-marginX;


    fitted.lines.forEach(
      (line,index) => {


        ctx.fillText(
          line,
          tx,
          startY
          +
          index
          *
          fitted.lineHeight
        );

      }
    );


    ctx.restore();


    return (
      startY
      +
      fitted.totalHeight
    );

  }


  function drawHadithHeading(
    config,
    W,
    y,
    marginX
  ){

    ctx.save();


    ctx.fillStyle =
      config.text;


    ctx.shadowColor =
      config.type === "image"
        ? config.shadow
        : "rgba(0,0,0,0)";


    ctx.shadowBlur =
      config.type === "image"
        ? 18
        : 0;


    ctx.shadowOffsetY =
      config.type === "image"
        ? 3
        : 0;


    ctx.font =
      fontString(
        state.ratio === "4:5"
          ? 120
          : 108,
        700,
        true
      );


    ctx.direction =
      "rtl";


    ctx.textBaseline =
      "top";


    ctx.textAlign =
      state.align === "center"
        ? "center"
        : "right";


    const x =
      state.align === "center"
        ? W/2
        : W-marginX;


    ctx.fillText(
      "قال النبي ﷺ:",
      x,
      y
    );


    ctx.restore();

  }


  /*
    GENERAL QUOTE METADATA

    Speaker and source now live in the lower part
    of the composition.

    They are no longer allowed to float far upward.
  */

  function drawGeneralAttribution(
    config,
    W,
    H,
    marginX,
    quoteBottom,
    author,
    source,
    authorArabic,
    sourceArabic
  ){

    if(
      !author
      &&
      !source
    ){

      return;

    }


    const metaX =
      state.align === "center"
        ? W/2
        : W-marginX;


    const authorSize =
      authorArabic
        ? 96
        : 70;


    const sourceSize =
      sourceArabic
        ? 70
        : 52;


    /*
      Speaker is anchored low.

      A short quote can nudge it slightly upward,
      but never dramatically.
    */

    let authorY;


    if(
      quoteBottom < H * .43
    ){

      authorY =
        state.ratio === "4:5"
          ? H * .70
          : H * .685;

    }

    else{

      authorY =
        state.ratio === "4:5"
          ? H * .72
          : H * .705;

    }


    /*
      Keep reasonable separation from quote.
    */

    const minimumAuthorY =
      quoteBottom
      +
      (
        state.ratio === "4:5"
          ? 110
          : 88
      );


    authorY =
      Math.max(
        authorY,
        minimumAuthorY
      );


    /*
      More deliberate separation between
      speaker and source.
    */

    const sourceY =
      authorY
      +
      (
        state.ratio === "4:5"
          ? 180
          : 152
      );


    if(author){

      ctx.save();


      ctx.fillStyle =
        config.secondary;


      ctx.globalAlpha =
        .98;


      ctx.shadowColor =
        config.type === "image"
          ? config.shadow
          : "rgba(0,0,0,0)";


      ctx.shadowBlur =
        config.type === "image"
          ? 14
          : 0;


      ctx.shadowOffsetY =
        config.type === "image"
          ? 2
          : 0;


      ctx.textBaseline =
        "top";


      ctx.textAlign =
        state.align === "center"
          ? "center"
          : "right";


      ctx.direction =
        authorArabic
          ? "rtl"
          : "ltr";


      ctx.font =
        metaFontString(
          authorSize,
          700,
          authorArabic
        );


      ctx.fillText(
        author,
        metaX,
        authorY
      );


      ctx.restore();

    }


    if(source){

      ctx.save();


      ctx.fillStyle =
        config.secondary;


      ctx.globalAlpha =
        .94;


      ctx.shadowColor =
        config.type === "image"
          ? config.shadow
          : "rgba(0,0,0,0)";


      ctx.shadowBlur =
        config.type === "image"
          ? 11
          : 0;


      ctx.shadowOffsetY =
        config.type === "image"
          ? 2
          : 0;


      ctx.textBaseline =
        "top";


      ctx.textAlign =
        state.align === "center"
          ? "center"
          : "right";


      ctx.direction =
        sourceArabic
          ? "rtl"
          : "ltr";


      ctx.font =
        metaFontString(
          sourceSize,
          400,
          sourceArabic
        );


      ctx.fillText(
        source,
        metaX,
        author
          ? sourceY
          : authorY
      );


      ctx.restore();

    }

  }


  /*
    HADITH SOURCE

    Short:
      ~74%

    Medium:
      ~78%

    Long:
      ~83%

    This remains mostly independent of the text
    so the matn is free to remain large.
  */

  function drawHadithSource(
    config,
    W,
    H,
    marginX,
    quoteBottom,
    source,
    sourceArabic,
    lineCount
  ){

    if(
      !source
    ){

      return;

    }


    const sourceX =
      state.align === "center"
        ? W/2
        : W-marginX;


    const sourceSize =
      sourceArabic
        ? 72
        : 53;


    let sourceRatio;


    if(
      lineCount <= 3
    ){

      sourceRatio =
        state.ratio === "4:5"
          ? .74
          : .725;

    }

    else if(
      lineCount <= 5
    ){

      sourceRatio =
        state.ratio === "4:5"
          ? .785
          : .765;

    }

    else{

      sourceRatio =
        state.ratio === "4:5"
          ? .83
          : .81;

    }


    let sourceY =
      H * sourceRatio;


    /*
      The source can never overlap the matn.
    */

    const minimumGap =
      state.ratio === "4:5"
        ? 95
        : 76;


    sourceY =
      Math.max(
        sourceY,
        quoteBottom + minimumGap
      );


    /*
      Footer still belongs to the watermark.
    */

    const maximumY =
      state.ratio === "4:5"
        ? H * .84
        : H * .825;


    sourceY =
      Math.min(
        sourceY,
        maximumY
      );


    ctx.save();


    ctx.fillStyle =
      config.secondary;


    ctx.globalAlpha =
      .95;


    ctx.shadowColor =
      config.type === "image"
        ? config.shadow
        : "rgba(0,0,0,0)";


    ctx.shadowBlur =
      config.type === "image"
        ? 11
        : 0;


    ctx.shadowOffsetY =
      config.type === "image"
        ? 2
        : 0;


    ctx.textBaseline =
      "top";


    ctx.textAlign =
      state.align === "center"
        ? "center"
        : "right";


    ctx.direction =
      sourceArabic
        ? "rtl"
        : "ltr";


    ctx.font =
      metaFontString(
        sourceSize,
        400,
        sourceArabic
      );


    ctx.fillText(
      source,
      sourceX,
      sourceY
    );


    ctx.restore();

  }


  /*
    WATERMARK

    Unchanged.
  */

  function drawWatermark(
    config,
    W,
    H
  ){

    if(
      !watermarkInput.checked
      ||
      !watermarkUnlocked
    ){

      return;

    }


    ctx.save();


    ctx.fillStyle =
      "#FFFFFF";


    ctx.globalAlpha =
      .96;


    ctx.shadowColor =
      config.type === "paper"
        ? "rgba(44,41,37,.45)"
        : "rgba(0,0,0,.55)";


    ctx.shadowBlur =
      config.type === "paper"
        ? 10
        : 14;


    ctx.shadowOffsetY =
      3;


    ctx.font =
      metaFontString(
        state.ratio === "4:5"
          ? 100
          : 92,
        700,
        true
      );


    ctx.textAlign =
      "center";


    ctx.textBaseline =
      "middle";


    ctx.direction =
      "rtl";


    const watermarkY =
      state.ratio === "4:5"
        ? H * .905
        : H * .90;


    ctx.fillText(
      "المتوكل",
      W/2,
      watermarkY
    );


    ctx.restore();

  }


  function drawTextBlock(
    config,
    W,
    H
  ){

    const quote =
      quoteInput.value.trim()
      ||
      "اكتب النص هنا";


    const author =
      authorInput.value.trim();


    const source =
      sourceInput.value.trim();


    const quoteArabic =
      containsArabic(
        quote
      );


    const authorArabic =
      containsArabic(
        author
      );


    const sourceArabic =
      containsArabic(
        source
      );


    /*
      Hadith gets slightly wider margins,
      helping it retain larger type.
    */

    const marginX =
      state.type === "hadith"
        ? W * .075
        : W * .09;


    const maxWidth =
      W
      -
      marginX * 2;


    /*
      ================================================
      GENERAL
      ================================================
    */

    if(
      state.type === "general"
    ){

      /*
        Give the quote plenty of room.

        We are no longer shrinking it simply
        to make room for metadata above.
      */

      const quoteSafeTop =
        state.ratio === "4:5"
          ? H * .115
          : H * .10;


      const quoteSafeBottom =
        state.ratio === "4:5"
          ? H * .625
          : H * .61;


      const quoteCenterY =
        state.ratio === "4:5"
          ? H * .37
          : H * .355;


      const availableHeight =
        quoteSafeBottom
        -
        quoteSafeTop;


      const fitted =
        fitQuote(
          quote,
          maxWidth,
          availableHeight,
          quoteArabic
        );


      let startY =
        quoteCenterY
        -
        fitted.totalHeight / 2;


      if(
        startY <
        quoteSafeTop
      ){

        startY =
          quoteSafeTop;

      }


      if(
        startY
        +
        fitted.totalHeight
        >
        quoteSafeBottom
      ){

        startY =
          quoteSafeBottom
          -
          fitted.totalHeight;

      }


      const quoteBottom =
        drawMainQuote(
          config,
          fitted,
          quoteArabic,
          W,
          startY,
          marginX
        );


      drawGeneralAttribution(
        config,
        W,
        H,
        marginX,
        quoteBottom,
        author,
        source,
        authorArabic,
        sourceArabic
      );

    }


    /*
      ================================================
      HADITH
      ================================================
    */

    else{


      /*
        Heading and matn now start slightly lower.
      */

      const headingHeight =
        state.ratio === "4:5"
          ? 145
          : 132;


      const headingGap =
        state.ratio === "4:5"
          ? 100
          : 88;


      /*
        Top moved down slightly from the last version.
      */

      const groupSafeTop =
        state.ratio === "4:5"
          ? H * .105
          : H * .09;


      /*
        But bottom expanded considerably,
        giving long hadith more room
        and therefore a larger font.
      */

      const groupSafeBottom =
        state.ratio === "4:5"
          ? H * .705
          : H * .69;


      const availableForGroup =
        groupSafeBottom
        -
        groupSafeTop;


      const availableForQuote =
        availableForGroup
        -
        headingHeight
        -
        headingGap;


      const fitted =
        fitQuote(
          quote,
          maxWidth,
          availableForQuote,
          quoteArabic
        );


      const groupHeight =
        headingHeight
        +
        headingGap
        +
        fitted.totalHeight;


      /*
        Shift whole Prophet-heading + matn
        slightly downward.

        Shorter text:
          around 39%

        Longer text:
          around 41%

        This prevents the composition
        from feeling top-heavy.
      */

      let groupCenterY;


      if(
        fitted.lines.length <= 3
      ){

        groupCenterY =
          state.ratio === "4:5"
            ? H * .39
            : H * .375;

      }

      else if(
        fitted.lines.length <= 5
      ){

        groupCenterY =
          state.ratio === "4:5"
            ? H * .40
            : H * .385;

      }

      else{

        groupCenterY =
          state.ratio === "4:5"
            ? H * .41
            : H * .395;

      }


      let groupStartY =
        groupCenterY
        -
        groupHeight / 2;


      if(
        groupStartY <
        groupSafeTop
      ){

        groupStartY =
          groupSafeTop;

      }


      if(
        groupStartY
        +
        groupHeight
        >
        groupSafeBottom
      ){

        groupStartY =
          groupSafeBottom
          -
          groupHeight;

      }


      const headingY =
        groupStartY;


      const quoteStartY =
        headingY
        +
        headingHeight
        +
        headingGap;


      drawHadithHeading(
        config,
        W,
        headingY,
        marginX
      );


      const quoteBottom =
        drawMainQuote(
          config,
          fitted,
          quoteArabic,
          W,
          quoteStartY,
          marginX
        );


      drawHadithSource(
        config,
        W,
        H,
        marginX,
        quoteBottom,
        source,
        sourceArabic,
        fitted.lines.length
      );

    }


    drawWatermark(
      config,
      W,
      H
    );

  }


  async function render(){

    configureCanvas();


    const W =
      canvas.width;


    const H =
      canvas.height;


    const config =
      themeConfig[
        state.theme
      ];


    ctx.clearRect(
      0,
      0,
      W,
      H
    );


    if(
      config.type === "paper"
    ){

      drawPaper(
        config,
        W,
        H
      );

    }

    else{

      try{

        const img =
          await loadImage(
            config.src
          );


        drawCoverImage(
          img,
          0,
          0,
          W,
          H
        );

      }

      catch(err){

        const fallback =
          ctx.createLinearGradient(
            0,
            0,
            0,
            H
          );


        fallback.addColorStop(
          0,
          "#252735"
        );


        fallback.addColorStop(
          1,
          "#111217"
        );


        ctx.fillStyle =
          fallback;


        ctx.fillRect(
          0,
          0,
          W,
          H
        );


        setStatus(
          `Add ${config.src} to use this background.`,
          2600
        );

      }


      drawImageTreatment(
        config,
        W,
        H
      );

    }


    drawTextBlock(
      config,
      W,
      H
    );

  }


  function bindChoiceGroup(
    groupId,
    key
  ){

    document
      .getElementById(
        groupId
      )
      .addEventListener(
        "click",
        event => {


          const btn =
            event.target.closest(
              ".choice"
            );


          if(!btn){
            return;
          }


          const value =
            btn.dataset[key];


          if(!value){
            return;
          }


          state[key] =
            value;


          btn.parentElement
            .querySelectorAll(
              ".choice"
            )
            .forEach(
              item => {

                item.classList.remove(
                  "active"
                );

              }
            );


          btn.classList.add(
            "active"
          );


          if(
            key === "type"
          ){

            updateTypeInterface();

          }


          render();

        }
      );

  }


  bindChoiceGroup(
    "typeChoices",
    "type"
  );


  bindChoiceGroup(
    "themeChoices",
    "theme"
  );


  bindChoiceGroup(
    "ratioChoices",
    "ratio"
  );


  bindChoiceGroup(
    "alignChoices",
    "align"
  );


  function updateTypeInterface(){

    if(
      state.type === "hadith"
    ){

      authorField.classList.add(
        "hidden"
      );

    }

    else{

      authorField.classList.remove(
        "hidden"
      );

    }

  }


  [
    quoteInput,
    authorInput,
    sourceInput
  ]
  .forEach(
    element => {

      element.addEventListener(
        "input",
        render
      );

    }
  );


  watermarkInput
    .addEventListener(
      "change",
      () => {


        if(
          !watermarkInput.checked
        ){

          render();

          return;

        }


        if(
          watermarkUnlocked
        ){

          render();

          return;

        }


        const entered =
          window.prompt(
            "Enter watermark password:"
          );


        if(
          entered ===
          WATERMARK_PASSWORD
        ){

          watermarkUnlocked =
            true;


          watermarkInput.checked =
            true;


          setStatus(
            "Private watermark unlocked.",
            1800
          );


          render();

        }

        else{

          watermarkInput.checked =
            false;


          if(
            entered !== null
          ){

            setStatus(
              "Incorrect password.",
              2000
            );

          }


          render();

        }

      }
    );


  document
    .getElementById(
      "downloadBtn"
    )
    .addEventListener(
      "click",
      async () => {


        await render();


        const link =
          document.createElement(
            "a"
          );


        let filenameBase;


        if(
          state.type === "hadith"
        ){

          filenameBase =
            "hadith";

        }

        else{

          filenameBase =
            authorInput.value.trim()
            ||
            "quote";

        }


        const safeName =
          filenameBase
            .replace(
              /[^\p{L}\p{N}_-]+/gu,
              "-"
            )
            .replace(
              /^-+|-+$/g,
              ""
            );


        link.download =
          `${
            safeName || "quote"
          }-${
            state.ratio.replace(
              ":",
              "x"
            )
          }.png`;


        link.href =
          canvas.toDataURL(
            "image/png",
            1
          );


        link.click();


        setStatus(
          "PNG downloaded."
        );

      }
    );


  document
    .getElementById(
      "copyBtn"
    )
    .addEventListener(
      "click",
      async () => {


        try{


          await render();


          const blob =
            await new Promise(
              resolve => {

                canvas.toBlob(
                  resolve,
                  "image/png",
                  1
                );

              }
            );


          if(
            !navigator.clipboard
            ||
            !window.ClipboardItem
          ){

            throw new Error(
              "Clipboard images are not supported."
            );

          }


          await navigator.clipboard.write(
            [

              new ClipboardItem(
                {
                  "image/png":
                    blob
                }
              )

            ]
          );


          setStatus(
            "Image copied."
          );

        }

        catch(err){


          setStatus(
            "Copy Image is not supported here — use Download PNG instead.",
            3000
          );

        }

      }
    );


  async function start(){

    if(
      document.fonts
      &&
      document.fonts.ready
    ){

      await document.fonts.ready;

    }


    if(
      document.fonts
      &&
      document.fonts.load
    ){

      try{

        await Promise.all(
          [

            document.fonts.load(
              '400 158px "Amiri"'
            ),

            document.fonts.load(
              '700 120px "Amiri"'
            ),

            document.fonts.load(
              '400 72px "Aref Ruqaa"'
            ),

            document.fonts.load(
              '700 100px "Aref Ruqaa"'
            )

          ]
        );

      }

      catch(err){

      }

    }


    updateTypeInterface();


    render();

  }


  start();


})();

</script>
