  <style>
    *, *::before, *::after {

    }

    html,
    body {
      margin: 0;

    body {
      font-family: "Amiri", Georgia, serif;
      background: #f6f5f0;

    .wrap {

      padding: 42px 20px 32px;
      display: flex;

    /* HEADER */

    header {

      justify-content: space-between;
      gap: 24px;
    }

      color: #6e6d67;

      font-size: 16px;

    }

    }

    /* READER */

    .reader {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
    }

    .dua-card {
      width: 100%;
      min-height: 430px;

      border: 1px solid rgba(0, 0, 0, 0.08);

      flex-direction: column;

      align-items: center;

      position: relative;
    }

    .dua-text {
      width: 100%;
      max-width: 760px;
      margin: auto 0;

      font-family: "Amiri", Georgia, serif;
      font-size: clamp(31px, 5vw, 44px);
      line-height: 2;
      font-weight: 400;

      direction: rtl;
      text-align: center;

      color: #1a1a18;
    }

    /* Automatically used for longer selections */

    .dua-text.medium {
      font-size: clamp(27px, 4.4vw, 38px);
      line-height: 1.9;
    }

    .dua-text.long {
      font-size: clamp(23px, 3.8vw, 32px);
      line-height: 1.85;
    }

    .dua-text.very-long {
      font-size: clamp(19px, 3vw, 27px);
      line-height: 1.75;
    }

    .controls {

      max-width: 260px;
      margin-top: 34px;

      align-items: center;
      justify-content: space-between;
    }

      appearance: none;
      border: none;
      background: transparent;

      cursor: pointer;

      border-radius: 10px;
      transition:

        background 0.15s ease,
        opacity 0.15s ease;
    }

    .arrow:hover {
      color: #27500a;
      background: rgba(0, 0, 0, 0.035);
    }

    .arrow:disabled {
      opacity: 0.22;
      cursor: default;
      background: transparent;
      color: #77756e;
    }

    /* MOBILE */

      .wrap {
        padding: 28px 14px 18px;
      }

      header {
        margin-bottom: 18px;

      .top {

        align-items: flex-start;
        gap: 14px;

      .brand-arabic {
        font-size: 32px;

        gap: 14px;
      }

      nav a {

      }

      .dua-card {

        padding: 28px 20px 22px;

      .dua-text {
        font-size: clamp(29px, 8.5vw, 38px);
        line-height: 1.95;
      }

      .dua-text.medium {
        font-size: clamp(25px, 7.3vw, 33px);
        line-height: 1.85;
      }

      .dua-text.long {
        font-size: clamp(21px, 6vw, 28px);
        line-height: 1.75;
      }

      .dua-text.very-long {
        font-size: clamp(17px, 4.7vw, 23px);
        line-height: 1.65;
      }

      .controls {
        margin-top: 22px;
      }

      .arrow {
        font-size: 32px;
      }

    /* DARK MODE */

    @media (prefers-color-scheme: dark) {

        color: #f2efe8;

        color: #b8d98d;

        background: #22211f;
        border-color: rgba(255, 255, 255, 0.08);
      }

      .dua-text {
        color: #f2efe8;
      }

      .arrow:hover {
        background: rgba(255, 255, 255, 0.04);
      }

  <script>

    const duas = [

      `﴿رَبَّنَآ ءَاتِنَا فِى ٱلدُّنْيَا حَسَنَةًۭ وَفِى ٱلْـَٔاخِرَةِ حَسَنَةًۭ وَقِنَا عَذَابَ ٱلنَّارِ﴾`,

      `﴿رَبَّنَآ أَفْرِغْ عَلَيْنَا صَبْرًۭا وَثَبِّتْ أَقْدَامَنَا وَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَـٰفِرِينَ﴾`,

      `﴿رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ ٱلْوَهَّابُ ۝ رَبَّنَآ إِنَّكَ جَامِعُ ٱلنَّاسِ لِيَوْمٍۢ لَّا رَيْبَ فِيهِ ۚ إِنَّ ٱللَّهَ لَا يُخْلِفُ ٱلْمِيعَادَ﴾`,

      `﴿رَبَّنَآ إِنَّنَآ ءَامَنَّا فَٱغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ ٱلنَّارِ﴾`,

      `﴿رَبَّنَا ٱغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِىٓ أَمْرِنَا وَثَبِّتْ أَقْدَامَنَا وَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَـٰفِرِينَ﴾`,

      `﴿إِنَّ فِى خَلْقِ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ وَٱخْتِلَـٰفِ ٱلَّيْلِ وَٱلنَّهَارِ لَـَٔايَـٰتٍۢ لِّأُو۟لِى ٱلْأَلْبَـٰبِ ۝ ٱلَّذِينَ يَذْكُرُونَ ٱللَّهَ قِيَـٰمًۭا وَقُعُودًۭا وَعَلَىٰ جُنُوبِهِمْ وَيَتَفَكَّرُونَ فِى خَلْقِ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ رَبَّنَا مَا خَلَقْتَ هَـٰذَا بَـٰطِلًۭا سُبْحَـٰنَكَ فَقِنَا عَذَابَ ٱلنَّارِ ۝ رَبَّنَآ إِنَّكَ مَن تُدْخِلِ ٱلنَّارَ فَقَدْ أَخْزَيْتَهُۥ ۖ وَمَا لِلظَّـٰلِمِينَ مِنْ أَنصَارٍۢ ۝ رَّبَّنَآ إِنَّنَا سَمِعْنَا مُنَادِيًۭا يُنَادِى لِلْإِيمَـٰنِ أَنْ ءَامِنُوا۟ بِرَبِّكُمْ فَـَٔامَنَّا ۚ رَبَّنَا فَٱغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّـَٔاتِنَا وَتَوَفَّنَا مَعَ ٱلْأَبْرَارِ ۝ رَبَّنَا وَءَاتِنَا مَا وَعَدتَّنَا عَلَىٰ رُسُلِكَ وَلَا تُخْزِنَا يَوْمَ ٱلْقِيَـٰمَةِ ۗ إِنَّكَ لَا تُخْلِفُ ٱلْمِيعَادَ﴾`,

      `﴿وَٱرْزُقْنَا وَأَنتَ خَيْرُ ٱلرَّٰزِقِينَ﴾`,

      `﴿رَبَّنَا ظَلَمْنَآ أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ ٱلْخَـٰسِرِينَ﴾`,

      `﴿رَبَّنَآ أَفْرِغْ عَلَيْنَا صَبْرًۭا وَتَوَفَّنَا مُسْلِمِينَ﴾`,

      `﴿أَنتَ وَلِيُّنَا فَٱغْفِرْ لَنَا وَٱرْحَمْنَا ۖ وَأَنتَ خَيْرُ ٱلْغَـٰفِرِينَ﴾`,

      `﴿لَّن يُصِيبَنَآ إِلَّا مَا كَتَبَ ٱللَّهُ لَنَا هُوَ مَوْلَىٰنَا﴾`,

      `﴿حَسْبِىَ ٱللَّهُ لَآ إِلَـٰهَ إِلَّا هُوَ ۖ عَلَيْهِ تَوَكَّلْتُ ۖ وَهُوَ رَبُّ ٱلْعَرْشِ ٱلْعَظِيمِ﴾`,

      `﴿عَلَى ٱللَّهِ تَوَكَّلْنَا رَبَّنَا لَا تَجْعَلْنَا فِتْنَةًۭ لِّلْقَوْمِ ٱلظَّـٰلِمِينَ ۝ وَنَجِّنَا بِرَحْمَتِكَ مِنَ ٱلْقَوْمِ ٱلْكَـٰفِرِينَ﴾`,

      `﴿رَبَّنَا ٱطْمِسْ عَلَىٰٓ أَمْوَٰلِهِمْ وَٱشْدُدْ عَلَىٰ قُلُوبِهِمْ فَلَا يُؤْمِنُوا۟ حَتَّىٰ يَرَوُا۟ ٱلْعَذَابَ ٱلْأَلِيمَ﴾`,

      `﴿إِنِّى تَوَكَّلْتُ عَلَى ٱللَّهِ رَبِّى وَرَبِّكُم ۚ مَّا مِن دَآبَّةٍ إِلَّا هُوَ ءَاخِذٌۢ بِنَاصِيَتِهَآ ۚ إِنَّ رَبِّى عَلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ﴾`,

      `﴿إِنْ أُرِيدُ إِلَّا ٱلْإِصْلَـٰحَ مَا ٱسْتَطَعْتُ ۚ وَمَا تَوْفِيقِىٓ إِلَّا بِٱللَّهِ ۚ عَلَيْهِ تَوَكَّلْتُ وَإِلَيْهِ أُنِيبُ﴾`,

      `﴿رَبِّ قَدْ ءَاتَيْتَنِى مِنَ ٱلْمُلْكِ وَعَلَّمْتَنِى مِن تَأْوِيلِ ٱلْأَحَادِيثِ ۚ فَاطِرَ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ أَنتَ وَلِىِّۦ فِى ٱلدُّنْيَا وَٱلْـَٔاخِرَةِ ۖ تَوَفَّنِى مُسْلِمًۭا وَأَلْحِقْنِى بِٱلصَّـٰلِحِينَ﴾`,

      `﴿رَبِّ ٱجْعَلْنِى مُقِيمَ ٱلصَّلَوٰةِ وَمِن ذُرِّيَّتِى ۚ رَبَّنَا وَتَقَبَّلْ دُعَآءِ ۝ رَبَّنَا ٱغْفِرْ لِى وَلِوَٰلِدَىَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ ٱلْحِسَابُ﴾`,

      `﴿رَّبِّ أَدْخِلْنِى مُدْخَلَ صِدْقٍۢ وَأَخْرِجْنِى مُخْرَجَ صِدْقٍۢ وَٱجْعَل لِّى مِن لَّدُنكَ سُلْطَـٰنًۭا نَّصِيرًۭا﴾`,

      `﴿رَبَّنَآ ءَاتِنَا مِن لَّدُنكَ رَحْمَةًۭ وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًۭا﴾`,

      `﴿رَبِّ ٱشْرَحْ لِى صَدْرِى ۝ وَيَسِّرْ لِىٓ أَمْرِى ۝ وَٱحْلُلْ عُقْدَةًۭ مِّن لِّسَانِى ۝ يَفْقَهُوا۟ قَوْلِى﴾`,

      `﴿رَّبِّ زِدْنِى عِلْمًۭا﴾`,

      `﴿أَنِّى مَسَّنِىَ ٱلضُّرُّ وَأَنتَ أَرْحَمُ ٱلرَّٰحِمِينَ﴾`,

      `﴿لَّآ إِلَـٰهَ إِلَّآ أَنتَ سُبْحَـٰنَكَ إِنِّى كُنتُ مِنَ ٱلظَّـٰلِمِينَ﴾`,

      `﴿رَّبِّ أَعُوذُ بِكَ مِنْ هَمَزَٰتِ ٱلشَّيَـٰطِينِ ۝ وَأَعُوذُ بِكَ رَبِّ أَن يَحْضُرُونِ﴾`,

      `﴿رَّبِّ ٱغْفِرْ وَٱرْحَمْ وَأَنتَ خَيْرُ ٱلرَّٰحِمِينَ﴾`,

      `﴿رَبَّنَا ٱصْرِفْ عَنَّا عَذَابَ جَهَنَّمَ ۖ إِنَّ عَذَابَهَا كَانَ غَرَامًا ۝ إِنَّهَا سَآءَتْ مُسْتَقَرًّۭا وَمُقَامًۭا﴾`,

      `﴿رَبَّنَا هَبْ لَنَا مِنْ أَزْوَٰجِنَا وَذُرِّيَّـٰتِنَا قُرَّةَ أَعْيُنٍۢ وَٱجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا﴾`,

      `﴿رَبِّ هَبْ لِى حُكْمًۭا وَأَلْحِقْنِى بِٱلصَّـٰلِحِينَ ۝ وَٱجْعَل لِّى لِسَانَ صِدْقٍۢ فِى ٱلْـَٔاخِرِينَ ۝ وَٱجْعَلْنِى مِن وَرَثَةِ جَنَّةِ ٱلنَّعِيمِ﴾`,

      `﴿وَلَا تُخْزِنِى يَوْمَ يُبْعَثُونَ﴾`,

      `﴿رَبِّ أَوْزِعْنِىٓ أَنْ أَشْكُرَ نِعْمَتَكَ ٱلَّتِىٓ أَنْعَمْتَ عَلَىَّ وَعَلَىٰ وَٰلِدَىَّ وَأَنْ أَعْمَلَ صَـٰلِحًۭا تَرْضَىٰهُ وَأَدْخِلْنِى بِرَحْمَتِكَ فِى عِبَادِكَ ٱلصَّـٰلِحِينَ﴾`,

      `﴿هَـٰذَا مِن فَضْلِ رَبِّى لِيَبْلُوَنِىٓ ءَأَشْكُرُ أَمْ أَكْفُرُ ۖ وَمَن شَكَرَ فَإِنَّمَا يَشْكُرُ لِنَفْسِهِۦ ۖ وَمَن كَفَرَ فَإِنَّ رَبِّى غَنِىٌّۭ كَرِيمٌۭ﴾`,

      `﴿رَبِّ إِنِّى ظَلَمْتُ نَفْسِى فَٱغْفِرْ لِى﴾`,

      `﴿رَبِّ إِنِّى لِمَآ أَنزَلْتَ إِلَىَّ مِنْ خَيْرٍۢ فَقِيرٌۭ﴾`,

      `﴿رَبِّ أَوْزِعْنِىٓ أَنْ أَشْكُرَ نِعْمَتَكَ ٱلَّتِىٓ أَنْعَمْتَ عَلَىَّ وَعَلَىٰ وَٰلِدَىَّ وَأَنْ أَعْمَلَ صَـٰلِحًۭا تَرْضَىٰهُ وَأَصْلِحْ لِى فِى ذُرِّيَّتِىٓ ۖ إِنِّى تُبْتُ إِلَيْكَ وَإِنِّى مِنَ ٱلْمُسْلِمِينَ﴾`,

      `﴿رَبَّنَا ٱغْفِرْ لَنَا وَلِإِخْوَٰنِنَا ٱلَّذِينَ سَبَقُونَا بِٱلْإِيمَـٰنِ وَلَا تَجْعَلْ فِى قُلُوبِنَا غِلًّۭا لِّلَّذِينَ ءَامَنُوا۟ رَبَّنَآ إِنَّكَ رَءُوفٌۭ رَّحِيمٌ﴾`,

      `﴿رَّبَّنَا عَلَيْكَ تَوَكَّلْنَا وَإِلَيْكَ أَنَبْنَا وَإِلَيْكَ ٱلْمَصِيرُ ۝ رَبَّنَا لَا تَجْعَلْنَا فِتْنَةًۭ لِّلَّذِينَ كَفَرُوا۟ وَٱغْفِرْ لَنَا رَبَّنَآ ۖ إِنَّكَ أَنتَ ٱلْعَزِيزُ ٱلْحَكِيمُ﴾`,

      `﴿رَبَّنَآ أَتْمِمْ لَنَا نُورَنَا وَٱغْفِرْ لَنَآ ۖ إِنَّكَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ﴾`,

      `﴿رَّبِّ ٱغْفِرْ لِى وَلِوَٰلِدَىَّ وَلِمَن دَخَلَ بَيْتِىَ مُؤْمِنًۭا وَلِلْمُؤْمِنِينَ وَٱلْمُؤْمِنَـٰتِ وَلَا تَزِدِ ٱلظَّـٰلِمِينَ إِلَّا تَبَارًۢا﴾`

    ];


    let currentIndex = 0;

    const duaText = document.getElementById("duaText");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");


    function renderDua() {

      const text = duas[currentIndex];

      duaText.textContent = text;

      duaText.className = "dua-text";

      if (text.length > 500) {
        duaText.classList.add("very-long");
      } else if (text.length > 200) {
        duaText.classList.add("long");
      } else if (text.length > 130) {
        duaText.classList.add("medium");
      }

      previousButton.disabled = currentIndex === 0;
      nextButton.disabled = currentIndex === duas.length - 1;

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }


    previousButton.addEventListener("click", function () {
      if (currentIndex > 0) {
        currentIndex--;
        renderDua();
      }
    });


    nextButton.addEventListener("click", function () {
      if (currentIndex < duas.length - 1) {
        currentIndex++;
        renderDua();
      }
    });


    /* Keyboard arrow support */

    document.addEventListener("keydown", function (event) {

      if (event.key === "ArrowLeft" && currentIndex > 0) {
        currentIndex--;
        renderDua();
      }

      if (event.key === "ArrowRight" && currentIndex < duas.length - 1) {
        currentIndex++;
        renderDua();
      }

    });


    /* Simple mobile swipe support */

    let touchStartX = 0;
    let touchEndX = 0;

    document.addEventListener("touchstart", function (event) {
      touchStartX = event.changedTouches[0].screenX;
    }, { passive: true });

    document.addEventListener("touchend", function (event) {

      touchEndX = event.changedTouches[0].screenX;

      const difference = touchEndX - touchStartX;

      if (Math.abs(difference) < 60) {
        return;
      }

      if (difference < 0 && currentIndex < duas.length - 1) {
        currentIndex++;
        renderDua();
      }

      if (difference > 0 && currentIndex > 0) {
        currentIndex--;
        renderDua();
      }

    }, { passive: true });


    renderDua();

  </script>

</body>
</html>
